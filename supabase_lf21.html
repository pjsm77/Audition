<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Biblioteca - Ultra Fast</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #ba0000; --bg: #121212; --surface: #1e1e1e; --text: #e0e0e0; --secondary-text: #888; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 10px; }
        .container { max-width: 1000px; margin: auto; }
        
        .controls { background: var(--surface); padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 10px; }
        input { background: #2a2a2a; border: 1px solid #444; color: white; padding: 10px; border-radius: 4px; flex: 1; min-width: 150px; }

        .scrobble-list { background: var(--surface); border-radius: 8px; overflow: hidden; min-height: 400px; }
        .scrobble-row { display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #2a2a2a; gap: 15px; }

        .cover-wrapper { flex-shrink: 0; }
        .album-cover { width: 64px; height: 64px; border-radius: 3px; object-fit: cover; display: block; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }

        .info-wrapper { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
        .song-title { font-weight: bold; color: #fff; font-size: 1.05em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .artist-link { color: var(--text); text-decoration: none; font-size: 0.95em; }
        .artist-link:hover { color: var(--primary); text-decoration: underline; }
        .album-name { color: var(--secondary-text); font-size: 0.85em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .date-wrapper { flex-shrink: 0; text-align: right; font-size: 0.85em; min-width: 80px; text-decoration: none; cursor: pointer; transition: 0.2s; }
        .date-wrapper:hover { filter: brightness(1.5); }
        .date-day { display: block; color: #bbb; font-weight: bold; }
        .date-time { font-size: 0.9em; opacity: 0.8; color: var(--secondary-text); }

        .pagination { display: flex; justify-content: center; align-items: center; gap: 15px; padding: 20px; }
        .btn-pag { background: #333; border: none; color: white; padding: 10px 18px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-pag:hover:not(:disabled) { background: var(--primary); }
        .btn-pag:disabled { opacity: 0.2; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <input type="text" id="filterSong" placeholder="Filtrar música..." oninput="updateFilters()">
        <input type="text" id="filterArtist" placeholder="Filtrar artista..." oninput="updateFilters()">
    </div>

    <div class="scrobble-list" id="scrobble-container">
        <div style="padding: 40px; text-align: center; color: #666;">Carregando biblioteca...</div>
    </div>

    <div class="pagination">
        <button class="btn-pag" id="prevBtn" onclick="changePage(-1)">Anterior</button>
        <span id="pageInfo">Carregando...</span>
        <button class="btn-pag" id="nextBtn" onclick="changePage(1)">Próxima</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://qdawxpcwkadhfwqhnpsd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_W6LnlxFB_jpBKDN2cn5oKQ_j_g1OZO2';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentPage = 0;
    const limit = 50;
    let allData = []; // Cache para navegação rápida
    let filteredData = [];
    let filterTimeout;

    // 1. CARGA ULTRA RÁPIDA: Carrega apenas os primeiros 50
    async function initialLoad() {
        const { data, error } = await _supabase
            .from('recent_scrobbles_view')
            .select('*')
            .order('date', { ascending: false })
            .limit(limit);

        if (error) return console.error(error);
        
        allData = data;
        filteredData = [...allData];
        renderList(filteredData);
        updateUI(limit); // Estimativa inicial

        // 2. CARGA COMPLEMENTAR: Carrega o resto em background
        loadRemainingData();
    }

    async function loadRemainingData() {
        const { data, count, error } = await _supabase
            .from('recent_scrobbles_view')
            .select('*', { count: 'exact' })
            .order('date', { ascending: false });

        if (!error) {
            allData = data;
            applyFilters(false); // Atualiza silenciosamente
            updateUI(count);
        }
    }

    function renderList(data) {
        const container = document.getElementById('scrobble-container');
        const baseUrl = "https://www.last.fm/music/";
        const pageData = data.slice(currentPage * limit, (currentPage + 1) * limit);

        container.innerHTML = pageData.map(item => {
            const scrobbleDate = new Date(item.date);
            const dateStr = scrobbleDate.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });
            const timeStr = scrobbleDate.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

            let albumLink = item.album_link || `${baseUrl}${encodeURIComponent(item.artist)}/${encodeURIComponent(item.album || '')}`;
            if (albumLink && !albumLink.startsWith('http')) albumLink = "https://www.last.fm/music/" + albumLink;

            return `
                <div class="scrobble-row">
                    <div class="cover-wrapper">
                        <a href="${albumLink}" target="_blank">
                            <img src="${item.album_art || ''}" class="album-cover" onerror="this.src='https://lastfm.freetls.fastly.net/i/u/64s/4128a6eb29f94943c9d206c08e625904.png'">
                        </a>
                    </div>
                    
                    <div class="info-wrapper">
                        <div class="song-title">${item.song}</div>
                        <a href="${baseUrl}${encodeURIComponent(item.artist)}" class="artist-link" target="_blank">${item.artist}</a>
                        <div class="album-name">${item.album || '—'}</div>
                    </div>

                    <a class="date-wrapper" onclick="openDeezer('${item.artist.replace(/'/g, "\\'")}', '${(item.album || '').replace(/'/g, "\\'")}')" title="Ouvir no Deezer">
                        <span class="date-day">${dateStr}</span>
                        <span class="date-time">${timeStr}</span>
                    </a>
                </div>
            `;
        }).join('');
    }

    // OPÇÃO 2: API DO DEEZER VIA SCRIPT
    async function openDeezer(artist, album) {
        if (!album || album === '—') {
            window.open(`https://www.deezer.com/search/${encodeURIComponent(artist)}`, '_blank');
            return;
        }

        try {
            // Busca na API pública
            const query = encodeURIComponent(`album:"${album}" artist:"${artist}"`);
            const response = await fetch(`https://api.deezer.com/search/album?q=${query}`);
            const result = await response.json();

            if (result.data && result.data.length > 0) {
                window.open(result.data[0].link, '_blank');
            } else {
                // Fallback para busca manual se a API falhar
                window.open(`https://www.deezer.com/search/${encodeURIComponent(artist + ' ' + album)}`, '_blank');
            }
        } catch (e) {
            window.open(`https://www.deezer.com/search/${encodeURIComponent(artist + ' ' + album)}`, '_blank');
        }
    }

    function applyFilters(shouldRender = true) {
        const s = document.getElementById('filterSong').value.toLowerCase();
        const a = document.getElementById('filterArtist').value.toLowerCase();

        filteredData = allData.filter(item => 
            item.song.toLowerCase().includes(s) && 
            item.artist.toLowerCase().includes(a)
        );

        if (shouldRender) {
            currentPage = 0;
            renderList(filteredData);
            updateUI(filteredData.length);
        }
    }

    function updateUI(total) {
        const totalPages = Math.ceil(total / limit) || 1;
        document.getElementById('pageInfo').innerText = `Pág. ${currentPage + 1} de ${totalPages}`;
        document.getElementById('prevBtn').disabled = currentPage === 0;
        document.getElementById('nextBtn').disabled = (currentPage + 1) * limit >= total;
    }

    function changePage(delta) {
        currentPage += delta;
        window.scrollTo(0, 0);
        renderList(filteredData);
        updateUI(filteredData.length);
    }

    function updateFilters() {
        clearTimeout(filterTimeout);
        filterTimeout = setTimeout(() => applyFilters(true), 400);
    }

    initialLoad();
</script>
</body>
</html>
