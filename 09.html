<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Life Tracker V9 - Data Management</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #ffffff;
            /* Escala de Cores Extraída da Imagem */
            --c1: #F87171; --c2: #FB923C; --c3: #FBBF24; --c4: #FACC15; --c5: #EAB308;
            --c6: #D9F99D; --c7: #BEF264; --c8: #84CC16; --c9: #4ADE80; --c10: #22C55E;
        }

        body { font-family: 'Segoe UI', system-ui; background: var(--bg); color: var(--text); margin: 0; padding: 10px; }
        .date-display { font-size: 1.1rem; font-weight: bold; color: #4a90e2; text-align: center; margin: 10px 0; text-transform: capitalize; }
        .chart-card { background: var(--card-bg); padding: 15px; border-radius: 15px; height: 260px; margin-bottom: 15px; }

        .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; }
        .toolbar select, .toolbar input { background: #2d2d2d; border: 1px solid #444; color: white; padding: 10px; border-radius: 8px; flex: 1; font-size: 0.85rem; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 12px; }

        .prog-btn {
            aspect-ratio: 1/1; border-radius: 18px; border: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; transition: all 0.2s; cursor: pointer; color: white; padding: 5px;
        }

        .st-none { opacity: 0.4; filter: grayscale(0.4); }
        .st-active { opacity: 1; filter: none; }

        /* Labels V8 Contexto */
        .top-left { position: absolute; top: 6px; left: 8px; font-size: 0.75rem; font-weight: bold; }
        .top-right { position: absolute; top: 6px; right: 8px; font-size: 0.75rem; }
        .mid-left { position: absolute; top: 50%; left: 6px; transform: translateY(-50%); font-size: 0.65rem; font-weight: 800; background: rgba(0,0,0,0.2); padding: 2px 4px; border-radius: 4px; }
        .mid-right { position: absolute; top: 50%; right: 6px; transform: translateY(-50%); font-size: 0.75rem; font-weight: 800; }
        .sigla { font-size: 1.2rem; font-weight: 950; }
        .bottom-left { position: absolute; bottom: 6px; left: 8px; font-size: 0.65rem; font-weight: bold; }
        .bottom-right { position: absolute; bottom: 6px; right: 8px; font-size: 0.65rem; color: #ffd700; }

        /* Modal Customizado V9 */
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 400px; background: #252525; border-radius: 20px; padding: 20px; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .close-btn { background: none; border: none; color: #ff6b6b; font-size: 1.5rem; cursor: pointer; }
        .log-list { max-height: 150px; overflow-y: auto; margin-top: 15px; border-top: 1px solid #444; padding-top: 10px; }
        .log-item { display: flex; justify-content: space-between; background: #333; padding: 8px; border-radius: 8px; margin-bottom: 5px; font-size: 0.9rem; }
        .log-actions button { background: none; border: none; color: #888; margin-left: 10px; cursor: pointer; }
        .log-actions button:hover { color: #fff; }
        .modal-input { width: 100%; background: #333; border: 2px solid #555; color: white; padding: 12px; border-radius: 10px; font-size: 1.4rem; text-align: center; box-sizing: border-box; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999; backdrop-filter: blur(3px); }
    </style>
</head>
<body>

    <div id="dateDisplay" class="date-display"></div>
    <div class="chart-card"><canvas id="perfChart"></canvas></div>

    <div class="toolbar">
        <select id="sortFilter" onchange="renderGrid()">
            <option value="sigla">Sigla</option>
            <option value="prio">Prioridade</option>
            <option value="status">Realizado</option>
        </select>
        <input type="text" id="searchFilter" placeholder="Buscar programa..." onkeyup="renderGrid()">
    </div>

    <div class="grid" id="mainGrid"></div>

    <div class="overlay" id="overlay" onclick="closeModal()"></div>
    <div id="modal" class="modal">
        <div class="modal-header">
            <h3 id="mTitle" style="margin:0">Programa</h3>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <input type="number" id="valInput" class="modal-input" placeholder="Novo XP...">
        <div id="logList" class="log-list"></div>
    </div>

<script>
    const COLORS = ["#F87171", "#FB923C", "#FBBF24", "#FACC15", "#EAB308", "#D9F99D", "#BEF264", "#84CC16", "#4ADE80", "#22C55E"];
    const CATS = { SAUDE: "#40c057", ESTUDOS: "#228be6", PROF: "#fab005", MENTAL: "#be4bdb", SOCIAL: "#fd7e14", FINAN: "#12b886" };

    let db = JSON.parse(localStorage.getItem('life_v9_db')) || { logs: [] };
    let activeDate = new Date().toISOString().split('T')[0];
    let chartInstance = null;
    let currentEditingSigla = null;

    const programs = [
        { s: "LIS", n: "Listening", c: "ESTUDOS", mk: 5, md: 10, lvl: 3, strk: 5, prio: 1, freq: "D" },
        { s: "GYM", n: "Gym", c: "SAUDE", mk: 1, md: 1, lvl: 5, strk: 7, prio: 1, freq: "U" },
        { s: "COD", n: "Coding", c: "PROF", mk: 30, md: 60, lvl: 4, strk: 3, prio: 2, freq: "U" },
        { s: "H2O", n: "Water", c: "SAUDE", mk: 4, md: 8, lvl: 2, strk: 12, prio: 1, freq: "D" },
        { s: "REA", n: "Reading", c: "MENTAL", mk: 10, md: 20, lvl: 1, strk: 4, prio: 2, freq: "D" },
        { s: "MED", n: "Meditation", c: "MENTAL", mk: 5, md: 15, lvl: 3, strk: 6, prio: 3, freq: "F" },
        { s: "RUN", n: "Running", c: "SAUDE", mk: 3, md: 5, lvl: 2, strk: 1, prio: 2, freq: "S" },
        { s: "SAV", n: "Finance", c: "FINAN", mk: 1, md: 1, lvl: 4, strk: 0, prio: 1, freq: "M" },
        { s: "ENG", n: "English", c: "ESTUDOS", mk: 20, md: 40, lvl: 5, strk: 3, prio: 2, freq: "Q" },
        { s: "SOC", n: "Social", c: "SOCIAL", mk: 1, md: 2, lvl: 2, strk: 0, prio: 3, freq: "E" },
        { s: "SLP", n: "Sleep", c: "SAUDE", mk: 7, md: 8, lvl: 3, strk: 30, prio: 1, freq: "D" },
        { s: "WRT", n: "Writing", c: "MENTAL", mk: 200, md: 500, lvl: 1, strk: 2, prio: 3, freq: "U" }
    ];

    function initDashboard() {
        const opt = { weekday: 'long', day: 'numeric', month: 'long' };
        document.getElementById('dateDisplay').innerText = new Date(activeDate + "T12:00:00").toLocaleDateString('pt-BR', opt);
        renderGrid();
        renderChart();
    }

    function renderGrid() {
        const grid = document.getElementById('mainGrid');
        const search = document.getElementById('searchFilter').value.toUpperCase();
        const sort = document.getElementById('sortFilter').value;

        let list = programs.filter(p => p.s.includes(search));
        if(sort === 'prio') list.sort((a,b) => a.prio - b.prio);
        if(sort === 'status') list.sort((a,b) => getDayTotal(b.s, activeDate) - getDayTotal(a.s, activeDate));

        grid.innerHTML = '';
        list.forEach(p => {
            const val = getDayTotal(p.s, activeDate);
            const status = val >= p.mk ? "st-active" : "st-none";
            grid.innerHTML += `
                <div class="prog-btn ${status}" style="background-color: ${CATS[p.c]}" onclick="openManageModal('${p.s}')">
                    <span class="top-left">${val || ''}</span>
                    <span class="mid-left">P${p.prio}</span>
                    <span class="sigla">${p.s}</span>
                    <span class="mid-right">${p.freq}</span>
                    <span class="bottom-left">L${p.lvl}</span>
                    <span class="bottom-right">${p.strk ? p.strk + '🔥' : ''}</span>
                </div>`;
        });
    }

    function renderChart() {
        const ctx = document.getElementById('perfChart').getContext('2d');
        const period = 7;
        const labels = [], scores = [], barColors = [];

        for(let i = period - 1; i >= 0; i--) {
            let d = new Date(); d.setDate(d.getDate() - i);
            let ds = d.toISOString().split('T')[0];
            labels.push(ds.split('-')[2]);

            let dayPct = 0;
            programs.forEach(p => {
                let v = getDayTotal(p.s, ds);
                dayPct += Math.min(1, v / p.md);
            });
            let final = Math.round((dayPct / programs.length) * 100);
            scores.push(final);
            barColors.push(COLORS[Math.min(9, Math.floor(final/10))]);
        }

        // Cálculo Simples de Linha de Tendência (Média Móvel)
        const trendData = scores.map((val, idx, arr) => {
            if (idx === 0) return val;
            return (arr[idx-1] + val) / 2;
        });

        if(chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
            data: {
                labels: labels,
                datasets: [
                    { type: 'bar', data: scores, backgroundColor: barColors, borderRadius: 5, barPercentage: 0.6 },
                    { type: 'line', data: trendData, borderColor: '#fff', borderWidth: 2, pointRadius: 0, fill: false, tension: 0.4 }
                ]
            },
            options: {
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { 
                    y: { display: false, max: 100 }, 
                    x: { grid: { display: false }, ticks: { color: '#888' } } 
                },
                onClick: (e, el) => {
                    if(el.length > 0) {
                        let d = new Date(); d.setDate(d.getDate() - (period - 1 - el[0].index));
                        activeDate = d.toISOString().split('T')[0]; initDashboard();
                    }
                }
            }
        });
    }

    function openManageModal(sigla) {
        currentEditingSigla = sigla;
        const p = programs.find(x => x.s === sigla);
        document.getElementById('mTitle').innerText = p.n;
        updateLogList();
        
        document.getElementById('modal').style.display = 'block';
        document.getElementById('overlay').style.display = 'block';
        
        const input = document.getElementById('valInput');
        input.value = '';
        setTimeout(() => input.focus(), 100);

        input.onkeypress = (e) => {
            if(e.key === 'Enter') {
                const val = parseFloat(input.value);
                if(!isNaN(val)) {
                    db.logs.push({ id: Date.now(), s: sigla, d: activeDate, v: val });
                    saveAndRefresh();
                    closeModal();
                }
            }
        };
    }

    function updateLogList() {
        const listDiv = document.getElementById('logList');
        const dayLogs = db.logs.filter(l => l.s === currentEditingSigla && l.d === activeDate);
        
        listDiv.innerHTML = dayLogs.length ? '<strong>Registros de hoje:</strong>' : 'Nenhum registro hoje.';
        dayLogs.forEach(l => {
            listDiv.innerHTML += `
                <div class="log-item">
                    <span>${l.v} XP</span>
                    <div class="log-actions">
                        <button onclick="editLog(${l.id})"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteLog(${l.id})"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>`;
        });
    }

    function deleteLog(id) {
        db.logs = db.logs.filter(l => l.id !== id);
        saveAndRefresh();
        updateLogList();
    }

    function editLog(id) {
        const log = db.logs.find(l => l.id === id);
        const newVal = prompt("Editar valor:", log.v);
        if(newVal !== null) {
            log.v = parseFloat(newVal);
            saveAndRefresh();
            updateLogList();
        }
    }

    function saveAndRefresh() {
        localStorage.setItem('life_v9_db', JSON.stringify(db));
        renderGrid();
        renderChart();
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
        document.getElementById('overlay').style.display = 'none';
    }

    function getDayTotal(s, d) {
        return db.logs.filter(l => l.s === s && l.d === d).reduce((a, b) => a + b.v, 0);
    }

    initDashboard();
</script>
</body>
</html>
