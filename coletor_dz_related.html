<!DOCTYPE html>

<body>

<button onclick="generate()">Gerar recomendações</button>
<button onclick="downloadCSV()">Baixar CSV</button>

<div id="status"></div>

<table id="resultTable"></table>

<script>
const CORS_PROXY = "https://corsproxy.io/?";
const API_URL = "https://api.deezer.com/artist/";

let allRows = [];

function parseInput() {
  const lines = document.getElementById("inputArtists").value.trim().split("\n");
  const artists = {};
  lines.forEach(line => {
    const [id, nota] = line.split(",");
    if (id && nota) {
      artists[id.trim()] = parseInt(nota.trim());
    }
  });
  return artists;
}

function recommendationScore(baseNota, relatedNota, order) {
  const pesoBase = baseNota / 3;
  const pesoRelated = relatedNota ? relatedNota / 3 : 0.5;
  const pesoOrdem = (21 - order) / 20;

  let score =
    (0.5 * pesoBase) +
    (0.3 * pesoRelated) +
    (0.2 * pesoOrdem);

  if (!relatedNota) score += 0.15; // bônus descoberta

  return score.toFixed(3);
}

async function generate() {
  document.getElementById("status").innerText = "Processando...";
  allRows = [];

  const baseArtists = parseInput();

  for (const baseId in baseArtists) {
    const baseNota = baseArtists[baseId];

    const response = await fetch(
      `${CORS_PROXY}${API_URL}${baseId}/related`
    );
    const data = await response.json();

    data.data.forEach((artist, index) => {
      const relatedNota = baseArtists[artist.id] || 0;

      const score = recommendationScore(
        baseNota,
        relatedNota,
        index + 1
      );

      allRows.push({
        base_artist_id: baseId,
        base_artist_nota: baseNota,
        related_number: index + 1,
        related_artist_id: artist.id,
        related_artist_name: artist.name,
        related_artist_link: artist.link,
        related_nb_album: artist.nb_album,
        related_nb_fan: artist.nb_fan,
        related_artist_nota: relatedNota,
        recommendation_score: score
      });
    });
  }

  renderTable();
  document.getElementById("status").innerText =
    `Concluído! ${allRows.length} registros gerados.`;
}

function renderTable() {
  const table = document.getElementById("resultTable");
  table.innerHTML = "";

  if (!allRows.length) return;

  const headers = Object.keys(allRows[0]);
  const thead = document.createElement("tr");

  headers.forEach(h => {
    const th = document.createElement("th");
    th.innerText = h;
    thead.appendChild(th);
  });

  table.appendChild(thead);

  allRows
    .sort((a, b) => b.recommendation_score - a.recommendation_score)
    .forEach(row => {
      const tr = document.createElement("tr");
      headers.forEach(h => {
        const td = document.createElement("td");
        td.innerText = row[h];
        tr.appendChild(td);
      });
      table.appendChild(tr);
    });
}

function downloadCSV() {
  if (!allRows.length) return;

  const headers = Object.keys(allRows[0]);
  const csv = [
    headers.join(","),
    ...allRows.map(r =>
      headers.map(h => `"${r[h]}"`).join(",")
    )
  ].join("\n");

  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "deezer_recommendations.csv";
  a.click();
}
</script>

</body>
