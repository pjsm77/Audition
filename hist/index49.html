<script>
const SHEET_ID = '1QCyU_zShDAWzsZm1G-8cMUamrMdUOvyc3AIXtnhfiUw'; 

const SHEETS_CONFIG = [
    { name: 'Alb', gid: '1120041506' },
    { name: 'Art', gid: '46372522' },
    { name: 'Sta', gid: '45947330' },
    { name: 'Paí', gid: '1789152441' } 
];

let currentSheet = SHEETS_CONFIG[0];
let allData = [];
let ALBUM_DATA = []; 
let DEEZER_DATA = {}; 
let activeFilter = { key: null, value: null, columnName: null };
let sortState = { columnKey: null, direction: 'asc' }; 
let activeCountryFilter = null;
let artSortState = { columnKey: null, direction: 'desc' }; 
let paiSortState = { columnKey: null, direction: 'desc' };

const contactList = document.getElementById('contact-list');
const statusMessage = document.getElementById('status-message');
const searchInput = document.getElementById('search-input');
const noResultsMessage = document.getElementById('no-results');
const sheetNav = document.getElementById('sheet-nav');
const sortControlsContainer = document.getElementById('sort-controls');
const resultsCountElement = document.getElementById('results-count');
const clearFilterBtn = document.getElementById('clear-filter-btn');
const searchControlsContainer = document.getElementById('search-controls-container');

const SORTABLE_INDICES = [0,1,2,3,4,5,9,52];
const COLUMN_TITLES = {
    0: 'album_id', 1: 'date', 2: 'artist', 3: 'artist_rating', 4: 'year', 5: 'album', 
    9: 'country', 52: 'BA (Col 53)'
};

const getSheetUrl = gid => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${gid}`;

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

function parseDDMMAADate(dateString){
    if(!dateString) return 0;
    const parts = dateString.split('/');
    if(parts.length !== 3) return 0;
    let [day,month,year] = parts.map(p=>parseInt(p.trim(),10));
    if(year >=0 && year < 100) year = year >=70 ? year+1900 : year+2000;
    return new Date(year, month-1, day).getTime();
}

function getColumnKeyByIndex(index){
    if(allData.length === 0 || !allData[0]) return null;
    const allKeys = Object.keys(allData[0]);
    return allKeys[index] || null;
}

function openCoverModal(albumId) {
    if(!albumId || !DEEZER_DATA[albumId]) return;
    const modal = document.getElementById('cover-modal');
    const image = document.getElementById('modal-cover-image');
    image.src = DEEZER_DATA[albumId].capa_xl; // Puxa a capa extra grande
    modal.classList.remove('hidden');
    document.addEventListener('keydown', handleEscKey);
}

function closeCoverModal() {
    const modal = document.getElementById('cover-modal');
    modal.classList.add('hidden');
    document.removeEventListener('keydown', handleEscKey);
}

function handleEscKey(event) {
    if (event.key === 'Escape') {
        closeCoverModal();
        closeAlbumTooltip();
    }
}

function sortAlbumsByYear(albums, keyYear) {
    if (!keyYear) return albums;
    return albums.sort((a, b) => {
        const yearA = parseInt(a[keyYear]) || 0;
        const yearB = parseInt(b[keyYear]) || 0;
        return yearA - yearB;
    });
}

function showArtistAlbums(artistName) {
    if (ALBUM_DATA.length === 0) {
        alert("Ainda carregando dados do álbum. Por favor, espere até que a aba 'Alb' seja carregada.");
        return;
    }
    const allKeys = Object.keys(ALBUM_DATA[0]);
    const keyAlbum = allKeys[5];
    const keyYear = allKeys[4];
    const keyArtistName = allKeys[2];
    const filteredAlbums = ALBUM_DATA.filter(album => 
        String(album[keyArtistName]).toUpperCase() === String(artistName).toUpperCase()
    );
    const sortedAlbums = sortAlbumsByYear(filteredAlbums, keyYear);
    let listHtml = sortedAlbums.map(album => {
        const year = album[keyYear] || 'Ano?';
        const albumName = album[keyAlbum] || 'Álbum Desconhecido';
        return `<li class="p-1 border-b border-gray-700 last:border-b-0 flex justify-between items-center">
            <span class="text-gray-200 font-bold mr-3 text-lg">${year}</span>
            <span class="text-white font-medium text-right text-base">${albumName}</span>
        </li>`;
    }).join('');
    const modalTitle = `ÁLBUNS DE: <span class="text-indigo-400">${artistName.toUpperCase()}</span> (${sortedAlbums.length})`;
    const modalContent = document.getElementById('album-tooltip-content');
    modalContent.innerHTML = `
        <h3 class="text-xl font-bold mb-3 text-white border-b border-indigo-400 pb-2">${modalTitle}</h3>
        <ul class="max-h-[70vh] overflow-y-auto pr-2 custom-scrollbar">${listHtml}</ul>
    `;
    document.getElementById('album-tooltip-modal').classList.remove('hidden');
    document.addEventListener('keydown', handleEscKey);
}

function closeAlbumTooltip() {
    document.getElementById('album-tooltip-modal').classList.add('hidden');
    document.removeEventListener('keydown', handleEscKey);
}

function isFullFeatureSheet(){ return currentSheet.name === 'Alb'; }

function createSortControls(){
    if(!isFullFeatureSheet()){
        sortControlsContainer.innerHTML = '';
        if(currentSheet.name !== 'Art' && currentSheet.name !== 'Paí') {
            searchControlsContainer.classList.add('hidden');
        } else {
            searchControlsContainer.classList.remove('hidden');
        }
        return;
    }
    searchControlsContainer.classList.remove('hidden');
    if(allData.length === 0){ sortControlsContainer.innerHTML = ''; return; }
    const allKeys = Object.keys(allData[0]);
    const availableSortOptions = SORTABLE_INDICES
        .filter(index => allKeys[index])
        .map(index => ({
            key: allKeys[index],
            label: (COLUMN_TITLES[index] === 'album_id' ? 'Album ID' :
                   (COLUMN_TITLES[index] === 'artist_rating' ? 'Rating' :
                   (COLUMN_TITLES[index] === 'date' ? 'Data' : (COLUMN_TITLES[index] || allKeys[index]))))
        }));
    const currentIcon = sortState.direction === 'asc' ? '?' : '?';
    const currentTitle = sortState.direction === 'asc' ? 'Direção Ascendente' : 'Direção Decrescente';
    const isDirectionBtnDisabled = !sortState.columnKey;
    const selectHtml = availableSortOptions.length > 0 ? `
        <label for="sort-column" class="text-gray-700 font-medium whitespace-nowrap mr-2 text-sm">Ordenar por:</label>
        <select id="sort-column" class="p-2 border border-gray-300 rounded-lg flex-grow cursor-pointer bg-white transition duration-150">
            <option value="" disabled>${sortState.columnKey ? 'Título Selecionado' : '-- Selecione o Título --'}</option>
            ${availableSortOptions.map(opt=>`<option value="${opt.key}">${opt.label}</option>`).join('')}
        </select>
    ` : `<p class="text-sm text-red-500">Sem colunas ordenáveis disponíveis.</p>`;
    const directionButtonHtml = `
        <button id="sort-direction-btn" class="p-2 bg-indigo-500 text-white rounded-lg shadow-md hover:bg-indigo-600 transition disabled:bg-gray-300 disabled:text-gray-500" ${isDirectionBtnDisabled ? 'disabled' : ''}>
            <span id="sort-icon" title="${currentTitle}">${currentIcon}</span>
        </button>
    `;
    sortControlsContainer.innerHTML = `
        <div class="flex items-center flex-grow space-x-2">${selectHtml}</div>
        ${directionButtonHtml}
    `;
    const sortSelect = document.getElementById('sort-column');
    const sortDirectionBtn = document.getElementById('sort-direction-btn');
    const sortIcon = document.getElementById('sort-icon');
    if(sortSelect){
        if(sortState.columnKey) sortSelect.value = sortState.columnKey;
        sortSelect.addEventListener('change', (e)=>{
            sortState.columnKey = e.target.value;
            sortState.direction = 'asc';
            if(sortDirectionBtn) sortDirectionBtn.disabled = false;
            if(sortIcon){ sortIcon.textContent = '?'; sortIcon.title = 'Direção Ascendente'; }
            applySortAndFilter();
        });
    }
    if(sortDirectionBtn){
        sortDirectionBtn.addEventListener('click', ()=>{
            sortState.direction = sortState.direction === 'asc' ? 'desc' : 'asc';
            if(sortIcon) sortIcon.textContent = sortState.direction === 'asc' ? '?' : '?';
            applySortAndFilter();
        });
    }
}

function sortData(){
    if(!isFullFeatureSheet()) return;
    const { columnKey, direction } = sortState;
    if(!columnKey || allData.length === 0) return;
    allData.sort((a,b)=>{
        const valA = a[columnKey];
        const valB = b[columnKey];
        let comparison = 0;
        if(columnKey === getColumnKeyByIndex(1)){
            const timeA = parseDDMMAADate(valA);
            const timeB = parseDDMMAADate(valB);
            comparison = timeA - timeB;
        } else {
            const isNumericKey = [0,3,4].includes(Object.keys(allData[0]).indexOf(columnKey));
            if(isNumericKey){
                const numA = parseFloat(valA) || 0;
                const numB = parseFloat(valB) || 0;
                comparison = numA - numB;
            } else {
                const strA = String(valA).toLowerCase();
                const strB = String(valB).toLowerCase();
                if(strA === '' && strB !== '') comparison = 1;
                else if(strA !== '' && strB === '') comparison = -1;
                else if(strA > strB) comparison = 1;
                else if(strA < strB) comparison = -1;
            }
        }
        return direction === 'asc' ? comparison : comparison * -1;
    });
}

function applySortAndFilter(){
    if(currentSheet.name === 'Alb') sortData();
    applyFilterAndSearch();
    updateClearFilterButton();
}

function parseSheetData(jsonText) {
    try {
        const startIndex = jsonText.indexOf('(');
        const endIndex = jsonText.lastIndexOf(')');
        if(startIndex === -1 || endIndex === -1) throw new Error("Resposta do Sheets com formato inesperado.");
        const jsonString = jsonText.substring(startIndex+1, endIndex);
        const json = JSON.parse(jsonString);
        if(!json.table || !json.table.rows) throw new Error("Estrutura da planilha inválida ou vazia.");
        const columns = json.table.cols.map(col => col.label || col.id);
        const rows = json.table.rows;
        const contacts = [];
        rows.forEach(row=>{
            const contact = {};
            row.c.forEach((cell,index)=>{
                const key = columns[index];
                contact[key] = cell && (cell.f || cell.v) || '';
            });
            contacts.push(contact);
        });
        return contacts;
    } catch (error) {
        console.error("Erro ao processar dados da planilha:", error);
        statusMessage.textContent = "ERRO: Falha ao processar os dados da planilha.";
        statusMessage.classList.add('text-red-600');
        return [];
    }
}

function getNumericValue(value) {
    if (!value) return 0;
    const str = String(value).trim();
    if (str === '') return 0;
    const num = parseFloat(str.replace(/\./g, '').replace(',', '.'));
    return isNaN(num) ? 0 : num;
}

function processRankingData(rawData){
    if(rawData.length === 0) return [];
    if(currentSheet.name === 'Art'){
        if(artSortState.columnKey){
            const { columnKey, direction } = artSortState;
            const directionMultiplier = direction === 'desc' ? 1 : -1;
            rawData.sort((a, b) => {
                const valA = getNumericValue(a[columnKey]);
                const valB = getNumericValue(b[columnKey]);
                const rawComparison = valB - valA; 
                return rawComparison * directionMultiplier;
            });
        }
        return rawData;
    }
    if(currentSheet.name === 'Paí'){
        const allKeys = Object.keys(rawData[0] || {});
        const keyName = allKeys[0];
        const keyArtistas = allKeys[2];
        const { columnKey, direction } = paiSortState;
        const sortKey = columnKey || keyArtistas;
        rawData.sort((a, b) => {
            let comparison = 0;
            if (sortKey === keyName) {
                const valA = String(a[sortKey] || '').toLowerCase();
                const valB = String(b[sortKey] || '').toLowerCase();
                comparison = valA.localeCompare(valB);
            } else {
                const valA = getNumericValue(a[sortKey]);
                const valB = getNumericValue(b[sortKey]);
                comparison = valB - valA;
            }
            return direction === 'desc' ? comparison : comparison * -1;
        });
        return rawData;
    }
    return rawData;
}

function sortRankingData(columnKey, columnName) {
    if (currentSheet.name === 'Art') {
        const isNewSort = artSortState.columnKey !== columnKey;
        if (isNewSort) {
            artSortState.columnKey = columnKey;
            artSortState.direction = 'desc'; 
        } else {
            artSortState.direction = artSortState.direction === 'desc' ? 'asc' : 'desc';
        }
        activeCountryFilter = null; 
        allData = processRankingData(allData);
        applySortAndFilter();
    } else if (currentSheet.name === 'Paí') {
        const isNewSort = paiSortState.columnKey !== columnKey;
        if (isNewSort) {
            paiSortState.columnKey = columnKey;
            paiSortState.direction = 'desc'; 
        } else {
            paiSortState.direction = paiSortState.direction === 'desc' ? 'asc' : 'desc';
        }
        allData = processRankingData(allData);
        applySortAndFilter();
    }
}

function createContactCard(contact, index){
    const allKeys = Object.keys(contact);
    const indexAlbumId = 0, indexAlbum = 5, indexYear = 4, indexArtist = 2, indexArtistRating = 3, indexCountryCode = 9;
    
    // Pega o album_id bruto e remove espaços
    const valueAlbumId = allKeys[indexAlbumId] ? String(contact[allKeys[indexAlbumId]]).trim() : '';
    const keyAlbum = allKeys[indexAlbum] || null;
    const keyArtist = allKeys[indexArtist] || null;
    const keyCountryCode = allKeys[indexCountryCode] || null;
    const valueYear = allKeys[indexYear] ? contact[allKeys[indexYear]] : '';
    const valueAlbum = keyAlbum ? contact[keyAlbum] : 'N/A';
    const valueArtist = keyArtist ? contact[keyArtist] : 'N/A';
    const valueArtistRating = allKeys[indexArtistRating] ? String(contact[allKeys[indexArtistRating]]).trim() : '';
    const valueCountryCode = keyCountryCode ? String(contact[keyCountryCode]).toLowerCase() : '';
    
    let coverImageHtml = '';
    
    // REVISÃO: Apenas atribui capa se o ID existir no JSON
    if (valueAlbumId && DEEZER_DATA[valueAlbumId]) {
        const thumbUrl = DEEZER_DATA[valueAlbumId].capa_sm;
        coverImageHtml = `
            <img src="${thumbUrl}" alt="Capa de ${valueAlbum}"
                 class="h-[50px] w-auto object-cover rounded-md shadow-md ml-4 flex-shrink-0 cursor-pointer hover:shadow-lg transition duration-150"
                 onclick="event.stopPropagation(); openCoverModal('${valueAlbumId}')"
                 onerror="this.style.display='none';">
        `;
    }

    const ratingColors = { '3': '#6dbe99', '2': '#f8c039', '1': '#e97b78' };
    const artistColor = ratingColors[valueArtistRating] || '#4f46e5';
    const displayArtist = String(valueArtist).toUpperCase();
    const albumTitle = valueAlbum;
    const yearSuffix = valueYear ? ` (${valueYear})` : '';
    const filterArtistAction = `event.stopPropagation(); filterByArtist('${displayArtist.replace(/'/g,"\\'")}', '${keyArtist}')`;
    const filterCountryAction = `event.stopPropagation(); filterByCountry('${valueCountryCode.replace(/'/g,"\\'")}', '${keyCountryCode}')`;
    
    let flagImageHtml = '';
    const codeUpper = valueCountryCode.toUpperCase();
    if (valueCountryCode && valueCountryCode.length >= 2 ) {
        const flagUrl = `https://flagcdn.com/40x30/${valueCountryCode}.png`;
        flagImageHtml = `
            <div onclick="${filterCountryAction}" class="cursor-pointer hover:opacity-80 transition duration-150 relative mr-3 flex-shrink-0">
                <img src="${flagUrl}" alt="${codeUpper}" class="w-8 h-auto rounded-md shadow-sm" onerror="this.style.opacity='0'; this.nextElementSibling.classList.remove('hidden');">
                <span class="text-gray-400 text-xs hidden absolute left-0 top-0 mt-1">${codeUpper}</span>
            </div>
        `;
    } else if (valueCountryCode) {
        flagImageHtml = `<span onclick="${filterCountryAction}" class="text-gray-400 text-xs mr-3 flex-shrink-0 cursor-pointer hover:text-indigo-500">${codeUpper}</span>`;
    }

    const card = document.createElement('div');
    card.className = 'contact-card bg-white p-2 rounded-xl shadow-md hover:shadow-lg hover:scale-[1.002] transition duration-300 cursor-pointer border-t border-gray-100';
    card.setAttribute('data-index', index);
    card.onclick = () => toggleDetails(card);
    
    card.innerHTML = `
        <div class="flex justify-between items-start relative">
            <div class="flex items-start mb-0 min-w-0 flex-grow">
                ${flagImageHtml}
                <div class="min-w-0">
                    <h2 class="text-lg font-semibold text-gray-800 leading-snug break-words">
                        ${albumTitle}<span class="text-gray-400 font-normal ml-1">${yearSuffix}</span>
                    </h2>
                    <p class="text-base font-bold cursor-pointer hover:text-indigo-600 transition break-words"
                       style="color: ${artistColor};" onclick="${filterArtistAction}">${displayArtist}</p>
                </div>
            </div>
            ${coverImageHtml} 
        </div>
        <div class="details-panel">
            <div class="mt-2 pt-2 border-t border-gray-100">
                ${allKeys.map((key, kIdx) => {
                    const val = contact[key];
                    if(!val) return '';
                    let title = COLUMN_TITLES[kIdx] || key;
                    return `<p class="text-sm mb-1 flex justify-between items-start">
                        <span class="font-normal text-gray-500">${title}:</span>
                        <span class="text-gray-700 font-medium ml-4 text-right">${val}</span>
                    </p>`;
                }).join('')}
            </div>
        </div>
    `;
    return card;
}

function createExplicitRankingCard(row, dynamicPos){
    const allKeys = Object.keys(row);
    const keyPos = allKeys[0], keyName = allKeys[1], keyCtry = allKeys[2], keyScore = allKeys[3];
    const keyAlbuns = allKeys[4], keySongs = allKeys[5], keyRating = allKeys[6], keyScrobbles = allKeys[10]; 

    const name = row[keyName] || 'ARTISTA';
    const ctr = String(row[keyCtry]||'').toLowerCase();
    const ratingColors = { '3': '#6dbe99', '2': '#f8c039', '1': '#e97b78' };
    const rate = parseInt(row[keyRating]) || 0; 
    const artistColorHex = ratingColors[rate.toString()] || '#4f46e5';
    const scoreValueRaw = getNumericValue(row[keyScore]);
    const ptsDisplay = scoreValueRaw.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    const isPosSort = artSortState.columnKey === keyPos;
    const posSortIcon = isPosSort ? (artSortState.direction === 'desc' ? ' ?' : ' ?') : ''; 
    
    const card = document.createElement("div");
    card.className = "ranking-card ran-card flex items-center gap-2 shadow-sm border hover:shadow-md transition duration-200";

    const metricsMap = { [keyAlbuns]: 'Albuns', [keySongs]: 'Songs', [keyScrobbles]: 'Scrobbles', [keyScore]: 'Pontos' };
    let metricsHtml = Object.keys(metricsMap).filter(k => k).map(k => {
        const isPts = k === keyScore;
        const val = isPts ? ptsDisplay : getNumericValue(row[k]).toLocaleString('pt-BR');
        const icon = artSortState.columnKey === k ? (artSortState.direction === 'desc' ? ' ?' : ' ?') : '';
        return `<span class="text-sm ${isPts?'text-indigo-600 font-extrabold':'text-gray-400 font-medium'} cursor-pointer" onclick="event.stopPropagation(); sortRankingData('${k}', '${metricsMap[k]}')">${val}${icon}</span>`;
    }).join('<span class="mx-1 text-gray-300 text-sm">|</span>');

    card.innerHTML = `
        <div class="flex-shrink-0 text-sm font-extrabold text-gray-700 w-5 text-right cursor-pointer" onclick="event.stopPropagation(); sortRankingData('${keyPos}', 'POS')">${dynamicPos}${posSortIcon}</div>
        <div class="flex-shrink-0 h-8 flex items-center">
            <img class="ran-flag w-7 h-5" onclick="applyCountryFilter('${ctr}')" src="https://flagcdn.com/32x24/${ctr}.png" onerror="this.style.opacity='0';">
        </div>
        <div class="font-bold truncate text-base cursor-pointer hover:underline flex-grow min-w-[50px] mr-2" style="color: ${artistColorHex}" onclick="event.stopPropagation(); showArtistAlbums('${name.replace(/'/g,"\\'")}')">${name.toUpperCase()}</div>
        <div class="flex-shrink-0 flex items-center justify-end whitespace-nowrap overflow-hidden">${metricsHtml}</div>
    `;
    return card;
}

function createCountryCard(row, dynamicPos){
    const allKeys = Object.keys(row);
    const keyName = allKeys[0], keyCC = allKeys[1], keyArtistas = allKeys[2], keyRating3 = allKeys[3];
    const keyRating2 = allKeys[4], keyRating1 = allKeys[5], keyMusicas = allKeys[6], keyAlbuns = allKeys[7];

    const rawName = (row[keyName] || 'PAÍS').toUpperCase();
    const displayName = rawName.length > 14 ? rawName.substring(0, 14) + '...' : rawName;
    const cc = String(row[keyCC] || '').toLowerCase();
    const tot = getNumericValue(row[keyArtistas]);
    const q3 = getNumericValue(row[keyRating3]), q2 = getNumericValue(row[keyRating2]), q1 = getNumericValue(row[keyRating1]);
    const p3 = tot > 0 ? (q3/tot*100) : 0, p2 = tot > 0 ? (q2/tot*100) : 0, p1 = tot > 0 ? (q1/tot*100) : 0;

    const card = document.createElement("div");
    card.className = "ranking-card ran-card flex flex-col shadow-sm border hover:shadow-md transition duration-200";
    card.innerHTML = `
        <div class="country-grid">
            <div class="text-right font-extrabold text-gray-400">${dynamicPos}</div>
            <div class="flex justify-center"><img class="ran-flag" src="https://flagcdn.com/32x24/${cc}.png" onerror="this.style.opacity='0';"></div>
            <div class="font-bold truncate text-gray-800 cursor-pointer" onclick="event.stopPropagation(); sortRankingData('${keyName}', 'PAÍS')">${displayName}</div>
            <div class="text-center font-bold text-gray-700 cursor-pointer" onclick="event.stopPropagation(); sortRankingData('${keyArtistas}', 'ART')">${tot}</div>
            <div class="text-center text-gray-500 cursor-pointer" onclick="event.stopPropagation(); sortRankingData('${keyAlbuns}', 'ALB')">${getNumericValue(row[keyAlbuns])}</div>
            <div class="text-center text-gray-500 cursor-pointer" onclick="event.stopPropagation(); sortRankingData('${keyMusicas}', 'MÚS')">${getNumericValue(row[keyMusicas])}</div>
            <div class="flex items-center gap-1">
                <div class="bar-container">
                    <div class="bar-3" style="width: ${p3}%"></div><div class="bar-2" style="width: ${p2}%"></div><div class="bar-1" style="width: ${p1}%"></div>
                </div>
                <div class="flex gap-0.5 text-[9px] font-bold min-w-[30px] justify-end">
                    <span style="color:#6dbe99">${q3}</span><span style="color:#f8c039">${q2}</span><span style="color:#e97b78">${q1}</span>
                </div>
            </div>
        </div>
    `;
    return card;
}

function createStaCard(contact, index){
    const keyA = getColumnKeyByIndex(0); 
    const content = String(contact[keyA] || keyA || 'Sem conteúdo de status.').trim();
    const card = document.createElement('div');
    card.className = 'sta-card bg-white p-4 rounded-xl shadow-lg border border-gray-200';
    card.innerHTML = `<div class="text-base text-gray-800 leading-relaxed whitespace-pre-wrap font-sans">${content}</div>`;
    return card;
}

function updateClearFilterButton(){
    const isSearchable = ['Alb','Art','Paí'].includes(currentSheet.name);
    if(!isSearchable){ clearFilterBtn.classList.replace('visible-filter-btn','hidden-filter-btn'); return; }
    const active = (currentSheet.name==='Alb' && activeFilter.key) || searchInput.value.trim()!=='';
    if(active){
        clearFilterBtn.classList.replace('hidden-filter-btn','visible-filter-btn');
        searchInput.placeholder = activeFilter.columnName ? `Filtro: ${activeFilter.columnName}` : "Pesquisar...";
    } else {
        clearFilterBtn.classList.replace('visible-filter-btn','hidden-filter-btn');
        searchInput.placeholder = "Pesquisar...";
    }
}

function filterByArtist(name, key){ if(currentSheet.name==='Alb'){ activeFilter={key, value:name, columnName:'Artista'}; searchInput.value=name; applySortAndFilter(); } }
function filterByCountry(code, key){ if(currentSheet.name==='Alb'){ activeFilter={key, value:code, columnName:'País'}; searchInput.value=code; applySortAndFilter(); } }
function clearActiveFilter(){ activeFilter={key:null, value:null, columnName:null}; searchInput.value=''; applySortAndFilter(); }

function applyFilterAndSearch(){
    const query = searchInput.value.toLowerCase().trim();
    let data = allData;
    if(currentSheet.name==='Alb' && activeFilter.key) data = data.filter(c => String(c[activeFilter.key]).toUpperCase() === String(activeFilter.value).toUpperCase());
    if(query !== ''){
        if(currentSheet.name==='Alb') data = data.filter(c => Object.values(c).join(' ').toLowerCase().includes(query));
        else {
            const kn = getColumnKeyByIndex(0);
            if(kn) data = data.filter(c => String(c[kn]).toLowerCase().includes(query));
        }
    }
    renderData(data);
}

searchInput.addEventListener('input', applySortAndFilter);

function toggleDetails(card){
    const panel = card.querySelector('.details-panel');
    const open = panel.classList.toggle('open');
    card.classList.toggle('border-indigo-400', open);
}

function renderData(data){
    contactList.innerHTML = '';
    let toRender = data;
    if(currentSheet.name==='Sta') toRender = data.slice(0,1);
    if(currentSheet.name==='Art' && activeCountryFilter){
        toRender = toRender.filter(r => String(r[getColumnKeyByIndex(2)]||'').toLowerCase() === activeCountryFilter);
    }
    if(currentSheet.name==='Paí' && toRender.length > 0) {
        const h = document.createElement('div');
        h.className = "country-grid px-2 py-1 mb-1 text-[10px] font-bold text-gray-400 uppercase border-b";
        h.innerHTML = `<div>#</div><div>BAND.</div><div>PAÍS</div><div class="text-center">ART</div><div class="text-center">ALB</div><div class="text-center">MÚS</div><div>RATINGS</div>`;
        contactList.appendChild(h);
    }
    updateClearFilterButton();
    if(toRender.length === 0){
        resultsCountElement.textContent = '0 resultados.';
        noResultsMessage.classList.remove('hidden'); statusMessage.classList.add('hidden');
    } else {
        resultsCountElement.textContent = `${toRender.length} resultado(s).`;
        noResultsMessage.classList.add('hidden'); statusMessage.classList.add('hidden');
        toRender.forEach((c, i) => {
            if(currentSheet.name==='Art') contactList.appendChild(createExplicitRankingCard(c, artSortState.direction==='desc' ? i+1 : toRender.length-i));
            else if(currentSheet.name==='Paí') contactList.appendChild(createCountryCard(c, i+1));
            else if(currentSheet.name==='Sta') contactList.appendChild(createStaCard(c, i));
            else contactList.appendChild(createContactCard(c, i));
        });
    }
}

function applyCountryFilter(c){ activeCountryFilter = String(c).toLowerCase(); applySortAndFilter(); }
function switchSheet(gid){
    const s = SHEETS_CONFIG.find(x => x.gid === gid);
    if(!s || currentSheet.gid === gid) return;
    currentSheet = s; activeFilter={key:null}; activeCountryFilter=null; 
    artSortState.columnKey=null; paiSortState.columnKey=null; searchInput.value='';
    renderSheetNavigation(); fetchData(s);
}

function renderSheetNavigation(){
    sheetNav.innerHTML = '';
    SHEETS_CONFIG.forEach(s => {
        const b = document.createElement('button');
        b.textContent = s.name;
        b.className = `px-3 py-1.5 rounded-lg text-sm font-medium ${s.gid===currentSheet.gid?'bg-indigo-600 text-white':'bg-gray-50 text-gray-600 border'}`;
        b.onclick = () => switchSheet(s.gid);
        sheetNav.appendChild(b);
    });
}

async function fetchDeezerData() {
    try {
        const r = await fetch('dados_deezer.json');
        if (r.ok) DEEZER_DATA = await r.json();
    } catch (e) { console.error("Erro JSON", e); }
}

async function fetchData(sheetConfig){
    const currentGid = sheetConfig.gid;
    statusMessage.textContent = `Carregando ${sheetConfig.name}...`;
    statusMessage.classList.remove('hidden');
    try {
        const r = await fetch(getSheetUrl(currentGid));
        const t = await r.text();
        const d = parseSheetData(t);
        if (sheetConfig.name === 'Alb') ALBUM_DATA = d;
        if(currentGid === currentSheet.gid){
            allData = d;
            if(currentSheet.name==='Art' || currentSheet.name==='Paí') allData = processRankingData(d);
            if(isFullFeatureSheet()){ sortState={columnKey:Object.keys(d[0])[0], direction:'desc'}; }
            createSortControls(); applySortAndFilter();
        }
    } catch(e){
        statusMessage.textContent = "Erro ao carregar dados.";
        statusMessage.classList.add('text-red-600');
    }
}

async function initLoad() {
    await fetchDeezerData();
    const alb = SHEETS_CONFIG.find(s => s.name === 'Alb');
    if (alb) await fetchData(alb); 
    if (currentSheet.name !== 'Alb') await fetchData(currentSheet);
}

renderSheetNavigation();
initLoad();
</script>
</body>
</html>
