<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BI DataGrid Pro - vFinal</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --pessimo: #e82952; --ruim: #f97042; --razoavel: #f7bc31;
            --bom: #abd43a; --excelente: #48b43c;
            --border: #e2e8f0; --header-bg: #f8fafc; --primary: #2563eb;
        }

        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }

        /* Scroll Ajustado */
        .wrapper { height: 100vh; overflow: auto; width: 100vw; -webkit-overflow-scrolling: touch; }
        
        table { border-collapse: separate; border-spacing: 0; min-width: 800px; width: 100%; font-size: 11px; table-layout: fixed; }
        th, td { padding: 8px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); white-space: nowrap; overflow: hidden; }

        /* Headers e Fixação */
        thead th { position: sticky; top: 0; background: var(--header-bg); z-index: 10; font-weight: 700; cursor: pointer; user-select: none; }
        
        .col-fixed { 
            position: sticky; left: 0; z-index: 20; background: #fff !important;
            border-right: 2px solid var(--border) !important;
            width: 200px; transition: all 0.2s ease;
        }

        /* Redução ao scroll horizontal */
        .scrolled-x .col-fixed { width: 85px; font-size: 9px; }
        .col-fixed span.full-text { display: inline; }
        .scrolled-x .col-fixed span.full-text { display: none; }
        .col-fixed span.short-text { display: none; }
        .scrolled-x .col-fixed span.short-text { display: inline; }

        /* Controles de Cabeçalho */
        .header-controls { display: flex; align-items: center; gap: 4px; }
        .type-filters { display: flex; gap: 2px; margin-left: 5px; }
        .type-btn { 
            padding: 2px 6px; border-radius: 3px; cursor: pointer; border: 1px solid var(--border);
            font-size: 10px; background: #fff; transition: 0.2s; font-weight: bold;
        }
        .type-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        
        .search-area { display: none; align-items: center; background: #fff; border: 1px solid var(--border); padding: 1px 4px; border-radius: 3px; }
        .search-area input { border: none; outline: none; font-size: 10px; width: 50px; }

        /* Indicador de Ordenação */
        .sort-indicator { margin-left: 4px; font-size: 10px; color: var(--primary); }

        /* Modal Fullscreen */
        .modal { display: none; position: fixed; z-index: 200; left: 0; top: 0; width: 100%; height: 100%; background: #fff; }
        .modal-content { height: 100%; display: flex; flex-direction: column; padding: 15px; box-sizing: border-box; }
        .perf-tag { padding: 4px 10px; border-radius: 4px; color: #fff; font-weight: 700; }
        .chart-container { flex-grow: 1; min-height: 0; margin-top: 15px; }

        tr:hover td { background-color: #f8fafc !important; }
    </style>
</head>
<body>

<div class="wrapper" id="scrollWrapper">
    <table id="mainTable">
        <thead>
            <tr id="headerRow">
                <th class="col-fixed" onclick="handleCol1Click(event)">
                    <div class="header-controls">
                        <span onclick="toggleSearch(); event.stopPropagation();">🔍</span>
                        <div class="search-area" id="searchBox">
                            <input type="text" id="searchInput" placeholder="Busca..." onkeyup="filterRows()">
                            <span onclick="clearFilter(); event.stopPropagation();">×</span>
                        </div>
                        <div class="type-filters">
                            <div class="type-btn" onclick="filterByType('$', this); event.stopPropagation();">$</div>
                            <div class="type-btn" onclick="filterByType('Q', this); event.stopPropagation();">Q</div>
                            <div class="type-btn" onclick="filterByType('%', this); event.stopPropagation();">%</div>
                        </div>
                        <span id="sort-0" class="sort-indicator"></span>
                    </div>
                </th>
                <th onclick="sortTable(1)">Hoje<span id="sort-1" class="sort-indicator"></span></th>
                <th onclick="sortTable(2)">Últ.Dia<span id="sort-2" class="sort-indicator"></span></th>
                <th onclick="sortTable(3)">Mês (PA)<span id="sort-3" class="sort-indicator"></span></th>
                <th onclick="sortTable(4)">Mês (AA)<span id="sort-4" class="sort-indicator"></span></th>
                <th onclick="sortTable(5)">3M (PA)<span id="sort-5" class="sort-indicator"></span></th>
                <th onclick="sortTable(6)">3M (AA)<span id="sort-6" class="sort-indicator"></span></th>
                <th onclick="sortTable(7)">Ano (25)<span id="sort-7" class="sort-indicator"></span></th>
                <th onclick="sortTable(8)">Var %<span id="sort-8" class="sort-indicator"></span></th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<div id="anaModal" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
                <h2 id="mTitle" style="margin:0">Indicador</h2>
                <span id="mStatus" class="perf-tag">CLASSIFICAÇÃO</span>
            </div>
            <button onclick="closeModal()" style="font-size:28px; border:none; background:none; cursor:pointer;">✕</button>
        </div>
        <div style="margin-top:15px;">
            <p><strong>Meta:</strong> <span id="mMeta">--</span></p>
            <select id="viewSelect" onchange="updateChart()" style="width:100%; padding:10px; font-size: 16px;">
                <option value="12">Mensal (12 meses)</option>
                <option value="6">Bimestral (6 períodos)</option>
                <option value="4">Trimestral (4 períodos)</option>
                <option value="3">Quadrimestral (3 períodos)</option>
                <option value="2">Semestral (2 períodos)</option>
                <option value="1">Anual (1 período)</option>
            </select>
        </div>
        <div class="chart-container">
            <canvas id="evolutionChart"></canvas>
        </div>
    </div>
</div>

<script>
    const indicadores = [
        { n: "Faturamento Indústria", u: "$", d: "Volume total faturado." },
        { n: "Agrupamento Orçamentos", u: "Q", d: "Quantidade física de orçamentos." },
        { n: "Margem de Contribuição", u: "%", d: "Margem após custos variáveis." },
        { n: "Clientes Faturados", u: "Q", d: "Número de CNPJs únicos atendidos." },
        { n: "Custo Mercadoria", u: "$", d: "Valor de compra do estoque." },
        { n: "Conversão Leads", u: "%", d: "Taxa de orçamentos ganhos." }
    ];

    let currentChart = null;
    let activeType = null;
    let sortState = { idx: -1, asc: true };

    // Iniciar Tabela
    const tbody = document.getElementById('tableBody');
    for(let i=0; i<20; i++) {
        const ind = indicadores[i % indicadores.length];
        const vVar = (Math.random() * 30 - 15).toFixed(1);
        const perf = getPerf(vVar);
        const tr = document.createElement('tr');
        tr.setAttribute('data-type', ind.u);
        tr.innerHTML = `
            <td class="col-fixed" style="color:${perf.cor}" onclick="openAnalysis('${ind.n}', '${ind.u}', ${vVar})">
                <span class="full-text">${ind.n} (${ind.u})</span>
                <span class="short-text">${ind.n.substring(0,10)}...</span>
            </td>
            <td>${rnd()}</td><td>${rnd()}</td><td>${rnd()}</td><td>${rnd()}</td>
            <td>${rnd()}</td><td>${rnd()}</td><td>${rnd()}</td>
            <td style="color:${perf.cor}; font-weight:bold">${vVar}%</td>
        `;
        tbody.appendChild(tr);
    }

    function rnd() { return Math.floor(Math.random() * 900000); }
    function getPerf(v) {
        if (v >= 10) return { t: "EXCELENTE", cor: "#48b43c" };
        if (v >= 3) return { t: "BOM", cor: "#abd43a" };
        if (v >= -2) return { t: "RAZOÁVEL", cor: "#f7bc31" };
        if (v >= -8) return { t: "RUIM", cor: "#f97042" };
        return { t: "PÉSSIMO", cor: "#e82952" };
    }

    // Scroll Logic
    document.getElementById('scrollWrapper').addEventListener('scroll', function() {
        document.body.classList.toggle('scrolled-x', this.scrollLeft > 15);
    });

    // Filtros por Tipo
    function filterByType(type, btn) {
        const buttons = document.querySelectorAll('.type-btn');
        if (activeType === type) {
            activeType = null;
            btn.classList.remove('active');
        } else {
            activeType = type;
            buttons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
        applyAllFilters();
    }

    function toggleSearch() {
        const box = document.getElementById('searchBox');
        box.style.display = (box.style.display === 'flex') ? 'none' : 'flex';
        if(box.style.display === 'flex') document.getElementById('searchInput').focus();
    }

    function clearFilter() {
        document.getElementById('searchInput').value = '';
        applyAllFilters();
        toggleSearch();
    }

    function applyAllFilters() {
        const searchVal = document.getElementById('searchInput').value.toLowerCase();
        document.querySelectorAll('#tableBody tr').forEach(row => {
            const nameMatch = row.cells[0].innerText.toLowerCase().includes(searchVal);
            const typeMatch = !activeType || row.getAttribute('data-type') === activeType;
            row.style.display = (nameMatch && typeMatch) ? '' : 'none';
        });
    }

    // Ordenação com Sinais Visuais
    function handleCol1Click(e) {
        if (e.target.tagName !== 'TH' && !e.target.classList.contains('col-fixed')) return;
        sortTable(0);
    }

    function sortTable(idx) {
        const table = document.getElementById('tableBody');
        const rows = Array.from(table.rows);
        
        if (sortState.idx === idx) {
            sortState.asc = !sortState.asc;
        } else {
            sortState.idx = idx;
            sortState.asc = true;
        }

        rows.sort((a, b) => {
            let vA = a.cells[idx].innerText.replace(/[^0-9.-]+/g, "");
            let vB = b.cells[idx].innerText.replace(/[^0-9.-]+/g, "");
            
            // Se for coluna 1 (texto), usa compare local
            if (idx === 0) {
                return sortState.asc ? a.cells[0].innerText.localeCompare(b.cells[0].innerText) : b.cells[0].innerText.localeCompare(a.cells[0].innerText);
            }

            return sortState.asc ? parseFloat(vA) - parseFloat(vB) : parseFloat(vB) - parseFloat(vA);
        });

        // Atualizar Sinais
        document.querySelectorAll('.sort-indicator').forEach(el => el.innerText = '');
        document.getElementById(`sort-${idx}`).innerText = sortState.asc ? ' ↑' : ' ↓';

        rows.forEach(r => table.appendChild(r));
    }

    // Modal e Charts
    function openAnalysis(nome, unid, v) {
        const perf = getPerf(v);
        document.getElementById('mTitle').innerText = `${nome} (${unid})`;
        document.getElementById('mStatus').innerText = perf.t;
        document.getElementById('mStatus').style.backgroundColor = perf.cor;
        document.getElementById('mMeta').innerText = rnd() + " " + unid;
        document.getElementById('anaModal').style.display = 'block';
        updateChart(perf.cor);
    }

    function closeModal() { document.getElementById('anaModal').style.display = 'none'; }

    function updateChart(color = '#2563eb') {
        const ctx = document.getElementById('evolutionChart').getContext('2d');
        const count = parseInt(document.getElementById('viewSelect').value);
        if(currentChart) currentChart.destroy();
        currentChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: Array.from({length: count}, (_, i) => `Período ${i+1}`),
                datasets: [{ data: Array.from({length: count}, () => rnd()), backgroundColor: color }]
            },
            options: { maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });
    }
</script>
</body>
</html>
