<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise BI Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            /* Paleta de Cores Conforme image_3163f3.png */
            --pessimo: #e82952;
            --ruim: #f97042;
            --razoavel: #f7bc31;
            --bom: #abd43a;
            --excelente: #48b43c;
            --border: #e2e8f0;
            --header-bg: #f8fafc;
        }

        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }

        /* Estrutura da Grade */
        .wrapper { height: 100vh; overflow: auto; width: 100vw; display: block; }
        table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 11px; table-layout: fixed; }
        
        th, td { padding: 6px 8px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); white-space: nowrap; overflow: hidden; }

        /* Cabeçalhos Fixos */
        thead th { position: sticky; top: 0; background: var(--header-bg); z-index: 10; font-weight: 700; border-top: 1px solid var(--border); }
        
        /* Coluna 1 Fixa e Responsiva ao Scroll */
        .col-fixed { 
            position: sticky; left: 0; z-index: 20; background: #fff !important;
            border-right: 2px solid var(--border) !important;
            width: 220px; transition: all 0.2s ease; cursor: pointer;
        }

        /* Comportamento de Redução (Scroll Horizontal) */
        .scrolled-x .col-fixed { width: 75px; font-size: 9px; }
        .col-fixed span.full-text { display: inline; }
        .scrolled-x .col-fixed span.full-text { display: none; }
        .col-fixed span.short-text { display: none; }
        .scrolled-x .col-fixed span.short-text { display: inline; }

        /* Controles do Header */
        .header-controls { display: flex; align-items: center; justify-content: space-between; }
        .search-area { display: none; align-items: center; background: #fff; border: 1px solid var(--border); padding: 2px; border-radius: 3px; }
        .search-area input { border: none; outline: none; font-size: 10px; width: 60px; }
        .icon { cursor: pointer; padding: 0 4px; font-size: 13px; }

        /* Modal Fullscreen */
        .modal { display: none; position: fixed; z-index: 200; left: 0; top: 0; width: 100%; height: 100%; background: #fff; }
        .modal-content { height: 100%; display: flex; flex-direction: column; padding: 15px; box-sizing: border-box; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .chart-container { flex-grow: 1; min-height: 0; margin-top: 15px; }

        /* Seletor de Colunas (Overlay Central) */
        .col-selector-overlay { 
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #fff; border: 2px solid var(--primary); box-shadow: 0 0 20px rgba(0,0,0,0.3);
            z-index: 300; width: 280px; padding: 20px; border-radius: 8px;
        }

        .perf-tag { padding: 4px 10px; border-radius: 4px; color: #fff; font-weight: 700; font-size: 12px; }
        .hidden-col { display: none !important; }
    </style>
</head>
<body>

<div class="wrapper" id="scrollWrapper">
    <table id="mainTable">
        <thead>
            <tr id="headerRow">
                <th class="col-fixed">
                    <div class="header-controls">
                        <span class="icon" onclick="toggleSearch()">🔍</span>
                        <div class="search-area" id="searchBox">
                            <input type="text" id="searchInput" placeholder="Filtro..." onkeyup="filterRows()">
                            <span class="icon" onclick="clearFilter()">×</span>
                        </div>
                        <span class="icon" onclick="openColSelector()">⚙️</span>
                    </div>
                </th>
                <th>Hoje</th><th>Últ.Dia</th>
                <th>Mês (PA)</th><th>Mês (AA)</th>
                <th>3M (PA)</th><th>3M (AA)</th>
                <th>Ano (25)</th><th>Ano (24)</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<div id="anaModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <div>
                <h2 id="mTitle" style="margin:0">Indicador</h2>
                <span id="mStatus" class="perf-tag">CLASSIFICAÇÃO</span>
            </div>
            <button onclick="closeModal()" style="font-size: 20px; cursor: pointer; border: none; background: none;">✕</button>
        </div>
        <div style="margin-top:10px; font-size: 14px;">
            <p><strong>Meta Definida:</strong> <span id="mMeta">--</span></p>
            <select id="viewSelect" onchange="updateChart()" style="padding: 5px; width: 100%;">
                <option value="12">Visão Mensal</option>
                <option value="6">Visão Bimestral</option>
                <option value="4">Visão Trimestral</option>
                <option value="1">Visão Anual</option>
            </select>
        </div>
        <div class="chart-container">
            <canvas id="evolutionChart"></canvas>
        </div>
    </div>
</div>

<div id="colSelector" class="col-selector-overlay">
    <h3 style="margin-top:0">Exibir Colunas</h3>
    <div id="colCheckboxes" style="max-height: 300px; overflow-y: auto; margin-bottom: 15px;"></div>
    <button onclick="closeColSelector()" style="width:100%; padding: 10px; background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer;">Fechar</button>
</div>

<script>
    // Configurações e Dados Baseados nas Imagens
    const indicadores = [
        { n: "Faturamento Indústria", u: "$", d: "Volume total de vendas faturadas no período industrial." },
        { n: "Agrupamento Orçamentos", u: "$", d: "Valor monetário total de orçamentos emitidos." },
        { n: "Agrupamento Orçamentos", u: "Q", d: "Quantidade física de orçamentos gerados." },
        { n: "Clientes Faturados", u: "Q", d: "Número de clientes únicos com notas fiscais emitidas." },
        { n: "Faturamento Instaladoras", u: "$", d: "Resultados específicos do canal de instaladores." },
        { n: "Margem de Contribuição", u: "%", d: "Percentual de sobra após custos variáveis." }
    ];

    let currentChart = null;

    // Inicializar Tabela
    const tbody = document.getElementById('tableBody');
    for(let i=0; i<20; i++) {
        const ind = indicadores[i % indicadores.length];
        const valVar = (Math.random() * 30 - 15).toFixed(1);
        const perf = getPerformance(valVar);
        
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td class="col-fixed" style="color:${perf.cor}" onclick="openAnalysis('${ind.n}', '${ind.u}', ${valVar}, '${ind.d}')">
                <span class="full-text">${ind.n} (${ind.u})</span>
                <span class="short-text">${ind.n.substring(0,10)}...</span>
            </td>
            <td>${rnd()}</td><td>${rnd()}</td>
            <td>${rnd()}</td><td>${rnd()}</td>
            <td>${rnd()}</td><td>${rnd()}</td>
            <td>${rnd()}</td><td style="color:${perf.cor}; font-weight:bold">${valVar}%</td>
        `;
        tbody.appendChild(tr);
    }

    function rnd() { return (Math.random() * 1000).toFixed(0); }

    function getPerformance(v) {
        if (v >= 10) return { t: "EXCELENTE", cor: "#48b43c" }; //
        if (v >= 3) return { t: "BOM", cor: "#abd43a" };
        if (v >= -2) return { t: "RAZOÁVEL", cor: "#f7bc31" };
        if (v >= -8) return { t: "RUIM", cor: "#f97042" };
        return { t: "PÉSSIMO", cor: "#e82952" };
    }

    // Scroll Logic
    document.getElementById('scrollWrapper').addEventListener('scroll', function() {
        document.body.classList.toggle('scrolled-x', this.scrollLeft > 15);
    });

    // Filtros
    function toggleSearch() {
        const b = document.getElementById('searchBox');
        b.style.display = b.style.display === 'flex' ? 'none' : 'flex';
        if(b.style.display === 'flex') document.getElementById('searchInput').focus();
    }

    function clearFilter() {
        document.getElementById('searchInput').value = '';
        filterRows();
        toggleSearch();
    }

    function filterRows() {
        const f = document.getElementById('searchInput').value.toLowerCase();
        document.querySelectorAll('#tableBody tr').forEach(r => {
            r.style.display = r.cells[0].innerText.toLowerCase().includes(f) ? '' : 'none';
        });
    }

    // Seletor de Colunas
    function openColSelector() {
        const container = document.getElementById('colCheckboxes');
        if(container.innerHTML === "") {
            document.querySelectorAll('#headerRow th').forEach((th, i) => {
                if(i===0) return;
                const div = document.createElement('div');
                div.innerHTML = `<label><input type="checkbox" checked onchange="toggleCol(${i}, this.checked)"> ${th.innerText}</label>`;
                container.appendChild(div);
            });
        }
        document.getElementById('colSelector').style.display = 'block';
    }

    function closeColSelector() { document.getElementById('colSelector').style.display = 'none'; }

    function toggleCol(i, show) {
        document.querySelectorAll('tr').forEach(r => r.cells[i].classList.toggle('hidden-col', !show));
    }

    // Modal e Gráfico
    function openAnalysis(nome, unid, v, desc) {
        const perf = getPerformance(v);
        document.getElementById('mTitle').innerText = `${nome} (${unid})`;
        document.getElementById('mStatus').innerText = perf.t;
        document.getElementById('mStatus').style.backgroundColor = perf.cor;
        document.getElementById('mMeta').innerText = rnd() + " " + unid;
        document.getElementById('anaModal').style.display = 'block';
        updateChart(perf.cor);
    }

    function closeModal() { document.getElementById('anaModal').style.display = 'none'; }

    function updateChart(color = '#2563eb') {
        const ctx = document.getElementById('evolutionChart').getContext('2d');
        const count = parseInt(document.getElementById('viewSelect').value);
        const data = Array.from({length: count}, () => Math.floor(Math.random() * 100));
        
        if(currentChart) currentChart.destroy();
        currentChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: Array.from({length: count}, (_, i) => `Período ${i+1}`),
                datasets: [{ data: data, backgroundColor: color }]
            },
            options: {
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true } }
            }
        });
    }
</script>
</body>
</html>
