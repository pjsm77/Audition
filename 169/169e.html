<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Analytics Grid</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #2563eb; --border: #e2e8f0; --header-bg: #f8fafc;
            --excelente: #15803d; --bom: #22c55e; --razoavel: #eab308;
            --ruim: #f97316; --pessimo: #dc2626;
        }

        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Inter', sans-serif; overflow: hidden; }

        /* Estrutura Grid */
        .wrapper { height: 100vh; overflow: auto; width: 100vw; display: block; }
        table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12px; }
        
        th, td { padding: 10px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); white-space: nowrap; }

        /* Headers e Coluna Fixa */
        thead th { position: sticky; top: 0; background: var(--header-bg); z-index: 10; font-weight: 700; }
        
        .col-fixed { 
            position: sticky; left: 0; z-index: 20; background: #fff !important;
            border-right: 2px solid var(--border) !important;
            max-width: 280px; overflow: hidden; text-overflow: ellipsis;
            cursor: pointer; transition: max-width 0.3s;
        }

        /* Encurtamento ao rolar */
        .scrolled-x .col-fixed { max-width: 100px; font-size: 10px; }

        /* Controles no Header da Coluna 1 */
        .header-controls { display: flex; align-items: center; gap: 8px; }
        .search-container { display: none; align-items: center; background: #fff; border: 1px solid var(--border); padding: 2px 5px; border-radius: 4px; }
        .search-container input { border: none; outline: none; font-size: 11px; width: 100px; }
        .btn-icon { cursor: pointer; opacity: 0.7; transition: 0.2s; font-size: 14px; }
        .btn-icon:hover { opacity: 1; color: var(--primary); }

        /* Modal */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: #fff; margin: 5% auto; padding: 20px; width: 70%; border-radius: 12px; position: relative; }
        .close-modal { position: absolute; right: 20px; top: 15px; font-size: 24px; cursor: pointer; }
        
        .status-badge { padding: 4px 12px; border-radius: 20px; color: #fff; font-weight: bold; font-size: 12px; display: inline-block; margin-bottom: 15px; }

        /* Dropdown Colunas */
        .col-dropdown { display: none; position: absolute; background: white; border: 1px solid var(--border); padding: 10px; z-index: 50; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .col-dropdown label { display: block; font-size: 11px; margin-bottom: 5px; cursor: pointer; }

        .hidden-col { display: none !important; }
        tr:hover td { background-color: #f1f5f9 !important; }
    </style>
</head>
<body>

<div class="wrapper" id="scrollWrapper">
    <table id="mainTable">
        <thead>
            <tr id="headerRow">
                <th class="col-fixed">
                    <div class="header-controls">
                        <span class="btn-icon" onclick="toggleSearch()">🔍</span>
                        <div class="search-container" id="searchBox">
                            <input type="text" id="searchInput" placeholder="Filtrar..." onkeyup="filterRows()">
                            <span class="btn-icon" onclick="clearFilter()">×</span>
                        </div>
                        <span class="btn-icon" onclick="toggleColMenu(event)">⚙️</span>
                        <div id="colMenu" class="col-dropdown"></div>
                    </div>
                </th>
                <th onclick="sortTable(1)">Meta</th>
                <th onclick="sortTable(2)">Realizado</th>
                <th onclick="sortTable(3)">Variação %</th>
                <th onclick="sortTable(4)">Jan</th>
                <th onclick="sortTable(5)">Fev</th>
                <th onclick="sortTable(6)">Mar</th>
                <th onclick="sortTable(7)">Q1</th>
                <th onclick="sortTable(8)">Q2</th>
                <th onclick="sortTable(9)">Proj. Final</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<div id="anaModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <h2 id="mTitle">Indicador</h2>
        <div id="mStatus" class="status-badge">Excelente</div>
        <p id="mDesc" style="color: #64748b; font-size: 13px;">Descrição breve sobre a origem e impacto deste indicador no negócio.</p>
        <p><strong>Meta:</strong> <span id="mMeta">0</span></p>
        
        <div style="margin-bottom: 15px;">
            <select id="viewSelect" onchange="updateChart()">
                <option value="mensal">Mensal</option>
                <option value="bimestral">Bimestral</option>
                <option value="trimestral">Trimestral</option>
                <option value="semestral">Semestral</option>
            </select>
        </div>
        <canvas id="myChart" height="100"></canvas>
    </div>
</div>

<script>
    const indicadores = [
        "Faturamento Líquido", "Margem de Contribuição", "CAC Operacional", "Churn Rate", "Ticket Médio",
        "NPS Mensal", "Volume de Leads", "Conversão Funil", "Custo Fixo", "ROI Marketing",
        "Lead Time Entrega", "Absenteísmo", "Taxa de Recompra", "Quebra Estoque", "Produtividade",
        "Gasto Nuvem", "Tickets Suporte", "Tempo Médio Resposta", "EBITDA", "Dívida Líquida"
    ];

    let currentIndicador = "";
    let myChart = null;

    // Gerar dados
    const tbody = document.getElementById('tableBody');
    indicadores.forEach(name => {
        const tr = document.createElement('tr');
        const variacao = (Math.random() * 20 - 10).toFixed(1);
        const cor = getPerf(variacao).cor;
        
        tr.innerHTML = `
            <td class="col-fixed" style="color:${cor}" onclick="openModal('${name}', ${variacao})">${name}</td>
            <td>R$ ${(Math.random()*500).toFixed(0)}k</td>
            <td>R$ ${(Math.random()*500).toFixed(0)}k</td>
            <td style="color:${cor}; font-weight:bold">${variacao}%</td>
            <td>${(Math.random()*100).toFixed(0)}</td>
            <td>${(Math.random()*100).toFixed(0)}</td>
            <td>${(Math.random()*100).toFixed(0)}</td>
            <td>${(Math.random()*300).toFixed(0)}k</td>
            <td>${(Math.random()*300).toFixed(0)}k</td>
            <td>${(Math.random()*1000).toFixed(0)}k</td>
        `;
        tbody.appendChild(tr);
    });

    function getPerf(val) {
        if (val >= 8) return { txt: "EXCELENTE", cor: "var(--excelente)" };
        if (val >= 3) return { txt: "BOM", cor: "var(--bom)" };
        if (val >= -2) return { txt: "RAZOÁVEL", cor: "var(--razoavel)" };
        if (val >= -7) return { txt: "RUIM", cor: "var(--ruim)" };
        return { txt: "PÉSSIMO", cor: "var(--pessimo)" };
    }

    // Lógica Scroll
    document.getElementById('scrollWrapper').addEventListener('scroll', function() {
        document.body.classList.toggle('scrolled-x', this.scrollLeft > 20);
    });

    // Filtros e Busca
    function toggleSearch() {
        const box = document.getElementById('searchBox');
        box.style.display = (box.style.display === 'flex') ? 'none' : 'flex';
        if(box.style.display === 'flex') document.getElementById('searchInput').focus();
    }

    function clearFilter() {
        document.getElementById('searchInput').value = '';
        filterRows();
        toggleSearch();
    }

    function filterRows() {
        const val = document.getElementById('searchInput').value.toLowerCase();
        document.querySelectorAll('#tableBody tr').forEach(row => {
            row.style.display = row.cells[0].innerText.toLowerCase().includes(val) ? '' : 'none';
        });
    }

    // Gestão de Colunas
    function toggleColMenu(e) {
        const menu = document.getElementById('colMenu');
        menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        menu.style.left = e.pageX + "px";
        if (menu.innerHTML === "") {
            document.querySelectorAll('#headerRow th').forEach((th, i) => {
                if (i === 0) return;
                const label = document.createElement('label');
                label.innerHTML = `<input type="checkbox" checked onchange="toggleCol(${i}, this.checked)"> ${th.innerText}`;
                menu.appendChild(label);
            });
        }
    }

    function toggleCol(i, show) {
        document.querySelectorAll('#mainTable tr').forEach(row => {
            row.cells[i].classList.toggle('hidden-col', !show);
        });
    }

    // Modal e Gráfico
    function openModal(name, variacao) {
        currentIndicador = name;
        const perf = getPerf(variacao);
        document.getElementById('mTitle').innerText = name;
        document.getElementById('mStatus').innerText = perf.txt;
        document.getElementById('mStatus').style.backgroundColor = perf.cor;
        document.getElementById('mMeta').innerText = (Math.random()*600).toFixed(0) + "k";
        document.getElementById('anaModal').style.display = 'block';
        updateChart();
    }

    function closeModal() { document.getElementById('anaModal').style.display = 'none'; }

    function updateChart() {
        const ctx = document.getElementById('myChart').getContext('2d');
        const view = document.getElementById('viewSelect').value;
        const dataMap = { mensal: 12, bimestral: 6, trimestral: 4, semestral: 2 };
        const labels = Array.from({length: dataMap[view]}, (_, i) => `${view.charAt(0).toUpperCase()}${i+1}`);
        const values = labels.map(() => Math.random() * 100);

        if (myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'bar',
            data: { labels: labels, datasets: [{ label: 'Evolução', data: values, backgroundColor: '#3b82f6' }] },
            options: { responsive: true, scales: { y: { beginAtZero: true } } }
        });
    }

    function sortTable(idx) {
        const table = document.getElementById('tableBody');
        const rows = Array.from(table.rows);
        rows.sort((a, b) => a.cells[idx].innerText.localeCompare(b.cells[idx].innerText, undefined, {numeric: true}));
        rows.forEach(r => table.appendChild(r));
    }
</script>
</body>
</html>
