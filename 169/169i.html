<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BI Grid vNext</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pessimo: #e82952; --ruim: #f97042; --razoavel: #f7bc31;
            --bom: #abd43a; --excelente: #48b43c;
            --border: #e2e8f0; --primary: #2563eb;
        }

        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Oswald', sans-serif; overflow: hidden; background: #fff; }

        /* Toolbar Superior */
        .toolbar {
            display: flex; align-items: center; gap: 10px; padding: 5px 10px;
            background: #f8fafc; border-bottom: 1px solid var(--border);
            flex-wrap: nowrap; overflow-x: auto;
        }

        .search-input { border: 1px solid var(--border); border-radius: 4px; padding: 2px 5px; font-size: 13px; width: 100px; font-family: inherit; }
        
        .filter-group { display: flex; gap: 3px; border-right: 1px solid #cbd5e1; padding-right: 10px; }
        .filter-btn { 
            padding: 2px 8px; border: 1px solid var(--border); border-radius: 4px; 
            font-size: 12px; cursor: pointer; background: #fff; transition: 0.2s; font-weight: 500;
        }
        .filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .btn-origem { border-color: #94a3b8; color: #475569; }

        /* Grid */
        .wrapper { height: calc(100vh - 40px); overflow: auto; width: 100vw; }
        table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; table-layout: fixed; }
        th, td { padding: 4px 8px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); white-space: nowrap; overflow: hidden; }

        thead th { position: sticky; top: 0; background: #f1f5f9; z-index: 10; cursor: pointer; text-transform: uppercase; }
        
        .col-fixed { 
            position: sticky; left: 0; z-index: 20; background: #fff !important;
            border-right: 2px solid var(--border) !important; width: 220px; transition: width 0.2s;
        }

        .scrolled-x .col-fixed { width: 90px; }
        .scrolled-x .col-fixed span.full-text { display: none; }
        .scrolled-x .col-fixed span.short-text { display: inline; }
        .short-text { display: none; }

        .hidden-col { display: none !important; }
        .sort-indicator { color: var(--primary); font-size: 10px; }

        /* Modal */
        .modal { display: none; position: fixed; z-index: 200; left: 0; top: 0; width: 100%; height: 100%; background: #fff; }
        .modal-content { height: 100%; display: flex; flex-direction: column; padding: 15px; box-sizing: border-box; }
        .perf-tag { padding: 2px 8px; border-radius: 4px; color: #fff; font-size: 14px; }
    </style>
</head>
<body>

<div class="toolbar">
    <div class="filter-group">
        <span>🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Filtrar..." oninput="applyFilters()">
    </div>
    
    <div class="filter-group">
        <div class="filter-btn" onclick="toggleType('$', this)">$</div>
        <div class="filter-btn" onclick="toggleType('Q', this)">Q</div>
        <div class="filter-btn" onclick="toggleType('%', this)">%</div>
    </div>

    <div class="filter-group" style="border:none">
        <div class="filter-btn btn-origem" onclick="toggleOrigin('V', this)">V</div>
        <div class="filter-btn btn-origem" onclick="toggleOrigin('C', this)">C</div>
        <div class="filter-btn btn-origem" onclick="toggleOrigin('F', this)">F</div>
        <div class="filter-btn btn-origem" onclick="toggleOrigin('L', this)">L</div>
        <div class="filter-btn btn-origem" onclick="toggleOrigin('M', this)">M</div>
        <div class="filter-btn btn-origem" onclick="toggleOrigin('R', this)">R</div>
        <div class="filter-btn btn-origem" onclick="toggleOrigin('T', this)">T</div>
    </div>

    <div class="filter-btn" onclick="openColSelector()" style="margin-left: auto;">⚙️ Colunas</div>
</div>

<div class="wrapper" id="scrollWrapper">
    <table id="mainTable">
        <thead>
            <tr>
                <th class="col-fixed" onclick="sortTable(0)">Indicador <span id="sort-0" class="sort-indicator"></span></th>
                <th onclick="sortTable(1)">Hoje<span id="sort-1" class="sort-indicator"></span></th>
                <th onclick="sortTable(2)">Mês (PA)<span id="sort-2" class="sort-indicator"></span></th>
                <th onclick="sortTable(3)">Mês (AA)<span id="sort-3" class="sort-indicator"></span></th>
                <th onclick="sortTable(4)">Ano (25)<span id="sort-4" class="sort-indicator"></span></th>
                <th onclick="sortTable(5)">Var %<span id="sort-5" class="sort-indicator"></span></th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<div id="anaModal" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
                <h2 id="mTitle" style="margin:0">Indicador</h2>
                <span id="mStatus" class="perf-tag">STATUS</span>
            </div>
            <button onclick="closeModal()" style="font-size:30px; border:none; background:none; cursor:pointer;">✕</button>
        </div>
        <select id="viewSelect" onchange="updateChart()" style="margin-top:20px; padding:10px; font-family:inherit;">
            <option value="12">Mensal</option>
            <option value="6">Bimestral</option>
            <option value="4">Trimestral</option>
            <option value="3">Quadrimestral</option>
            <option value="2">Semestral</option>
            <option value="1">Anual</option>
        </select>
        <div style="flex-grow:1; margin-top:20px;">
            <canvas id="evolutionChart"></canvas>
        </div>
    </div>
</div>

<script>
    const origens = ['V', 'C', 'F', 'L', 'M', 'R', 'T'];
    const tipos = ['$', 'Q', '%'];
    const nomes = ["Faturamento", "Margem", "Estoque", "Absenteísmo", "Leads", "ROI", "Custo TI", "Prazo Entrega"];

    let activeType = null;
    let activeOrigin = null;
    let sortState = { idx: -1, asc: true };
    let currentChart = null;

    // Gerar dados
    const tbody = document.getElementById('tableBody');
    for(let i=0; i<30; i++) {
        const o = origens[i % origens.length];
        const t = tipos[i % tipos.length];
        const n = nomes[i % nomes.length] + " " + o;
        const vVar = (Math.random() * 40 - 20).toFixed(1);
        const perf = getPerf(vVar);

        const tr = document.createElement('tr');
        tr.setAttribute('data-type', t);
        tr.setAttribute('data-origin', o);
        tr.innerHTML = `
            <td class="col-fixed" style="color:${perf.cor}" onclick="openAnalysis('${n}', '${t}', ${vVar})">
                <span class="full-text">${n} (${t})</span>
                <span class="short-text">${n.substring(0,10)}..</span>
            </td>
            <td>${rnd()}</td><td>${rnd()}</td><td>${rnd()}</td><td>${rnd()}</td>
            <td style="color:${perf.cor}; font-weight:bold">${vVar}%</td>
        `;
        tbody.appendChild(tr);
    }

    function rnd() { return Math.floor(Math.random() * 5000).toLocaleString(); }
    function getPerf(v) {
        if (v >= 10) return { t: "EXCELENTE", cor: "#48b43c" };
        if (v >= 3) return { t: "BOM", cor: "#abd43a" };
        if (v >= -2) return { t: "RAZOÁVEL", cor: "#f7bc31" };
        if (v >= -8) return { t: "RUIM", cor: "#f97042" };
        return { t: "PÉSSIMO", cor: "#e82952" };
    }

    // Filtros Sincronizados
    function toggleType(type, btn) {
        document.querySelectorAll('.filter-group:nth-child(2) .filter-btn').forEach(b => b.classList.remove('active'));
        if (activeType === type) { activeType = null; } 
        else { activeType = type; btn.classList.add('active'); }
        applyFilters();
    }

    function toggleOrigin(origin, btn) {
        document.querySelectorAll('.btn-origem').forEach(b => b.classList.remove('active'));
        if (activeOrigin === origin) { activeOrigin = null; } 
        else { activeOrigin = origin; btn.classList.add('active'); }
        applyFilters();
    }

    function applyFilters() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        document.querySelectorAll('#tableBody tr').forEach(row => {
            const matchText = row.cells[0].innerText.toLowerCase().includes(search);
            const matchType = !activeType || row.getAttribute('data-type') === activeType;
            const matchOrigin = !activeOrigin || row.getAttribute('data-origin') === activeOrigin;
            row.style.display = (matchText && matchType && matchOrigin) ? '' : 'none';
        });
    }

    // Scroll e Ordenação
    document.getElementById('scrollWrapper').addEventListener('scroll', function() {
        document.body.classList.toggle('scrolled-x', this.scrollLeft > 20);
    });

    function sortTable(idx) {
        const rows = Array.from(tbody.rows);
        sortState.asc = (sortState.idx === idx) ? !sortState.asc : true;
        sortState.idx = idx;

        rows.sort((a, b) => {
            let tA = a.cells[idx].innerText.replace(/[^0-9.-]+/g, "");
            let tB = b.cells[idx].innerText.replace(/[^0-9.-]+/g, "");
            if(idx === 0) return sortState.asc ? a.cells[0].innerText.localeCompare(b.cells[0].innerText) : b.cells[0].innerText.localeCompare(a.cells[0].innerText);
            return sortState.asc ? parseFloat(tA) - parseFloat(tB) : parseFloat(tB) - parseFloat(tA);
        });

        document.querySelectorAll('.sort-indicator').forEach(s => s.innerText = '');
        document.getElementById(`sort-${idx}`).innerText = sortState.asc ? ' ▲' : ' ▼';
        rows.forEach(r => tbody.appendChild(r));
    }

    // Modal
    function openAnalysis(n, t, v) {
        const perf = getPerf(v);
        document.getElementById('mTitle').innerText = n + " (" + t + ")";
        document.getElementById('mStatus').innerText = perf.t;
        document.getElementById('mStatus').style.backgroundColor = perf.cor;
        document.getElementById('anaModal').style.display = 'block';
        updateChart(perf.cor);
    }

    function closeModal() { document.getElementById('anaModal').style.display = 'none'; }

    function updateChart(color) {
        const ctx = document.getElementById('evolutionChart').getContext('2d');
        const count = parseInt(document.getElementById('viewSelect').value);
        if(currentChart) currentChart.destroy();
        currentChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: Array.from({length: count}, (_, i) => `P${i+1}`),
                datasets: [{ data: Array.from({length: count}, () => Math.random()*100), backgroundColor: color }]
            },
            options: { maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });
    }
</script>
</body>
</html>
