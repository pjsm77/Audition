<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Plenobras - Mobile</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --verde: #518e30; --vermelho: #c94136; --amarelo: #efb31d;
            --bg: #f5f7fa; --card-bg: #ffffff; --texto: #333;
        }

        body { font-family: sans-serif; background: var(--bg); color: var(--texto); margin: 0; padding: 15px; }
        
        /* Controles de Filtro */
        .controls { position: sticky; top: 0; background: var(--bg); z-index: 10; padding-bottom: 10px; }
        input, select { width: 100%; padding: 12px; margin: 5px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }

        /* Estilo dos Cards */
        .card { 
            background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-left: 6px solid #ccc;
            transition: all 0.3s ease;
        }
        .card.Verde { border-left-color: var(--verde); }
        .card.Vermelho { border-left-color: var(--vermelho); }
        .card.Amarelo { border-left-color: var(--amarelo); }

        .card-header { display: flex; justify-content: space-between; font-size: 0.8rem; color: #666; font-weight: bold; }
        .card-title { font-size: 1.1rem; margin: 10px 0; font-weight: bold; }
        .values { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .val-box { background: #f9f9f9; padding: 8px; border-radius: 6px; }
        .val-label { font-size: 0.7rem; color: #888; }
        .val-num { font-size: 0.9rem; font-weight: bold; display: block; }

        /* Gráfico ocultável */
        .chart-container { display: none; margin-top: 15px; height: 150px; }
        .show-chart .chart-container { display: block; }
        .btn-chart { background: none; border: 1px solid #ddd; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 0.7rem; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="controls">
        <input type="text" id="search" placeholder="?? Buscar indicador..." onkeyup="filterData()">
        <select id="themeFilter" onchange="filterData()">
            <option value="">Todos os Temas</option>
            <option value="COMERCIAL">Comercial</option>
            <option value="FINANCEIRO">Financeiro</option>
        </select>
    </div>

    <div id="dashboard">
        </div>

    <script>
        // Simulando os dados que viriam da sua procedure 'pr_116_robo_169V_dados_limpos'
        const mockData = [
            { Tema: 'COMERCIAL', Indicador: 'Faturamento Mensal', ValorHoje: 45000, ValorMes: 1250000, StatusSinalizacao: 'Verde', Historico: [1000000, 1100000, 1250000] },
            { Tema: 'FINANCEIRO', Indicador: 'Inadimplência', ValorHoje: 1200, ValorMes: 42000, StatusSinalizacao: 'Vermelho', Historico: [30000, 35000, 42000] }
        ];

        function renderCards(data) {
            const container = document.getElementById('dashboard');
            container.innerHTML = data.map((item, index) => `
                <div class="card ${item.StatusSinalizacao}" data-tema="${item.Tema}" data-nome="${item.Indicador}">
                    <div class="card-header">
                        <span>${item.Tema}</span>
                        <span style="color:var(--${item.StatusSinalizacao.toLowerCase()})">? ${item.StatusSinalizacao}</span>
                    </div>
                    <div class="card-title">${item.Indicador}</div>
                    <div class="values">
                        <div class="val-box"><span class="val-label">Hoje</span><span class="val-num">R$ ${item.ValorHoje.toLocaleString()}</span></div>
                        <div class="val-box"><span class="val-label">Mês Acum.</span><span class="val-num">R$ ${item.ValorMes.toLocaleString()}</span></div>
                    </div>
                    <button class="btn-chart" onclick="toggleChart(${index})">?? Ver Histórico</button>
                    <div class="chart-container" id="chart-cont-${index}">
                        <canvas id="chart-${index}"></canvas>
                    </div>
                </div>
            `).join('');
        }

        function filterData() {
            const search = document.getElementById('search').value.toLowerCase();
            const theme = document.getElementById('themeFilter').value;
            
            const filtered = mockData.filter(item => {
                return (item.Indicador.toLowerCase().includes(search)) &&
                       (theme === "" || item.Tema === theme);
            });
            renderCards(filtered);
        }

        function toggleChart(index) {
            const card = document.querySelectorAll('.card')[index];
            card.classList.toggle('show-chart');
            
            const ctx = document.getElementById(`chart-${index}`).getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['2 Anos Atrás', 'Ano Anterior', 'Atual'],
                    datasets: [{
                        label: 'Evolução',
                        data: mockData[index].Historico,
                        borderColor: '#2c3e50',
                        tension: 0.1
                    }]
                },
                options: { maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        // Inicializa
        renderCards(mockData);
    </script>
</body>
</html>
