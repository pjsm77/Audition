<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Deezer Fast Collector (JSONP)</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; text-align: center; }
        textarea { width: 80%; height: 150px; background: #222; color: #0f0; padding: 10px; border: 1px solid #444; }
        button { background: #ef5464; color: white; border: none; padding: 15px 30px; border-radius: 25px; cursor: pointer; font-weight: bold; margin: 10px; }
        #progress { margin: 10px; font-weight: bold; color: #00d2ff; }
        #log { width: 80%; margin: 10px auto; text-align: left; background: #000; padding: 10px; height: 200px; overflow-y: scroll; font-size: 11px; border: 1px solid #333; }
    </style>
</head>
<body>
    <h2>?? Coletor Deezer Direct (JSONP)</h2>
    <p>Cole os IDs dos álbuns (um por linha):</p>
    <textarea id="idsInput" placeholder="Ex: 72825002"></textarea><br>
    <button onclick="startCollection()">Processar Agora</button>
    <div id="progress">Aguardando...</div>
    <div id="log"></div>

    <script>
        const resultados = [];
        let idsParaProcessar = [];
        let indiceAtual = 0;

        function startCollection() {
            const input = document.getElementById('idsInput').value;
            idsParaProcessar = input.split('\n').map(id => id.trim()).filter(id => id !== "");
            if(idsParaProcessar.length === 0) return alert("Cole alguns IDs!");
            
            resultados.length = 0;
            indiceAtual = 0;
            document.getElementById('log').innerHTML = "";
            processNext();
        }

        function processNext() {
            if (indiceAtual >= idsParaProcessar.length) {
                finish();
                return;
            }

            const id = idsParaProcessar[indiceAtual];
            document.getElementById('progress').innerText = `Processando: ${indiceAtual + 1} de ${idsParaProcessar.length}`;

            // Criamos um elemento de script para carregar os dados via JSONP (contorna o CORS)
            const script = document.createElement('script');
            // O callback 'handleResponse' será chamado pelo Deezer
            script.src = `https://api.deezer.com/album/${id}?output=jsonp&callback=handleResponse`;
            script.id = "deezer-script";
            document.body.appendChild(script);
        }

        // Esta função é chamada automaticamente quando o Deezer responde
        function handleResponse(data) {
            const log = document.getElementById('log');
            
            if (data && !data.error) {
                // No Deezer, a URL da capa vem completa. 
                // Salvamos o radical da imagem para facilitar a troca de tamanho depois.
                const coverBase = data.cover_small.split('100x100')[0];

                resultados.push({
                    id: data.id,
                    t: data.title,
                    a: data.artist.name,
                    u: coverBase,
                    p: "N/A", // Deezer não fornece o país do artista diretamente nesta chamada
                    d: Math.floor(data.duration / 60),
                    l: data.link
                });
                log.innerHTML += `<span style="color:#0f0">? ID ${data.id}: ${data.title}</span><br>`;
            } else {
                log.innerHTML += `<span style="color:#f00">? Erro no ID ${idsParaProcessar[indiceAtual]}</span><br>`;
            }

            // Remove o script usado e vai para o próximo
            const oldScript = document.getElementById('deezer-script');
            if(oldScript) oldScript.remove();
            
            indiceAtual++;
            log.scrollTop = log.scrollHeight;
            
            // Pequeno delay para não sobrecarregar o navegador, mas é muito mais rápido que o proxy
            setTimeout(processNext, 50); 
        }

        function finish() {
            document.getElementById('progress').innerText = "? Concluído!";
            const blob = new Blob([JSON.stringify(resultados)], {type: 'application/json'});
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'meus_albuns_deezer.json';
            a.click();
        }
    </script>
</body>
</html>
