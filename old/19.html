<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LPG - Life Programs Game V18</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #121212; --card-bg: #1e1e1e; --text: #ffffff;
            --score-red: #ff4d4d; --score-yellow: #ffff4d; --score-green: #4dff88;
        }

        body { font-family: 'Segoe UI', system-ui; background: var(--bg); color: var(--text); margin: 0; padding: 10px; touch-action: pan-y; overflow-x: hidden; }
        
        /* Cabeçalho e Navegação */
        .header-row { display: flex; justify-content: center; align-items: center; position: relative; margin: 10px 0; }
        .date-display { font-size: 1.1rem; font-weight: bold; color: #4a90e2; text-transform: uppercase; letter-spacing: 1px; }
        .toggle-chart { position: absolute; right: 10px; background: none; border: none; color: #666; cursor: pointer; font-size: 1.2rem; }

        /* Gráfico */
        .chart-card { background: var(--card-bg); padding: 15px; border-radius: 15px; height: 260px; margin-bottom: 15px; transition: all 0.3s ease; overflow: hidden; }
        .chart-card.hidden { height: 0; padding: 0; margin-bottom: 0; opacity: 0; }

        /* Controles (Toolbar) */
        .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .toolbar select { background: #2d2d2d; border: 1px solid #444; color: white; padding: 8px; border-radius: 8px; font-size: 0.8rem; width: 100%; }

        /* Grade de Programas */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 12px; }

        /* Estilo do Cartão/Botão de Programa */
        .prog-btn {
            aspect-ratio: 1/1; border-radius: 18px; border: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; transition: all 0.2s; cursor: pointer; color: white; padding: 5px;
            overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        }

        /* Elementos Internos do Cartão */
        .prog-icon-bg { position: absolute; font-size: 3.2rem; opacity: 0.12; z-index: 1; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .btn-content { z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; position: relative; }
        
        /* Estados de Atividade */
        .st-none { opacity: 0.45; filter: grayscale(0.3); }
        .st-active { opacity: 1; filter: none; }
        .st-inactive { opacity: 0.3; border: 2px dashed #666; }

        /* Labels e Informações nos Botões */
        .top-left { position: absolute; top: 5px; left: 8px; font-size: 0.7rem; font-weight: bold; }
        .status-slot { position: absolute; top: 5px; right: 8px; display: flex; flex-direction: column; align-items: center; min-height: 28px; }
        .behavior-icon { font-size: 0.55rem; opacity: 0.7; margin-top: 2px; }
        .top-center { position: absolute; top: 12%; font-size: 0.55rem; font-weight: bold; background: rgba(0,0,0,0.3); padding: 1px 4px; border-radius: 3px; }
        .sigla { font-size: 1.25rem; font-weight: 950; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
        .metas-label { font-size: 0.55rem; font-weight: bold; opacity: 0.9; margin-top: 1px; }
        .xp-label { position: absolute; bottom: 18%; font-size: 0.6rem; font-weight: 800; }
        .days-counter { position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%); font-size: 0.6rem; font-weight: bold; color: white; opacity: 0.9; }
        .bottom-left { position: absolute; bottom: 5px; left: 8px; font-size: 0.6rem; font-weight: bold; }
        .bottom-right { position: absolute; bottom: 5px; right: 8px; font-size: 0.65rem; color: #ffd700; }

        /* Modal e Overlay */
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 380px; background: #252525; border-radius: 20px; padding: 20px; z-index: 1000; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999; backdrop-filter: blur(4px); }
    </style>
</head>
<body id="swipeArea">

    <div class="header-row">
        <div id="dateDisplay" class="date-display"></div>
        <button class="toggle-chart" onclick="toggleChart()"><i id="eyeIcon" class="fa-solid fa-eye"></i></button>
    </div>

    <div id="chartContainer" class="chart-card">
        <canvas id="perfChart"></canvas>
    </div>

    <div class="toolbar">
        <select id="sortFilter" onchange="renderGrid()">
            <option value="prio">Ordem: Prioridade</option>
            <option value="cat">Ordem: Categoria</option>
            <option value="streak">Ordem: Streaks (🔥)</option>
            <option value="days">Ordem: Dias p/ Lvl Up</option>
            <option value="mk">Ordem: Meta Check</option>
            <option value="lvl">Ordem: Nível</option>
            <option value="score">Ordem: Performance</option>
        </select>
        <select id="periodFilter" onchange="initDashboard()">
            <option value="7">Período: 7 Dias</option>
            <option value="15">Período: 15 Dias</option>
            <option value="30" selected>Período: 30 Dias</option>
        </select>
        <select id="statusFilter" onchange="renderGrid()">
            <option value="active">Ver: Ativos</option>
            <option value="inactive">Ver: Inativos</option>
            <option value="all">Ver: Todos</option>
        </select>
        <div style="font-size: 0.6rem; color: #555; text-align: center; font-weight: bold; padding-top: 10px;">LPG ENGINE V18</div>
    </div>

    <div class="grid" id="mainGrid"></div>

    <div class="overlay" id="overlay" onclick="closeModal()"></div>
    <div id="modal" class="modal">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
            <h3 id="mTitle" style="margin:0"></h3>
            <button onclick="closeModal()" style="background:none; border:none; color:red; font-size:1.5rem;">&times;</button>
        </div>
        <input type="number" id="valInput" style="width:100%; background:#333; color:white; padding:12px; border:none; border-radius:10px; text-align:center; font-size:1.5rem;" placeholder="Inserir XP">
    </div>

<script>
/* SECTION 3: CONFIGURAÇÕES E CONSTANTES */
    const COLORS = ["#F87171", "#FB923C", "#FBBF24", "#FACC15", "#EAB308", "#D9F99D", "#BEF264", "#84CC16", "#4ADE80", "#22C55E"];
    
    // Novas 10 cores de categorias homologadas
    const CAT_COLORS = {
        C1: "#38bdf8", C2: "#22d3ee", C3: "#6366f1", C4: "#a855f7", C5: "#ec4899",
        C6: "#be123c", C7: "#f97316", C8: "#facc15", C9: "#a3e635", C10: "#22c55e"
    };

/* SECTION 4: DEFINIÇÃO DOS 24 PROGRAMAS E 10 CATEGORIAS */
    const programs = [
        { s: "LIS", n: "Listening", c: "C1", mk: 5, md: 10, prio: 1, icon: "fa-headphones", type: "VOLUME", startDate: "2024-01-01", active: true },
        { s: "GYM", n: "Gym", c: "C10", mk: 1, md: 1, prio: 1, icon: "fa-dumbbell", type: "CONSISTENCY", startDate: "2024-01-01", active: true },
        { s: "COD", n: "Coding", c: "C3", mk: 30, md: 60, prio: 2, icon: "fa-code", type: "VOLUME", startDate: "2024-01-10", active: true },
        { s: "H2O", n: "Water", c: "C2", mk: 4, md: 8, prio: 1, icon: "fa-faucet-drip", type: "CONSISTENCY", startDate: "2024-01-01", active: true },
        { s: "MED", n: "Meditation", c: "C4", mk: 5, md: 15, prio: 3, icon: "fa-brain", type: "VOLUME", startDate: "2024-01-01", active: true },
        { s: "REA", n: "Leitura", c: "C5", mk: 10, md: 20, prio: 2, icon: "fa-book-open", type: "VOLUME", startDate: "2024-01-01", active: true },
        { s: "RUN", n: "Corrida", c: "C6", mk: 3, md: 5, prio: 2, icon: "fa-person-running", type: "VOLUME", startDate: "2024-01-01", active: true },
        { s: "FIN", n: "Finanças", c: "C7", mk: 1, md: 1, prio: 1, icon: "fa-piggy-bank", type: "CONSISTENCY", startDate: "2024-01-01", active: true },
        { s: "ENG", n: "Inglês", c: "C8", mk: 20, md: 40, prio: 2, icon: "fa-language", type: "VOLUME", startDate: "2024-01-01", active: true },
        { s: "SLP", n: "Sono", c: "C9", mk: 7, md: 8, prio: 1, icon: "fa-bed", type: "CONSISTENCY", startDate: "2024-01-01", active: true }
    ];

    for(let i = programs.length + 1; i <= 24; i++) {
        const catKey = "C" + ((i % 10) + 1);
        programs.push({ s: "P"+i, n: "Programa "+i, c: catKey, mk: 5, md: 10, prio: 4, icon: "fa-plus", type: "CONSISTENCY", startDate: "2024-01-01", active: true });
    }

    /* SECTION 5: ESTADO GLOBAL E BANCO DE DADOS */
    let db = JSON.parse(localStorage.getItem('lpg_v17_db')) || { logs: [] };
    let activeDate = new Date().toISOString().split('T')[0];
    let chartInstance = null;
    let currentSigla = null;

    // Gerador de Dados Iniciais para popular o sistema
    if(db.logs.length < 50) {
        for(let i=45; i>=0; i--) {
            let d = new Date(); d.setDate(d.getDate() - i);
            let ds = d.toISOString().split('T')[0];
            programs.forEach(p => {
                if(ds >= p.startDate && Math.random() > 0.25) {
                    db.logs.push({ id: Date.now()+Math.random(), s: p.s, d: ds, v: Math.round(p.mk * (0.8 + Math.random()*0.5)) });
                }
            });
        }
        localStorage.setItem('lpg_v17_db', JSON.stringify(db));
    }

    /* SECTION 6: LÓGICA DE NEGÓCIO (CÁLCULOS) */
    const getDayTotal = (s, d) => db.logs.filter(l => l.s === s && l.d === d).reduce((a, b) => a + b.v, 0);
    const getXP = (s) => db.logs.filter(l => l.s === s).reduce((a, b) => a + b.v, 0);
    const getLevel = (s) => Math.floor(getXP(s) / 1000) + 1;
    const getDaysToLvl = (p) => Math.max(1, Math.ceil((1000 - (getXP(p.s) % 1000)) / (p.mk || 1)));
    
    function getStreak(sigla) {
        let count = 0; let d = new Date(activeDate + "T12:00:00");
        while(true) {
            let ds = d.toISOString().split('T')[0];
            let p = programs.find(x => x.s === sigla);
            if(!p || ds < p.startDate || getDayTotal(sigla, ds) < p.mk) break;
            count++; d.setDate(d.getDate()-1);
        }
        return count;
    }

    function getScore(sigla, days) {
        let totalPct = 0; let validDays = 0; let d = new Date(activeDate + "T12:00:00");
        for(let i=0; i<days; i++) {
            let ds = d.toISOString().split('T')[0];
            let p = programs.find(x => x.s === sigla);
            if(p && ds >= p.startDate) { totalPct += Math.min(1, getDayTotal(sigla, ds) / p.md); validDays++; }
            d.setDate(d.getDate()-1);
        }
        return validDays ? Math.round((totalPct / validDays) * 100) : 0;
    }

    /* SECTION 7: RENDERIZAÇÃO DA INTERFACE */
    function initDashboard() {
        const opt = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('dateDisplay').innerText = new Date(activeDate + "T12:00:00").toLocaleDateString('pt-BR', opt);
        renderGrid(); renderChart();
    }

    function renderGrid() {
        const grid = document.getElementById('mainGrid');
        const sort = document.getElementById('sortFilter').value;
        const statusMode = document.getElementById('statusFilter').value;
        const period = parseInt(document.getElementById('periodFilter').value);

        // Filtro de data de existência
        let list = programs.filter(p => activeDate >= p.startDate);
        
        // Filtro de Ativo/Inativo
        if(statusMode === 'active') list = list.filter(p => p.active);
        if(statusMode === 'inactive') list = list.filter(p => !p.active);

        // Algoritmos de Ordenação
        list.sort((a,b) => {
            if(sort === 'cat') return a.c.localeCompare(b.c);
            if(sort === 'streak') return getStreak(b.s) - getStreak(a.s);
            if(sort === 'days') return getDaysToLvl(a) - getDaysToLvl(b);
            if(sort === 'mk') return b.mk - a.mk;
            if(sort === 'lvl') return getLevel(b.s) - getLevel(a.s);
            if(sort === 'score') return getScore(b.s, period) - getScore(a.s, period);
            return a.prio - b.prio;
        });

        grid.innerHTML = '';
        list.forEach(p => {
            const val = getDayTotal(p.s, activeDate);
            const score = getScore(p.s, period);
            const xpTotal = getXP(p.s);
            
            // Definição dos ícones de status (V14 homologado)
            let statusIcons = '';
            if(val >= p.md) statusIcons = '<i class="fa-solid fa-star" style="color:#ffd700; font-size:0.75rem;"></i>';
            else if(val >= p.mk) statusIcons = '<i class="fa-solid fa-circle-check" style="color:#fff; font-size:0.75rem;"></i>';

            grid.innerHTML += `
                <div class="prog-btn ${p.active ? (val >= p.mk ? "st-active" : "st-none") : "st-inactive"}" style="background-color: ${CAT_COLORS[p.c]}" onclick="openManageModal('${p.s}')">
                    <i class="fa-solid ${p.icon} prog-icon-bg"></i>
                    <div class="btn-content">
                        <span class="top-left">${val || ''}</span>
                        <div class="status-slot">
                            ${statusIcons}
                            <i class="fa-solid ${p.type === 'VOLUME' ? 'fa-bars-staggered' : 'fa-anchor'} behavior-icon"></i>
                        </div>
                        <span class="top-center">${score}%</span>
                        <span class="sigla" style="color: ${score < 50 ? 'var(--score-red)' : (score < 80 ? 'var(--score-yellow)' : 'var(--score-green)')}">${p.s}</span>
                        <span class="metas-label">${p.mk}/${p.md}</span>
                        <span class="xp-label">${xpTotal} XP</span>
                        <span class="days-counter">${getDaysToLvl(p)}</span>
                        <span class="bottom-left">L${getLevel(p.s)}</span>
                        <span class="bottom-right">${getStreak(p.s) || ''}🔥</span>
                    </div>
                </div>`;
        });
    }

    /* SECTION 8: LÓGICA DO GRÁFICO (CHART.JS) - ATUALIZADA COM LINHA DE TENDÊNCIA */
function renderChart() {
    const ctx = document.getElementById('perfChart').getContext('2d');
    const period = parseInt(document.getElementById('periodFilter').value);
    const labels = [], scores = [], barColors = [], checks = [], trendData = [];

    for(let i = period - 1; i >= 0; i--) {
        let d = new Date(activeDate + "T12:00:00"); d.setDate(d.getDate() - i);
        let ds = d.toISOString().split('T')[0];
        labels.push(d.getDate());

        let dailyPrograms = programs.filter(p => ds >= p.startDate && p.active);
        let dayPct = 0, dayChecks = 0;
        
        dailyPrograms.forEach(p => {
            const v = getDayTotal(p.s, ds);
            dayPct += Math.min(1, v / p.md);
            if(v >= p.mk) dayChecks++;
        });

        let final = dailyPrograms.length ? Math.round((dayPct / dailyPrograms.length) * 100) : 0;
        scores.push(final);
        checks.push(dayChecks);
        barColors.push(COLORS[Math.min(9, Math.floor(final/10))]);
        
        // Lógica da Linha de Tendência (Média Simples acumulada para visualização)
        const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
        trendData.push(avg.toFixed(1));
    }

    if(chartInstance) chartInstance.destroy();
    chartInstance = new Chart(ctx, {
        data: {
            labels: labels,
            datasets: [
                {
                    type: 'line',
                    label: 'Tendência',
                    data: trendData,
                    borderColor: 'rgba(255, 255, 255, 0.4)',
                    borderWidth: 2,
                    pointRadius: 0,
                    fill: false,
                    tension: 0.4,
                    zIndex: 10
                },
                {
                    type: 'bar',
                    label: 'Score',
                    data: scores,
                    backgroundColor: barColors,
                    borderRadius: 4,
                    zIndex: 5
                }
            ]
        },
        options: {
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { 
                y: { display: false, max: 135 }, 
                x: { grid: { display: false }, ticks: { color: '#888', font: { size: period > 15 ? 8 : 10 } } } 
            },
            animation: {
                onComplete: function() {
                    const chart = this; const ctx = chart.ctx;
                    ctx.textAlign = 'center'; ctx.font = 'bold 9px Arial';
                    // Renderiza apenas os textos das barras (dataset index 1)
                    chart.data.datasets[1].data.forEach((val, i) => {
                        const meta = chart.getDatasetMeta(1).data[i];
                        ctx.fillStyle = '#fff'; ctx.fillText(val + '%', meta.x, meta.y - 12);
                        ctx.fillStyle = '#888'; ctx.fillText(checks[i], meta.x, meta.y - 4);
                    });
                }
            }
        }
    });
}

    /* SECTION 9: INTERAÇÕES E MODAL */
    function openManageModal(sigla) {
        currentSigla = sigla;
        document.getElementById('mTitle').innerText = programs.find(x => x.s === sigla).n;
        document.querySelectorAll('#modal, #overlay').forEach(el => el.style.display = 'block');
        const input = document.getElementById('valInput');
        input.value = ''; setTimeout(() => input.focus(), 100);
    }
    
    function closeModal() { document.querySelectorAll('#modal, #overlay').forEach(el => el.style.display = 'none'); }
    
    function save() { 
        localStorage.setItem('lpg_v17_db', JSON.stringify(db)); 
        initDashboard(); 
    }

    document.getElementById('valInput').onkeypress = (e) => {
        if(e.key === 'Enter') {
            const v = parseFloat(e.target.value);
            if(!isNaN(v)) { db.logs.push({ id: Date.now(), s: currentSigla, d: activeDate, v: v }); save(); closeModal(); }
        }
    };

    function toggleChart() { document.getElementById('chartContainer').classList.toggle('hidden'); }

    /* SECTION 10: NAVEGAÇÃO TOUCH (SWIPE) */
    let tsX = 0;
    document.getElementById('swipeArea').addEventListener('touchstart', e => tsX = e.changedTouches[0].screenX);
    document.getElementById('swipeArea').addEventListener('touchend', e => {
        let teX = e.changedTouches[0].screenX;
        let d = new Date(activeDate + "T12:00:00");
        if (teX < tsX - 80) d.setDate(d.getDate() + 1);
        if (teX > tsX + 80) d.setDate(d.getDate() - 1);
        activeDate = d.toISOString().split('T')[0];
        initDashboard();
    });

    // Inicialização Final
    initDashboard();
</script>
</body>
</html>
