<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Curadoria Musical Pro</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --primary: #2dd4bf; --border: #334155; --accent: #818cf8; --warning: #fbbf24; --error: #f43f5e; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; display: flex; justify-content: center; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; width: 100%; max-width: 500px; border: 1px solid var(--border); box-sizing: border-box; }
        
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { font-size: 0.7rem; margin-bottom: 5px; color: #94a3b8; text-transform: uppercase; font-weight: bold; }
        input, select { background: #0f172a; border: 1px solid var(--border); padding: 12px; border-radius: 8px; color: white; font-size: 1rem; width: 100%; box-sizing: border-box; outline: none; }
        
        .track-viewer { background: #020617; border: 1px solid var(--border); border-radius: 8px; margin-top: 10px; max-height: 150px; overflow-y: auto; padding: 10px; font-size: 0.85rem; color: #94a3b8; }
        .track-item { padding: 4px 0; border-bottom: 1px solid #1e293b; }
        
        .btn-row { display: flex; gap: 8px; margin-bottom: 15px; }
        .btn-action { flex: 1; padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; color: #0f172a; transition: 0.2s; }
        
        .status-badge { padding: 10px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 15px; display: none; font-weight: bold; text-align: center; border: 1px solid transparent; }
        .badge-found { background: rgba(251, 191, 36, 0.2); border-color: var(--warning); color: var(--warning); }
        .badge-new { background: rgba(45, 212, 191, 0.2); border-color: var(--primary); color: var(--primary); }

        .rating-container { display: flex; gap: 8px; }
        .rating-btn { flex: 1; padding: 12px; border: 1px solid var(--border); background: #1e293b; color: white; cursor: pointer; border-radius: 6px; }
        .rating-btn.active { background: var(--primary); color: #0f172a; font-weight: bold; border-color: var(--primary); }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="text-align: center; color: var(--primary); margin: 0 0 15px 0;">Sincronização Musical</h2>

    <div class="btn-row">
        <button class="btn-action" style="background: var(--accent);" onclick="pasteFromClipboard()">📋 Colar Link</button>
        <button class="btn-action" style="background: #64748b;" onclick="location.reload()">🗑️ Limpar</button>
    </div>

    <div class="form-group">
        <label>Link do Álbum (Deezer)</label>
        <input type="text" id="deezer_url" placeholder="Aguardando link..." 
               oninput="processUrl(this.value)" 
               onpaste="setTimeout(() => processUrl(this.value), 100)">
    </div>

    <div id="status-badge" class="status-badge"></div>

    <div id="review-panel" class="hidden">
        <div style="display: flex; gap: 15px; align-items: center; background: #020617; padding: 10px; border-radius: 8px;">
            <img id="view_cover" style="width: 75px; height: 75px; border-radius: 4px; object-fit: cover;">
            <div style="flex: 1;">
                <div id="view_album" style="font-weight: bold; font-size: 0.9rem; line-height: 1.2;"></div>
                <div id="view_artist" style="color: var(--primary); font-size: 0.8rem; margin: 4px 0;"></div>
                <a id="search_link" target="_blank" style="font-size: 0.7rem; color: var(--accent); text-decoration: underline;">🔍 Pesquisar Origem</a>
            </div>
        </div>

        <div class="track-viewer" id="view_tracks"></div>

        <div id="manual-validation" style="margin-top: 20px;">
            <div class="form-group">
                <label>País de Origem</label>
                <input list="countries_list" id="country_search" placeholder="Digite para filtrar..." oninput="onCountrySelect(this.value)">
                <datalist id="countries_list"></datalist>
                <input type="hidden" id="country_id">
            </div>

            <div id="state_group" class="form-group hidden">
                <label>Estado</label>
                <select id="state_id" onchange="onStateSelect()"></select>
            </div>

            <div id="city_group" class="form-group hidden">
                <label>Cidade</label>
                <select id="city_id" onchange="checkNewCity(this.value)"></select>
                <input type="text" id="new_city_name" class="hidden" placeholder="Nome da cidade..." style="margin-top:8px;">
            </div>

            <div class="form-group">
                <label>Idioma Principal</label>
                <select id="lang_id" onchange="checkOtherLang(this.value)">
                    <option value="">Selecione...</option>
                    <option value="africano">Africano</option><option value="alemao">Alemão</option><option value="arabe">Árabe</option>
                    <option value="chines">Chinês</option><option value="coreano">Coreano</option><option value="dinamarques">Dinamarquês</option>
                    <option value="espanhol">Espanhol</option><option value="finlandes">Finlandês</option><option value="frances">Francês</option>
                    <option value="grego">Grego</option><option value="hindi">Hindi</option><option value="holandes">Holandês</option>
                    <option value="ingles">Inglês</option><option value="islandes">Islandês</option><option value="italiano">Italiano</option>
                    <option value="japones">Japonês</option><option value="noruegues">Norueguês</option><option value="persa">Persa</option>
                    <option value="polones">Polonês</option><option value="portugues">Português</option><option value="russo">Russo</option>
                    <option value="sueco">Sueco</option><option value="tailandes">Tailandês</option><option value="turco">Turco</option>
                    <option value="vietnamita">Vietnamita</option><option value="instrumental">Instrumental</option>
                    <option value="OTHER">Outro...</option>
                </select>
                <input type="text" id="other_lang_name" class="hidden" placeholder="Qual idioma?" style="margin-top:8px;">
            </div>

            <div class="form-group">
                <label>Avaliação</label>
                <div class="rating-container">
                    <button class="rating-btn" onclick="setRate(1)">1</button>
                    <button class="rating-btn" onclick="setRate(2)">2</button>
                    <button class="rating-btn" onclick="setRate(3)">3</button>
                </div>
                <input type="hidden" id="rate_val" value="1">
            </div>

            <button class="btn-action" style="background: var(--primary); width: 100%; margin-top: 10px;" onclick="generatePayload()">CONFERIR PAYLOAD</button>
        </div>
    </div>
</div>

<script>
    const URL_SB = 'https://qdawxpcwkadhfwqhnpsd.supabase.co';
    const KEY_SB = 'sb_publishable_W6LnlxFB_jpBKDN2cn5oKQ_j_g1OZO2';

    let tempAlbum = null;
    let globalCountries = [];
    window.currentDbData = null;

    function showStatus(text, type) {
        const b = document.getElementById('status-badge');
        b.innerText = text; b.style.display = 'block';
        b.className = `status-badge badge-${type}`;
    }

    async function processUrl(url) {
        const idMatch = url.match(/album\/(\d+)/);
        if (!idMatch) return;
        const albumId = idMatch[1];

        showStatus("🔍 Consultando banco de dados...", "new");

        try {
            // BUSCA ÁLBUM (deezer_id_album)
            const res = await fetch(`${URL_SB}/rest/v1/tbl_albums?deezer_id_album=eq.${albumId}&select=*,tbl_artists(*)`, {
                headers: { apikey: KEY_SB, Authorization: `Bearer ${KEY_SB}` }
            });
            const data = await res.json();

            if (data && data.length > 0) {
                showStatus("⚠️ ÁLBUM JÁ CADASTRADO!", "found");
                window.currentDbData = data[0];
            } else {
                window.currentDbData = null;
            }

            // CARREGA DADOS DO DEEZER (JSONP)
            const old = document.getElementById('deezer-jsonp');
            if (old) old.remove();
            const s = document.createElement('script');
            s.id = 'deezer-jsonp';
            s.src = `https://api.deezer.com/album/${albumId}?output=jsonp&callback=handleDeezerResponse`;
            document.body.appendChild(s);

        } catch (e) { console.error(e); }
    }

    async function handleDeezerResponse(data) {
        if (data.error) return showStatus("❌ Erro no Deezer", "error");
        tempAlbum = data;

        // Se o álbum for novo, checa se o ARTISTA já existe (deezer_id)
        if (!window.currentDbData) {
            const artRes = await fetch(`${URL_SB}/rest/v1/tbl_artists?deezer_id=eq.${data.artist.id}&select=*`, {
                headers: { apikey: KEY_SB, Authorization: `Bearer ${KEY_SB}` }
            });
            const artData = await artRes.json();
            if (artData && artData.length > 0) {
                showStatus("👤 ARTISTA CADASTRADO (Dados recuperados)", "found");
                window.currentDbData = { id_country: artData[0].id_country, id_state: artData[0].id_state, id_city: artData[0].id_city };
            } else {
                showStatus("✨ NOVO CADASTRO", "new");
            }
        }

        renderInterface(data);
    }

    async function renderInterface(data) {
        document.getElementById('review-panel').classList.remove('hidden');
        document.getElementById('view_cover').src = data.cover_medium;
        document.getElementById('view_album').innerText = data.title;
        document.getElementById('view_artist').innerText = data.artist.name;
        document.getElementById('view_tracks').innerHTML = data.tracks.data.map(t => `<div class="track-item">• ${t.title}</div>`).join('');
        
        document.getElementById('search_link').href = `https://www.google.com/search?q=${encodeURIComponent(`Cidade e país de origem do artista ${data.artist.name}, que lançou o álbum ${data.title}`)}`;

        await loadCountries();
        if (window.currentDbData) autoFill(window.currentDbData);
    }

    // --- GEOGRAFIA ---
    async function loadCountries() {
        const res = await fetch(`${URL_SB}/rest/v1/tbl_countries?select=*&order=portuguese_name`, { headers: { apikey: KEY_SB, Authorization: `Bearer ${KEY_SB}` } });
        globalCountries = await res.json();
        document.getElementById('countries_list').innerHTML = globalCountries.map(c => `<option value="${c.portuguese_name}">`).join('');
    }

    async function onCountrySelect(val, db = null) {
        const country = globalCountries.find(c => c.portuguese_name === val);
        if (!country) return;
        document.getElementById('country_id').value = country.id_country;

        const needsState = ['25', '64'].includes(String(country.id_country));
        document.getElementById('state_group').classList.toggle('hidden', !needsState);
        
        if (needsState) {
            await loadStates(country.id_country);
            if (db && db.id_state) document.getElementById('state_id').value = db.id_state;
        }
        await loadCities(country.id_country, needsState ? (db?.id_state || document.getElementById('state_id').value) : null, db);
    }

    async function loadStates(cid) {
        const res = await fetch(`${URL_SB}/rest/v1/tbl_states?id_country=eq.${cid}&order=name`, { headers: { apikey: KEY_SB, Authorization: `Bearer ${KEY_SB}` } });
        const states = await res.json();
        document.getElementById('state_id').innerHTML = '<option value="">Estado...</option>' + states.map(s => `<option value="${s.id_state}">${s.name}</option>`).join('');
    }

    async function onStateSelect() {
        loadCities(document.getElementById('country_id').value, document.getElementById('state_id').value);
    }

    async function loadCities(cid, sid, db = null) {
        let url = `${URL_SB}/rest/v1/tbl_cities?id_country=eq.${cid}&order=name`;
        if(sid) url += `&id_state=eq.${sid}`;
        const res = await fetch(url, { headers: { apikey: KEY_SB, Authorization: `Bearer ${KEY_SB}` } });
        const cities = await res.json();
        const sel = document.getElementById('city_id');
        document.getElementById('city_group').classList.remove('hidden');
        sel.innerHTML = '<option value=".">. (Ponto)</option>' + cities.map(c => `<option value="${c.id_city}">${c.name}</option>`).join('') + '<option value="NEW">+ Adicionar nova...</option>';
        if (db && db.id_city) sel.value = db.id_city;
    }

    // --- AUXILIARES ---
    function autoFill(db) {
        const country = globalCountries.find(c => c.id_country == db.id_country);
        if (country) {
            document.getElementById('country_search').value = country.portuguese_name;
            onCountrySelect(country.portuguese_name, db);
        }
        if (db.language) document.getElementById('lang_id').value = db.language;
        if (db.rating) setRate(db.rating);
    }

    async function pasteFromClipboard() {
        const text = await navigator.clipboard.readText();
        document.getElementById('deezer_url').value = text;
        processUrl(text);
    }

    function setRate(v) {
        document.querySelectorAll('.rating-btn').forEach((b, i) => b.classList.toggle('active', i === v-1));
        document.getElementById('rate_val').value = v;
    }
    function checkNewCity(v) { document.getElementById('new_city_name').classList.toggle('hidden', v !== 'NEW'); }
    function checkOtherLang(v) { document.getElementById('other_lang_name').classList.toggle('hidden', v !== 'OTHER'); }

    function generatePayload() {
        const cName = document.getElementById('country_search').value;
        const citySel = document.getElementById('city_id');
        const cityName = citySel.value === 'NEW' ? document.getElementById('new_city_name').value : citySel.options[citySel.selectedIndex].text;
        const lang = document.getElementById('lang_id').value === 'OTHER' ? document.getElementById('other_lang_name').value : document.getElementById('lang_id').value;
        
        const path = `${cName}_${cityName}_${lang}`.replace(/\s+/g, '');
        console.log("Payload:", { album: tempAlbum.title, path: path });
        alert("Payload gerado no console!\nCaminho: " + path);
    }
</script>
<script id="deezer-jsonp"></script>
</body>
</html>
