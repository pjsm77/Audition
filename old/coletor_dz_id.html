<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Deezer ID Finder</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 20px; text-align: center; }
        textarea { width: 90%; height: 150px; background: #1a1a1a; color: #0f0; padding: 10px; border: 1px solid #444; }
        .btn { background: #00d2ff; color: #000; border: none; padding: 15px 30px; border-radius: 25px; cursor: pointer; font-weight: bold; margin: 10px; }
        #log { width: 90%; margin: 10px auto; text-align: left; background: #000; padding: 10px; height: 300px; overflow-y: scroll; font-size: 11px; border: 1px solid #333; }
        .success { color: #0f0; } .error { color: #f00; }
    </style>
</head>
<body>
    <h2>?? Localizador Automático de IDs Deezer</h2>
    <p>Cole sua lista no formato: <strong>Artista;Álbum</strong> (um por linha)</p>
    <textarea id="listaInput" placeholder="Joe Satriani;Black Swans and Wormhole Wizards"></textarea><br>
    <button class="btn" onclick="iniciarBusca()">Encontrar IDs</button>
    <div id="status">Aguardando...</div>
    <div id="log"></div>

    <script>
        let linhas = [];
        let index = 0;
        let listaFinal = "";

        function iniciarBusca() {
            const input = document.getElementById('listaInput').value;
            linhas = input.split('\n').filter(l => l.includes(';'));
            if(linhas.length === 0) return alert("Formato incorreto! Use Artista;Álbum");
            
            index = 0;
            listaFinal = "";
            document.getElementById('log').innerHTML = "";
            buscarProximo();
        }

        function buscarProximo() {
            if (index >= linhas.length) {
                finalizar();
                return;
            }

            const [artista, album] = linhas[index].split(';');
            const termoBusca = encodeURIComponent(`${artista} ${album}`);
            
            document.getElementById('status').innerText = `Buscando ${index + 1} de ${linhas.length}...`;

            const script = document.createElement('script');
            // Usando o endpoint de busca do Deezer via JSONP
            script.src = `https://api.deezer.com/search/album?q=${termoBusca}&limit=1&output=jsonp&callback=processarBusca`;
            script.id = "search-script";
            document.body.appendChild(script);
        }

        function processarBusca(data) {
            const log = document.getElementById('log');
            const [artistaOriginal, albumOriginal] = linhas[index].split(';');

            if (data.data && data.data.length > 0) {
                const resultado = data.data[0];
                const idEncontrado = resultado.id;
                listaFinal += idEncontrado + "\n";
                log.innerHTML += `<span class="success">? ENCONTRADO: ${artistaOriginal} - ${resultado.title} (ID: ${idEncontrado})</span><br>`;
            } else {
                log.innerHTML += `<span class="error">? NÃO ENCONTRADO: ${artistaOriginal} - ${albumOriginal}</span><br>`;
            }

            document.getElementById('search-script').remove();
            index++;
            log.scrollTop = log.scrollHeight;
            
            // Delay para evitar bloqueio da API
            setTimeout(buscarProximo, 200);
        }

        function finalizar() {
            document.getElementById('status').innerText = "?? Busca concluída!";
            // Cria um arquivo de texto simples apenas com os IDs
            const blob = new Blob([listaFinal], {type: 'text/plain'});
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'ids_encontrados.txt';
            a.click();
            
            alert("Processo finalizado! O arquivo com os IDs foi baixado. Agora use esses IDs no 'Coletor Master' que criamos antes.");
        }
    </script>
</body>
</html>
