<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Artistas por País</title>

  <script src="https://www.gstatic.com/charts/loader.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;      /* centraliza verticalmente */
      justify-content: center;  /* centraliza horizontalmente */
      background: #ffffff;
    }

    #map-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #map_div {
      width: 100%;
      height: 100%;
      min-height: 300px;
    }
  </style>

  <script>
    google.charts.load('current', {
      packages: ['geochart']
    });

    google.charts.setOnLoadCallback(drawMap);

    function getClassValue(artists) {
      if (artists === 0) return 0;
      if (artists <= 5) return 1;
      if (artists <= 10) return 2;
      if (artists <= 20) return 3;
      if (artists <= 50) return 4;
      if (artists <= 100) return 5;
      return 6;
    }

    function drawMap() {
      fetch("https://docs.google.com/spreadsheets/d/1QCyU_zShDAWzsZm1G-8cMUamrMdUOvyc3AIXtnhfiUw/export?format=csv&gid=1871795300")
        .then(response => response.text())
        .then(csv => {

          const rows = csv.split("\n").slice(1);

          const dataArray = [
            ['Country', 'Classe', { role: 'tooltip', type: 'string', p: { html: true } }]
          ];

          rows.forEach(row => {
            const cols = row.split(",");

            const nomePais = cols[0];
            const cc = cols[1];
            const artistas = Number(cols[2]) || 0;

            if (!cc) return;

            const classValue = getClassValue(artistas);

            const tooltip = `
              <div style="padding:8px 10px">
                <strong>${nomePais}</strong><br>
                Código: <b>${cc.toUpperCase()}</b><br>
                Artistas: <b>${artistas}</b>
              </div>
            `;

            dataArray.push([
              cc.trim().toUpperCase(),
              classValue,
              tooltip
            ]);
          });

          const data = google.visualization.arrayToDataTable(dataArray);

          const options = {
            tooltip: { isHtml: true },
            backgroundColor: '#ffffff',
            datalessRegionColor: '#f0f0f0',
            legend: 'none',
            colorAxis: {
              values: [0, 1, 2, 3, 4, 5, 6],
              colors: [
                '#f7f7e8', // 0
                '#fff7bc', // 1–5
                '#fee391', // 6–10
                '#fec44f', // 11–20
                '#fe9929', // 21–50
                '#ec7014', // 51–100
                '#cc4c02'  // >100
              ]
            }
          };

          const chart = new google.visualization.GeoChart(
            document.getElementById('map_div')
          );

          chart.draw(data, options);

          // Redesenha corretamente quando o iframe muda de tamanho
          window.addEventListener('resize', () => {
            chart.draw(data, options);
          });
        });
    }
  </script>
</head>

<body>
  <div id="map-wrapper">
    <div id="map_div"></div>
  </div>
</body>
</html>
