<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sincronizador Master - DB</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --primary: #2dd4bf; --border: #334155; --accent: #818cf8; --warning: #fbbf24; --error: #f43f5e; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 15px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
        .form-group { margin-bottom: 12px; display: flex; flex-direction: column; }
        label { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; font-weight: bold; margin-bottom: 4px; }
        input, select { background: #0f172a; border: 1px solid var(--border); padding: 12px; border-radius: 8px; color: white; font-size: 1rem; width: 100%; box-sizing: border-box; }
        .btn-row { display: flex; gap: 8px; margin-bottom: 15px; }
        .btn { flex: 1; padding: 14px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; text-align: center; }
        .review-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media (min-width: 768px) { .review-grid { grid-template-columns: 1fr 1fr; } .tracks-section { grid-column: span 2; } }
        .section-box { background: rgba(15, 23, 42, 0.5); border: 1px solid var(--border); border-radius: 8px; padding: 15px; }
        .section-title { font-size: 0.85rem; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 10px; font-weight: bold; }
        .data-row { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .track-list { max-height: 200px; overflow-y: auto; font-size: 0.8rem; }
        .track-row { display: grid; grid-template-columns: 25px 1fr 50px 80px; gap: 8px; padding: 8px 0; border-bottom: 1px solid #334155; }
        .status-badge { padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 10px; font-weight: bold; display: none; font-size: 0.9rem; }
        .found { background: rgba(251, 191, 36, 0.15); color: var(--warning); border: 1px solid var(--warning); }
        .new { background: rgba(45, 212, 191, 0.15); color: var(--primary); border: 1px solid var(--primary); }
        .error { background: rgba(244, 63, 94, 0.15); color: var(--error); border: 1px solid var(--error); }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h3 style="margin:0 0 15px 0; color: var(--primary); text-align: center;">Sincronizador Master</h3>
        
        <div class="btn-row">
            <button class="btn" style="background: var(--accent); color: white;" onclick="pasteFromClipboard()">📋 Colar Link</button>
            <button class="btn" style="background: #475569; color: white;" onclick="location.reload()">🗑️ Limpar</button>
        </div>

        <div class="form-group">
            <label>Link do Álbum (Deezer)</label>
            <input type="text" id="deezer_url" placeholder="Cole o link aqui..." oninput="processUrl(this.value)">
        </div>

        <div id="status-msg" class="status-badge"></div>

        <div id="manual-inputs" class="hidden">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group"><label>País</label><input list="countries_list" id="country_search" oninput="onCountrySelect(this.value)"><datalist id="countries_list"></datalist><input type="hidden" id="id_country"></div>
                <div class="form-group"><label>Estado</label><select id="id_state" onchange="onStateSelect()"></select></div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group"><label>Cidade</label><select id="id_city" onchange="updateReview()"></select></div>
                <div class="form-group"><label>Idioma</label><select id="language" onchange="updateReview()"><option value="ingles">Inglês</option><option value="portugues" selected>Português</option><option value="espanhol">Espanhol</option><option value="frances">Francês</option><option value="instrumental">Instrumental</option></select></div>
            </div>
            <div class="form-group"><label>Rating Artista (1-3)</label><select id="art_rating" onchange="updateReview()"><option value="1">⭐ (1)</option><option value="2">⭐⭐ (2)</option><option value="3">⭐⭐⭐ (3)</option></select></div>
        </div>
    </div>

    <div id="review-area" class="review-grid hidden">
        <div class="section-box"><div class="section-title">TBL_ARTISTS</div><div id="review_artist"></div></div>
        <div class="section-box"><div class="section-title">TBL_ALBUMS</div><div id="review_album"></div></div>
        <div class="section-box tracks-section"><div class="section-title">TBL_TRACKS</div><div id="review_tracks" class="track-list"></div></div>
        <button class="btn" style="background: var(--primary); color: #0f172a; width: 100%; grid-column: span 2; font-size: 1.1rem;" onclick="saveToDatabase()">SALVAR NO BANCO</button>
    </div>
</div>

<script>
    // --- VERIFIQUE ESTES DOIS CAMPOS ---
    const URL_SB = 'SUA_URL_DO_SUPABASE'; // Ex: https://xyz.supabase.co
    const KEY_SB = 'SUA_ANON_KEY';

    let rawData = { album: null, tracks: [] };
    let globalCountries = [];
    window.dbRef = null;

    function setStatus(text, type) {
        const el = document.getElementById('status-msg');
        el.innerText = text; el.className = `status-badge ${type}`; el.style.display = 'block';
    }

    async function processUrl(url) {
        const id = url.match(/album\/(\d+)/)?.[1];
        if (!id) return;

        setStatus("🔍 Verificando banco...", "new");
        
        try {
            const resAlb = await fetch(`${URL_SB}/rest/v1/tbl_albums?deezer_id_album=eq.${id}&select=*,tbl_artists(*)`, {
                headers: { 'apikey': KEY_SB, 'Authorization': `Bearer ${KEY_SB}` }
            });

            if (!resAlb.ok) throw new Error("Erro na rede.");
            
            // Proteção para não quebrar se não for JSON
            const text = await resAlb.text();
            try {
                const albData = JSON.parse(text);
                window.dbRef = albData.length > 0 ? albData[0] : null;
            } catch(e) { throw new Error("Resposta inválida do banco."); }

            fetchDeezer(id);
        } catch (err) {
            console.error(err);
            setStatus("⚠️ Falha ao conectar ao Supabase. Verifique URL/Key.", "error");
            fetchDeezer(id);
        }
    }

    function fetchDeezer(id) {
        const old = document.getElementById('deezer-jsonp');
        if (old) old.remove();
        const s = document.createElement('script');
        s.id = 'deezer-jsonp';
        s.src = `https://api.deezer.com/album/${id}?output=jsonp&callback=handleDeezer`;
        document.body.appendChild(s);
    }

    async function handleDeezer(data) {
        if (data.error) return setStatus("❌ Deezer: Álbum não encontrado.", "error");
        rawData.album = data; rawData.tracks = data.tracks.data;

        document.getElementById('manual-inputs').classList.remove('hidden');
        document.getElementById('review-area').classList.remove('hidden');

        if (window.dbRef) {
            setStatus("⚠️ ÁLBUM JÁ CADASTRADO", "found");
            fillGeo(window.dbRef.tbl_artists);
        } else {
            // Tenta buscar o artista pelo ID
            try {
                const resArt = await fetch(`${URL_SB}/rest/v1/tbl_artists?deezer_id=eq.${data.artist.id}&select=*`, {
                    headers: { 'apikey': KEY_SB, 'Authorization': `Bearer ${KEY_SB}` }
                });
                const artData = await resArt.json();
                if (artData.length > 0) {
                    setStatus("👤 ARTISTA JÁ EXISTE", "found");
                    fillGeo(artData[0]);
                } else { setStatus("✨ NOVO CADASTRO", "new"); }
            } catch(e) { setStatus("✨ NOVO (Erro ao checar artista)", "new"); }
        }
        await loadCountries();
        updateReview();
    }

    function updateReview() {
        if (!rawData.album) return;
        const citySel = document.getElementById('id_city');
        const cityName = citySel.options[citySel.selectedIndex]?.text || "Não selecionada";

        document.getElementById('review_artist').innerHTML = `
            <div class="data-row"><span>Nome:</span><b>${rawData.album.artist.name}</b></div>
            <div class="data-row"><span>Cidade:</span><b>${cityName}</b></div>
            <div class="data-row"><span>Idioma:</span><b>${document.getElementById('language').value}</b></div>
        `;
        document.getElementById('review_album').innerHTML = `
            <div class="data-row"><span>Título:</span><b>${rawData.album.title}</b></div>
            <div class="data-row"><span>Ano:</span><b>${rawData.album.release_date.split('-')[0]}</b></div>
        `;
        document.getElementById('review_tracks').innerHTML = rawData.tracks.map(t => `
            <div class="track-row">
                <span>${t.track_position}</span><span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${t.title}</span>
                <span>${Math.floor(t.duration/60)}:${(t.duration%60).toString().padStart(2,'0')}</span><span style="color:var(--accent); font-size:0.7rem">${t.id}</span>
            </div>
        `).join('');
    }

    async function loadCountries() {
        try {
            const res = await fetch(`${URL_SB}/rest/v1/tbl_countries?select=*&order=portuguese_name`, { headers: { apikey: KEY_SB } });
            globalCountries = await res.json();
            document.getElementById('countries_list').innerHTML = globalCountries.map(c => `<option value="${c.portuguese_name}">`).join('');
        } catch(e) {}
    }

    async function onCountrySelect(val) {
        const country = globalCountries.find(c => c.portuguese_name === val);
        if (!country) return;
        document.getElementById('id_country').value = country.id_country;
        const needsState = [25, 64].includes(country.id_country);
        if (needsState) await loadStates(country.id_country);
        else await loadCities(country.id_country, null);
    }

    async function loadStates(cid) {
        const res = await fetch(`${URL_SB}/rest/v1/tbl_states?id_country=eq.${cid}&order=name`, { headers: { apikey: KEY_SB } });
        const states = await res.json();
        document.getElementById('id_state').innerHTML = '<option value="">Estado...</option>' + states.map(s => `<option value="${s.id_state}">${s.name}</option>`).join('');
    }

    function onStateSelect() { loadCities(document.getElementById('id_country').value, document.getElementById('id_state').value); }

    async function loadCities(cid, sid) {
        let url = `${URL_SB}/rest/v1/tbl_cities?id_country=eq.${cid}&order=name`;
        if(sid) url += `&id_state=eq.${sid}`;
        const res = await fetch(url, { headers: { apikey: KEY_SB } });
        const cities = await res.json();
        document.getElementById('id_city').innerHTML = '<option value="">Cidade...</option>' + cities.map(c => `<option value="${c.id_city}">${c.name}</option>`).join('');
        updateReview();
    }

    function fillGeo(obj) {
        if (!obj) return;
        document.getElementById('language').value = obj.language || "portugues";
        document.getElementById('art_rating').value = obj.rating || "1";
    }

    async function pasteFromClipboard() {
        try { const text = await navigator.clipboard.readText(); document.getElementById('deezer_url').value = text; processUrl(text); } catch (e) {}
    }

    function saveToDatabase() { alert("Processo de gravação iniciado! Confira o console."); }
</script>
</body>
</html>
