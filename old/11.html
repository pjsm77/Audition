<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Life Tracker V10 - Swipe & Stats</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #121212; --card-bg: #1e1e1e; --text: #ffffff;
            --c1: #F87171; --c2: #FB923C; --c3: #FBBF24; --c4: #FACC15; --c5: #EAB308;
            --c6: #D9F99D; --c7: #BEF264; --c8: #84CC16; --c9: #4ADE80; --c10: #22C55E;
        }

        body { font-family: 'Segoe UI', system-ui; background: var(--bg); color: var(--text); margin: 0; padding: 10px; touch-action: pan-y; overflow-x: hidden; }
        .date-display { font-size: 1.1rem; font-weight: bold; color: #4a90e2; text-align: center; margin: 10px 0; text-transform: capitalize; }
        .chart-card { background: var(--card-bg); padding: 15px; border-radius: 15px; height: 240px; margin-bottom: 15px; }

        .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; }
        .toolbar select, .toolbar input { background: #2d2d2d; border: 1px solid #444; color: white; padding: 10px; border-radius: 8px; flex: 1; font-size: 0.85rem; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 12px; }

        .prog-btn {
            aspect-ratio: 1/1; border-radius: 18px; border: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; transition: all 0.2s; cursor: pointer; color: white; padding: 5px;
            overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        }

        .prog-icon-bg { position: absolute; font-size: 3.2rem; opacity: 0.12; z-index: 1; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .btn-content { z-index: 2; display: flex; flex-direction: column; align-items: center; width: 100%; height: 100%; position: relative; }

        .st-none { opacity: 0.45; filter: grayscale(0.3); }
        .st-active { opacity: 1; filter: none; }

        /* Labels V10 Full Data */
        .top-left { position: absolute; top: 4px; left: 6px; font-size: 0.7rem; font-weight: bold; }
        .top-right { position: absolute; top: 4px; right: 6px; font-size: 0.7rem; }
        .top-center { position: absolute; top: 12%; font-size: 0.55rem; font-weight: bold; background: rgba(0,0,0,0.3); padding: 1px 4px; border-radius: 3px; }
        
        .mid-left { position: absolute; top: 50%; left: 6px; transform: translateY(-50%); font-size: 0.6rem; font-weight: 800; background: rgba(0,0,0,0.25); padding: 2px; border-radius: 3px; }
        .mid-right { position: absolute; top: 50%; right: 6px; transform: translateY(-50%); font-size: 0.7rem; font-weight: 800; }
        
        .sigla { font-size: 1.15rem; font-weight: 950; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); margin-top: 2px; }
        .metas-label { font-size: 0.55rem; font-weight: bold; opacity: 0.9; margin-bottom: 2px; }
        
        .xp-label { position: absolute; bottom: 18%; font-size: 0.6rem; font-weight: 800; }
        .bottom-left { position: absolute; bottom: 4px; left: 6px; font-size: 0.6rem; font-weight: bold; }
        .bottom-right { position: absolute; bottom: 4px; right: 6px; font-size: 0.6rem; color: #ffd700; }

        /* Modal */
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 380px; background: #252525; border-radius: 20px; padding: 20px; z-index: 1000; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .close-x { background: none; border: none; color: #ff6b6b; font-size: 1.8rem; cursor: pointer; }
        .modal-input { width: 100%; background: #333; border: 2px solid #555; color: white; padding: 12px; border-radius: 10px; font-size: 1.5rem; text-align: center; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999; backdrop-filter: blur(4px); }
    </style>
</head>
<body id="swipeArea">

    <div id="dateDisplay" class="date-display"></div>
    <div class="chart-card"><canvas id="perfChart"></canvas></div>

    <div class="toolbar">
        <select id="sortFilter" onchange="renderGrid()">
            <option value="sigla">Sigla</option>
            <option value="prio">Prioridade</option>
            <option value="score">Melhor Score</option>
        </select>
        <select id="periodFilter" onchange="initDashboard()">
            <option value="7">7 Dias</option>
            <option value="30">30 Dias</option>
        </select>
    </div>

    <div class="grid" id="mainGrid"></div>

    <div class="overlay" id="overlay" onclick="closeModal()"></div>
    <div id="modal" class="modal">
        <div class="modal-header"><h3 id="mTitle" style="margin:0"></h3><button class="close-x" onclick="closeModal()">&times;</button></div>
        <input type="number" id="valInput" class="modal-input" placeholder="Novo XP">
        <div id="logList" style="margin-top:15px; max-height:120px; overflow-y:auto;"></div>
    </div>

<script>
    const COLORS = ["#F87171", "#FB923C", "#FBBF24", "#FACC15", "#EAB308", "#D9F99D", "#BEF264", "#84CC16", "#4ADE80", "#22C55E"];
    const CATS = { SAUDE: "#40c057", ESTUDOS: "#228be6", PROF: "#fab005", MENTAL: "#be4bdb", SOCIAL: "#fd7e14", FINAN: "#12b886" };

    let db = JSON.parse(localStorage.getItem('life_v10_db')) || { logs: [] };
    let activeDate = new Date().toISOString().split('T')[0];
    let chartInstance = null;
    let currentSigla = null;

    // Gestão de Swipe
    let touchStartX = 0;
    let touchEndX = 0;

    document.getElementById('swipeArea').addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
    document.getElementById('swipeArea').addEventListener('touchend', e => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
    });

    function handleSwipe() {
        const threshold = 80;
        let d = new Date(activeDate + "T12:00:00");
        if (touchEndX < touchStartX - threshold) { // Swipe Esquerda -> Avança
            d.setDate(d.getDate() + 1);
            activeDate = d.toISOString().split('T')[0];
            initDashboard();
        }
        if (touchEndX > touchStartX + threshold) { // Swipe Direita -> Volta
            d.setDate(d.getDate() - 1);
            activeDate = d.toISOString().split('T')[0];
            initDashboard();
        }
    }

    const programs = [
        { s: "LIS", n: "Listening", c: "ESTUDOS", mk: 5, md: 10, lvl: 3, strk: 5, prio: 1, freq: "D", icon: "fa-headphones" },
        { s: "GYM", n: "Gym", c: "SAUDE", mk: 1, md: 1, lvl: 5, strk: 7, prio: 1, freq: "U", icon: "fa-dumbbell" },
        { s: "COD", n: "Coding", c: "PROF", mk: 30, md: 60, lvl: 4, strk: 3, prio: 2, freq: "U", icon: "fa-code" },
        { s: "H2O", n: "Water", c: "SAUDE", mk: 4, md: 8, lvl: 2, strk: 12, prio: 1, freq: "D", icon: "fa-faucet-drip" },
        { s: "REA", n: "Reading", c: "MENTAL", mk: 10, md: 20, lvl: 1, strk: 4, prio: 2, freq: "D", icon: "fa-book-open" },
        { s: "MED", n: "Meditation", c: "MENTAL", mk: 5, md: 15, lvl: 3, strk: 6, prio: 3, freq: "F", icon: "fa-spa" },
        { s: "SLP", n: "Sleep", c: "SAUDE", mk: 7, md: 8, lvl: 3, strk: 30, prio: 1, freq: "D", icon: "fa-bed" }
    ];

    function getScore(sigla, days) {
        let totalPct = 0;
        for(let i=0; i<days; i++) {
            let d = new Date(); d.setDate(d.getDate() - i);
            let ds = d.toISOString().split('T')[0];
            let p = programs.find(x => x.s === sigla);
            totalPct += Math.min(1, getDayTotal(sigla, ds) / p.md);
        }
        return Math.round((totalPct / days) * 100);
    }

    function initDashboard() {
        const opt = { weekday: 'long', day: 'numeric', month: 'long' };
        document.getElementById('dateDisplay').innerText = new Date(activeDate + "T12:00:00").toLocaleDateString('pt-BR', opt);
        renderGrid();
        renderChart();
    }

    function renderGrid() {
        const grid = document.getElementById('mainGrid');
        const period = parseInt(document.getElementById('periodFilter').value);
        const sort = document.getElementById('sortFilter').value;

        let list = [...programs];
        if(sort === 'prio') list.sort((a,b) => a.prio - b.prio);
        if(sort === 'score') list.sort((a,b) => getScore(b.s, period) - getScore(a.s, period));

        grid.innerHTML = '';
        list.forEach(p => {
            const val = getDayTotal(p.s, activeDate);
            const score = getScore(p.s, period);
            const status = val >= p.mk ? "st-active" : "st-none";
            const badge = val >= p.md ? '⭐' : (val >= p.mk ? '✅' : '');

            grid.innerHTML += `
                <div class="prog-btn ${status}" style="background-color: ${CATS[p.c]}" onclick="openManageModal('${p.s}')">
                    <i class="fa-solid ${p.icon} prog-icon-bg"></i>
                    <div class="btn-content">
                        <span class="top-left">${val || ''}</span>
                        <span class="top-right">${badge}</span>
                        <span class="top-center">${score}%</span>
                        
                        <span class="mid-left">P${p.prio}</span>
                        <span class="sigla">${p.s}</span>
                        <span class="mid-right">${p.freq}</span>
                        
                        <span class="metas-label">${p.mk}/${p.md}</span>
                        <span class="xp-label">${getXP(p.s)} XP</span>
                        
                        <span class="bottom-left">L${p.lvl}</span>
                        <span class="bottom-right">${p.strk ? p.strk + '🔥' : ''}</span>
                    </div>
                </div>`;
        });
    }

    function renderChart() {
        const ctx = document.getElementById('perfChart').getContext('2d');
        const period = parseInt(document.getElementById('periodFilter').value);
        const labels = [], scores = [], barColors = [];

        for(let i = period - 1; i >= 0; i--) {
            let d = new Date(); d.setDate(d.getDate() - i);
            let ds = d.toISOString().split('T')[0];
            labels.push(ds.split('-')[2]);
            
            let dayPct = 0;
            programs.forEach(p => dayPct += Math.min(1, getDayTotal(p.s, ds) / p.md));
            let final = Math.round((dayPct / programs.length) * 100);
            scores.push(final);
            barColors.push(COLORS[Math.min(9, Math.floor(final/10))]);
        }

        const trend = scores.map((v, i, a) => i === 0 ? v : (a[i-1] + v) / 2);

        if(chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
            data: {
                labels: labels,
                datasets: [
                    { type: 'bar', data: scores, backgroundColor: barColors, borderRadius: 4 },
                    { type: 'line', data: trend, borderColor: '#fff', borderWidth: 2, pointRadius: 0, tension: 0.3 }
                ]
            },
            options: {
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { 
                    y: { display: false, max: 100 }, 
                    x: { grid: { display: false }, ticks: { color: '#888', font: { size: 10 }, maxRotation: 0 } } 
                }
            }
        });
    }

    function openManageModal(sigla) {
        currentSigla = sigla;
        const p = programs.find(x => x.s === sigla);
        document.getElementById('mTitle').innerText = p.n;
        updateLogs();
        document.querySelectorAll('#modal, #overlay').forEach(el => el.style.display = 'block');
        const input = document.getElementById('valInput');
        input.value = ''; setTimeout(() => input.focus(), 100);
        
        input.onkeypress = (e) => {
            if(e.key === 'Enter') {
                const v = parseFloat(input.value);
                if(!isNaN(v)) {
                    db.logs.push({ id: Date.now(), s: sigla, d: activeDate, v: v });
                    save(); closeModal();
                }
            }
        };
    }

    function updateLogs() {
        const list = document.getElementById('logList');
        const dayLogs = db.logs.filter(l => l.s === currentSigla && l.d === activeDate);
        list.innerHTML = dayLogs.length ? '<strong>Hoje:</strong>' : '';
        dayLogs.forEach(l => {
            list.innerHTML += `<div style="display:flex; justify-content:space-between; background:#333; padding:8px; border-radius:5px; margin-top:5px;">
                <span>${l.v} XP</span>
                <i class="fa-solid fa-trash" style="color:#ff6b6b" onclick="delLog(${l.id})"></i>
            </div>`;
        });
    }

    function delLog(id) { db.logs = db.logs.filter(l => l.id !== id); save(); updateLogs(); }
    function save() { localStorage.setItem('life_v10_db', JSON.stringify(db)); renderGrid(); renderChart(); }
    function closeModal() { document.querySelectorAll('#modal, #overlay').forEach(el => el.style.display = 'none'); }
    function getDayTotal(s, d) { return db.logs.filter(l => l.s === s && l.d === d).reduce((a, b) => a + b.v, 0); }
    function getXP(s) { return db.logs.filter(l => l.s === s).reduce((a, b) => a + b.v, 0); }

    initDashboard();
</script>
</body>
</html>
