<!-- SEÇÃO 6: PROCESSAMENTO E LÓGICA DE DADOS -->
async function fetchData() {
    const [resRanking, resFidelidade, resRecencia, resRecentRating] = await Promise.all([
        _supabase.rpc('get_artist_ranking_full', { search_term: '' }),
        _supabase.from('artista_fidelidade_score_v2').select('artist, score_numérico, rating_artista'),
        _supabase.from('artista_recencia_v2').select('artist, score, variation'),
        _supabase.from('tbl_artists_recent').select('artist_name, rating') // Nova busca
    ]);

    if (!resRanking.error) { 
        let base = (resRanking.data || []).map(item => {
            const f = resFidelidade.data?.find(x => x.artist === item.artist);
            const r = resRecencia.data?.find(x => x.artist === item.artist);
            // Busca o rating na nova tabela
            const recent = resRecentRating.data?.find(x => x.artist_name === item.artist);
            
            return { 
                ...item, 
                score_numérico: f ? f.score_numérico : 0.5,
                rating_artista: f ? f.rating_artista : 0,
                recencia_score: r ? r.score : 0,
                recencia_variation: r ? r.variation : 0,
                status_rating: recent ? recent.rating : null // Armazena o rating (-1, -2, -3 ou null)
            };
        });

        base.sort((a,b) => (b.scrobbles - a.scrobbles) || a.artist.localeCompare(b.artist));
        base.forEach((item, idx) => item.global_pos = idx + 1);

        fullRawData = base;
        applyLogic(); 
    }
}

function getGRColor(item) {
    if (item.status_rating === -1) return "#1DB954"; // Verde
    if (item.status_rating === -2) return "#ffc845"; // Amarelo
    if (item.status_rating === -3) return "#e97b78"; // Vermelho
    return "#777"; // Cor cinza atual padrão
}

function applyLogic() {
    const gs = document.getElementById('globalSearch').value.toLowerCase();
    filteredData = fullRawData.filter(item => {
        const nameMatch = item.artist.toLowerCase().includes(gs);
        const countryMatch = !currentFilter.type || (currentFilter.type === 'country' && item.country === currentFilter.value);
        const cityMatch = !currentFilter.type || (currentFilter.type === 'city' && item.city === currentFilter.value);
        
        // Filtros de Rating e Score Zero
        const ratingMatch = !filterRatingActive || (item.status_rating === -1);
        const zeroScoreMatch = !filterZeroScoreActive || (item.recencia_score === 0);

        return nameMatch && ratingMatch && zeroScoreMatch && (currentFilter.type ? (countryMatch || cityMatch) : true);
    });

    filteredData.sort((a, b) => {
        let valA = a[sortCol];
        let valB = b[sortCol];
        if (typeof valA === 'string') return sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
        valA = valA ?? -1; valB = valB ?? -1;
        if (valA === valB) return a.artist.localeCompare(b.artist);
        return sortAsc ? valA - valB : valB - valA;
    });
    renderTable();
}

    function generateFidelityBar(rating) {
        let bars = '';
        const finalScore = Math.min(Math.max(Math.round(rating), 0), 6);
        for (let i = 1; i <= 6; i++) {
            const activeClass = i <= finalScore ? `score-${finalScore}` : '';
            bars += `<div class="step ${activeClass}"></div>`;
        }
        return `<div class="progress-container">${bars}</div>`;
    }

function getScoreBgColor(score) {
    if (score >= 90) return '#6dbe99'; // Verde escuro
    if (score >= 80) return '#86d03a'; // Verde claro
    if (score >= 70) return '#b7d13e'; // Lima
    if (score >= 60) return '#e0d341'; // Amarelo
    if (score >= 50) return '#ffcc33'; // Ouro/Laranja claro
    if (score >= 40) return '#ffaa33'; // Laranja
    if (score >= 30) return '#ff8833'; // Laranja escuro
    if (score >= 20) return '#ff5f33'; // Coral/Tomate
    if (score >= 10) return '#ff4433'; // Vermelho claro
    if (score >= 1) return '#e97b78'; // Vermelho forte
    return '#aaaaaa'; // cinza
}

                justify-content: center; 
                border-radius: 1px; 
                line-height: 1;
            ">${item.recencia_score}</span>
            <!--<span style="font-size:10px; line-height: 1; color: ${recenciaColor}; font-weight: bold;">${variationText}</span>-->
            
            <span style="
    display: inline-block; 
    width: 3.5ch; 
    text-align: center; 
    font-family: monospace;
    font-size: 8px; 
    line-height: 1; 
    color: ${recenciaColor};
">
    ${variationText}
</span>

        <img class="flag-icon" 
             src="https://flagcdn.com/32x24/${flagCode}.png" 
             style="cursor:pointer" 
             onclick="toggleQuickFilter('country', '${item.country}')" 
             title="Filtrar por ${item.country}">
        <a style="color:${nameColor}; font-weight:bold; text-decoration:none;" href="https://www.last.fm/music/${encodeURIComponent(item.artist)}" target="_blank">${item.artist}</a>
        

        </span>
    </div></td>
    <td style="cursor:pointer" onclick="toggleQuickFilter('country', '${item.country}')">${item.country || '-'}</td>
    <td style="cursor:pointer" onclick="toggleQuickFilter('city', '${item.city}')">${item.city || '-'}</td>
    ${yearCells}<td>${item.primeiro_ano || '-'}</td>
</tr>`;
        }).join('');
        updatePaginationUI();
    }

    async function showDetails(artist, flag, total) {
    currentArtist = artist;
    document.getElementById('detail-overlay').style.display = 'block';
    document.getElementById('detail-artist-info').innerHTML = `
        <img class="flag-icon" style="width:32px; height:24px" src="https://flagcdn.com/32x24/${flag}.png">
        <span>${artist}</span> 
        <span style="color:var(--primary); margin-left:10px">${total.toLocaleString('pt-BR')}</span>`;
    
    // Busca na nova View 'scrobbles_unificados'
    // Filtramos pelo 'artist_clean' (que na view é a coluna 'artist')
    const [resSongs, resAlbums] = await Promise.all([
        _supabase.from('scrobbles_unificados')
            .select('ranking_no_artista_unico, ranking_geral_unico, total_scrobbles, dias_ultima_execucao, track_name')
            .eq('artist', artist.toLowerCase()), // artist na view está em lowercase
        _supabase.from('scrobbles_test') // Álbuns continuam da fonte original por enquanto
            .select('album')
            .eq('artist', artist)
    ]);

    // Processamento das Músicas vindo da View
    detailData.songs = (resSongs.data || []).map(item => ({
        rank_artist: item.ranking_no_artista_unico,
        rank_global: item.ranking_geral_unico,
        count: item.total_scrobbles,
        days: item.dias_ultima_execucao,
        title: item.track_name
    }));

    // Processamento dos Álbuns (mantido)
    const aCnt = {}; 
    (resAlbums.data || []).forEach(r => { 
        const a = r.album || '[Desconhecido]'; 
        aCnt[a] = (aCnt[a] || 0) + 1; 
    });
    detailData.albums = Object.entries(aCnt).map(([title, count]) => ({ title, count }));
    
    document.getElementById('tab-songs').innerText = `MÚSICAS (${detailData.songs.length})`;
    document.getElementById('tab-albums').innerText = `ÁLBUNS (${detailData.albums.length})`;
    
    detailSortAsc = false; 
    sortDetails('rank_artist'); // Ordena pelo ranking do artista por padrão
}

    function sortDetails(col) {
    detailSortAsc = !detailSortAsc;
    
    detailData[currentTab].sort((a, b) => {
        let valA = a[col];
        let valB = b[col];
        if (typeof valA === 'string') return detailSortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
        return detailSortAsc ? valA - valB : valB - valA;
    });

    const tbody = document.getElementById('detail-body');
    
    if (currentTab === 'songs') {
        tbody.innerHTML = detailData.songs.map(item => `
            <tr>
                <td style="color:var(--primary); font-weight:bold;">${item.rank_artist}</td>
                <td style="font-size:10px; color:#777;">${item.rank_global}</td>
                <td class="puan-col">${item.count}</td>
                <td style="font-size:10px;">${item.days}d</td>
                <td class="clickable-title" onclick="openDeezer('track', '${currentArtist.replace(/'/g, "\\'")} ${item.title.replace(/'/g, "\\")}')">
                    ${item.title}
                </td>
            </tr>`).join('');
    } else {
        // Lógica simplificada para álbuns (já que eles não estão na View unificada ainda)
        tbody.innerHTML = detailData.albums.map((item, i) => `
            <tr>
                <td>-</td>
                <td>-</td>
                <td class="puan-col">${item.count}</td>
                <td>-</td>
                <td class="clickable-title" onclick="openDeezer('album', '${currentArtist.replace(/'/g, "\\'")} ${item.title.replace(/'/g, "\\")}')">
                    ${item.title}
                </td>
            </tr>`).join('');
    }
}

    function openDeezer(type, query) {
        const callbackName = 'dz_' + Math.floor(Math.random() * 100000);
        window[callbackName] = (data) => {
            if (data.data && data.data.length > 0) { window.location.href = `deezer://www.deezer.com/${type}/${data.data[0].id}`; }
            else { window.open(`https://www.deezer.com/search/${encodeURIComponent(query)}`, '_blank'); }
            delete window[callbackName];
        };
        const s = document.createElement('script');
        s.src = `https://api.deezer.com/search/${type}?q=${encodeURIComponent(query)}&output=jsonp&callback=${callbackName}`;
        document.body.appendChild(s);
    }

    function toggleSearch() {
        const el = document.getElementById('search-overlay');
        el.style.display = (el.style.display === 'block') ? 'none' : 'block';
        if(el.style.display === 'block') document.getElementById('globalSearch').focus();
    }

    function toggleQuickFilter(type, value) {
        if (!value || value === '-') return;
        currentFilter = (currentFilter.type === type && currentFilter.value === value) ? { type: null, value: null } : { type, value };
        offset = 0; applyLogic();
    }

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`tab-${tab}`).classList.add('active');
        detailSortAsc = true; sortDetails('count');
    }

    function closeDetails() { document.getElementById('detail-overlay').style.display = 'none'; }
    
    function updatePaginationUI() {
        const totalPages = Math.ceil(filteredData.length / limit) || 1;
        document.getElementById('selectPage').innerHTML = Array.from({length: totalPages}, (_, i) => `<option value="${i+1}" ${i+1 === Math.floor(offset/limit)+1 ? 'selected' : ''}>PÁG ${i+1}</option>`).join('');
    }
    
    function setSort(col) { 
        if (sortCol === col) sortAsc = !sortAsc; 
        else { sortCol = col; sortAsc = (col === 'artist'); } 
        offset = 0; applyLogic(); 
    }
    
    function goToPage(p) { offset = (p - 1) * limit; renderTable(); }
    //function clearFilters() { document.getElementById('globalSearch').value = ''; currentFilter = { type: null }; document.getElementById('search-overlay').style.display = 'none'; fetchData(); }

function toggleZeroScoreFilter() {
    filterZeroScoreActive = !filterZeroScoreActive;
    
    const zeroIcon = document.getElementById('zero-score-filter');
    // Quando ativo, fica vermelho; quando inativo, volta ao cinza[cite: 1]
    zeroIcon.style.backgroundColor = filterZeroScoreActive ? "#e97b78" : "#ccc";
    
    offset = 0; 
    applyLogic();
}    

function clearFilters() { 
    document.getElementById('globalSearch').value = ''; 
    currentFilter = { type: null }; 
    
    // Reset dos filtros especiais
    filterRatingActive = false; 
    filterZeroScoreActive = false; 
    
    // Reset visual dos ícones
    document.getElementById('star-filter').style.color = "#ccc"; 
    document.getElementById('zero-score-filter').style.backgroundColor = "#ccc"; 
    
    document.getElementById('search-overlay').style.display = 'none'; 
    fetchData(); 
}


// Adicione esta função ao script
function toggleRatingFilter() {
    filterRatingActive = !filterRatingActive;
    
    // Atualiza a cor visual da estrela no cabeçalho
    const starIcon = document.getElementById('star-filter');
    starIcon.style.color = filterRatingActive ? "#1DB954" : "#ccc";
    
    offset = 0; // Reseta para a página 1
    applyLogic();
}

    document.getElementById('globalSearch').oninput = () => { offset = 0; applyLogic(); };
    document.getElementById('nextBtn').onclick = () => { if (offset + limit < filteredData.length) { offset += limit; renderTable(); } };
    document.getElementById('prevBtn').onclick = () => { if (offset > 0) { offset -= limit; renderTable(); } };

    fetchData();


    async function checkAuthAndOpenRating(artistName) {
    // Sistema simples de autorização por senha para abrir o modal
    const access = sessionStorage.getItem('admin_access');
    if (!access) {
        const pass = prompt("Acesso restrito. Digite a senha:");
        if (pass !== "9000") return; // Defina sua senha aqui
        sessionStorage.setItem('admin_access', 'true');
    }

    // Verificar se já existe rating
    const { data, error } = await _supabase
        .from('tbl_artists_recent')
        .select('id')
        .eq('artist_name', artistName)
        .maybeSingle();

    if (data) {
        alert("Este artista já possui um rating registrado.");
        return;
    }

    document.getElementById('rating-artist-name').innerText = artistName.toUpperCase();
    document.getElementById('modal-rating').style.display = 'flex';
    window.currentRatingArtist = artistName;
}

async function submitRating(ratingValue) {
    const btn = event.target;
    btn.style.pointerEvents = 'none';

    const { error } = await _supabase
        .from('tbl_artists_recent')
        .insert([{ 
            artist_name: window.currentRatingArtist, 
            rating: ratingValue 
        }]);

    if (error) {
        alert("Erro ao inserir: " + error.message);
    } else {
        alert("Rating registrado com sucesso!");
        closeRatingModal();
    }
}

function closeRatingModal() {
    document.getElementById('modal-rating').style.display = 'none';
}
</script>



<!-- Modal de Registro de Rating -->
<div id="modal-rating">
    <div class="modal-content">
        <h2 id="rating-artist-name" style="font-family: 'Bebas Neue'; margin: 0;">NOME DO ARTISTA</h2>
        <p style="font-size: 12px; color: #666;">Avalie para a coleção:</p>
        <div class="star-rating">
            <span class="star" onclick="submitRating(-3)" title="Não incluir">★</span>
            <span class="star" onclick="submitRating(-2)" title="Ouvir mais">★</span>
            <span class="star" onclick="submitRating(-1)" title="Incluir na Coleção">★</span>
        </div>
        <button class="btn-cancel" onclick="closeRatingModal()">CANCELAR</button>
    </div>
</div>
