<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Tracker V2 - Gamified</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-body: #f4f7f6;
            /* Cores das Categorias */
            --cat-saude: #2ecc71;      /* Verde */
            --cat-estudos: #3498db;    /* Azul */
            --cat-profissional: #f1c40f;/* Amarelo */
            --cat-financeiro: #27ae60;  /* Verde Escuro */
            --cat-social: #e67e22;      /* Laranja */
            --cat-mental: #9b59b6;      /* Roxo */
            --cat-familiar: #e74c3c;    /* Vermelho */
            --cat-espiritual: #1abc9c;  /* Turquesa */
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg-body); padding: 20px; color: #2c3e50; }

        /* Dashboard Header */
        .header { display: flex; flex-direction: column; gap: 20px; margin-bottom: 30px; }
        
        .chart-card { 
            background: white; padding: 20px; border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); height: 300px;
        }

        /* Toolbar e Filtros */
        .toolbar { 
            background: white; padding: 15px; border-radius: 10px;
            display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        select, input { padding: 8px; border-radius: 5px; border: 1px solid #ddd; outline: none; }

        /* Grid de Programas */
        .grid-programs {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 15px; margin-top: 20px;
        }

        .program-btn {
            aspect-ratio: 1/1;
            border-radius: 15px;
            border: 3px solid rgba(0,0,0,0.1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            background: white;
        }

        .program-btn:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        
        /* Indicadores de Status dentro do botão */
        .status-badge {
            position: absolute; top: 5px; right: 5px; width: 12px; height: 12px;
            border-radius: 50%; border: 2px solid white;
        }
        .st-none { background: #dcdde1; }
        .st-check { background: #f1c40f; box-shadow: 0 0 8px #f1c40f; }
        .st-done { background: #2ecc71; box-shadow: 0 0 8px #2ecc71; }

        .sigla { font-weight: 800; font-size: 1.1rem; color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
        .progress-text { font-size: 0.75rem; font-weight: 600; margin-top: 5px; color: rgba(255,255,255,0.9); }

        /* Modal */
        #modal {
            display: none; position: fixed; top: 50%; left: 50%; 
            transform: translate(-50%, -50%); background: white; 
            padding: 30px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            z-index: 1000; width: 90%; max-width: 400px;
        }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 999; }
        .btn-save { background: #2ecc71; color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; margin-top: 15px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <div class="chart-card">
            <canvas id="scoreChart"></canvas>
        </div>

        <div class="toolbar">
            <strong>Filtros:</strong>
            <select id="sortOrder" onchange="renderGrid()">
                <option value="nome">Ordenar por Nome</option>
                <option value="sigla">Ordenar por Sigla</option>
                <option value="categoria">Ordenar por Categoria</option>
                <option value="prioridade">Ordenar por Prioridade</option>
                <option value="status">Ordenar por Status</option>
            </select>
            <input type="text" id="searchInput" placeholder="Pesquisar sigla..." onkeyup="renderGrid()">
        </div>
    </div>

    <div class="grid-programs" id="programGrid"></div>

    <div class="overlay" id="overlay" onclick="closeModal()"></div>
    <div id="modal">
        <h2 id="mTitle">Nome</h2>
        <p id="mDesc" style="font-size: 0.9rem; color: #666;"></p>
        <div id="mInputs"></div>
        <button class="btn-save" onclick="save()">Salvar Progresso</button>
    </div>

    <script>
        // Definição das Categorias e Cores
        const cats = {
            SAUDE: { nome: "Saúde", cor: "#2ecc71" },
            ESTUDOS: { nome: "Estudos", cor: "#3498db" },
            PROF: { nome: "Profissional", cor: "#f1c40f" },
            FINAN: { nome: "Financeiro", cor: "#27ae60" },
            SOCIAL: { nome: "Social", cor: "#e67e22" },
            MENTAL: { nome: "Mental", cor: "#9b59b6" },
            FAMIL: { nome: "Familiar", cor: "#e74c3c" },
            ESPIR: { nome: "Espiritual", cor: "#1abc9c" }
        };

        // Lista de 50 Programas Sugeridos
        let programs = [
            { s: "LIS", n: "Listening", c: "ESTUDOS", p: 1, u: "min", mK: 15, mD: 60, a: 0 },
            { s: "GYM", n: "Musculação", c: "SAUDE", p: 1, u: "un", mK: 1, mD: 1, a: 0 },
            { s: "HYD", n: "Hidratação", c: "SAUDE", p: 1, u: "copos", mK: 4, mD: 10, a: 0 },
            { s: "COD", n: "Coding", c: "PROF", p: 2, u: "min", mK: 30, mD: 120, a: 0 },
            { s: "REA", n: "Leitura", c: "MENTAL", p: 2, u: "pag", mK: 10, mD: 30, a: 0 },
            { s: "MED", n: "Meditação", c: "MENTAL", p: 3, u: "min", mK: 5, mD: 20, a: 0 },
            { s: "STP", n: "Passos", c: "SAUDE", p: 2, u: "passos", mK: 5000, mD: 10000, a: 0 },
            { s: "FIN", n: "Gastos", c: "FINAN", p: 1, u: "un", mK: 1, mD: 1, a: 0 },
            { s: "CAL", n: "Ligar Família", c: "FAMIL", p: 3, u: "un", mK: 1, mD: 1, a: 0 },
            { s: "ENG", n: "Inglês", c: "ESTUDOS", p: 1, u: "min", mK: 20, mD: 45, a: 0 },
            { s: "RUN", n: "Corrida", c: "SAUDE", p: 2, u: "km", mK: 3, mD: 5, a: 0 },
            { s: "SLP", n: "Sono", c: "SAUDE", p: 1, u: "horas", mK: 7, mD: 8, a: 0 },
            { s: "YOG", n: "Yoga", c: "SAUDE", p: 3, u: "min", mK: 15, mD: 30, a: 0 },
            { s: "WRI", n: "Escrita", c: "MENTAL", p: 2, u: "palav", mK: 200, mD: 500, a: 0 },
            { s: "MAT", n: "Matemática", c: "ESTUDOS", p: 2, u: "exer", mK: 5, mD: 15, a: 0 },
            { s: "NET", n: "Networking", c: "PROF", p: 3, u: "un", mK: 1, mD: 3, a: 0 },
            { s: "SAV", n: "Economia", c: "FINAN", p: 2, u: "brl", mK: 10, mD: 50, a: 0 },
            { s: "SOC", n: "Social Offline", c: "SOCIAL", p: 2, u: "horas", mK: 1, mD: 3, a: 0 },
            { s: "PRA", n: "Oração", c: "ESPIR", p: 3, u: "min", mK: 5, mD: 15, a: 0 },
            { s: "VOK", n: "Vocabulário", c: "ESTUDOS", p: 2, u: "cards", mK: 10, mD: 30, a: 0 }
            // ... (Preenchimento automático para os outros 30 para teste)
        ];
        // Gerador de mock para chegar em 50
        const catKeys = Object.keys(cats);
        for(let i=programs.length; i<50; i++) {
            let ck = catKeys[i % catKeys.length];
            programs.push({ s: "P"+i, n: "Tarefa "+i, c: ck, p: (i%3)+1, u: "un", mK: 5, mD: 10, a: 0 });
        }

        let currentIdx = null;

        function renderGrid() {
            const grid = document.getElementById('programGrid');
            const sort = document.getElementById('sortOrder').value;
            const search = document.getElementById('searchInput').value.toUpperCase();

            let filtered = programs.filter(p => p.s.includes(search));

            filtered.sort((a, b) => {
                if(sort === 'nome') return a.n.localeCompare(b.n);
                if(sort === 'sigla') return a.s.localeCompare(b.s);
                if(sort === 'categoria') return a.c.localeCompare(b.c);
                if(sort === 'prioridade') return a.p - b.p;
                if(sort === 'status') {
                    let stA = a.a >= a.mD ? 2 : (a.a >= a.mK ? 1 : 0);
                    let stB = b.a >= b.mD ? 2 : (b.a >= b.mK ? 1 : 0);
                    return stB - stA;
                }
            });

            grid.innerHTML = '';
            filtered.forEach(p => {
                let statusClass = p.a >= p.mD ? "st-done" : (p.a >= p.mK ? "st-check" : "st-none");
                const btn = document.createElement('div');
                btn.className = 'program-btn';
                btn.style.backgroundColor = cats[p.c].cor;
                btn.onclick = () => openModal(programs.indexOf(p));
                btn.innerHTML = `
                    <div class="status-badge ${statusClass}"></div>
                    <div class="sigla">${p.s}</div>
                    <div class="progress-text">${p.a}/${p.mD} ${p.u}</div>
                `;
                grid.appendChild(btn);
            });
        }

        function openModal(idx) {
            currentIdx = idx;
            const p = programs[idx];
            document.getElementById('mTitle').innerText = p.n;
            document.getElementById('mDesc').innerText = `Prioridade: ${p.p} | Unidade: ${p.u}`;
            
            let inputs = p.u === 'min' || p.u === 'horas' 
                ? `<label>Início</label><input type="time" id="tS"><label>Fim</label><input type="time" id="tE">`
                : `<label>Quantidade</label><input type="number" id="tQ" placeholder="0">`;
            
            document.getElementById('mInputs').innerHTML = inputs;
            document.getElementById('modal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }

        function save() {
            const p = programs[currentIdx];
            if(p.u === 'min' || p.u === 'horas') {
                const s = document.getElementById('tS').value;
                const e = document.getElementById('tE').value;
                if(s && e) {
                    const d = (new Date(`1970-01-01T${e}`)) - (new Date(`1970-01-01T${s}`));
                    p.a += Math.max(0, d/60000);
                }
            } else {
                p.a += parseInt(document.getElementById('tQ').value) || 0;
            }
            closeModal();
            renderGrid();
            updateChart();
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }

        // --- Lógica do Gráfico de Gradiente (10 níveis) ---
        const getScoreColor = (score) => {
            const r = score < 50 ? 255 : Math.floor(255 - (score - 50) * 5.1);
            const g = score > 50 ? 255 : Math.floor(score * 5.1);
            return `rgb(${r}, ${g}, 0)`;
        };

        const ctx = document.getElementById('scoreChart').getContext('2d');
        let dailyScores = [20, 45, 10, 80, 55, 90, 30]; // Mock de histórico

        let chart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'],
                datasets: [{
                    label: '% Performance Geral',
                    data: dailyScores,
                    backgroundColor: dailyScores.map(s => getScoreColor(s)),
                    borderRadius: 8
                }]
            },
            options: {
                maintainAspectRatio: false,
                scales: { y: { beginAtZero: true, max: 100 } },
                plugins: { legend: { display: false } }
            }
        });

        function updateChart() {
            // Calcula média de progresso dos programas para o dia
            const totalProgress = programs.reduce((acc, p) => acc + Math.min(100, (p.a / p.mD) * 100), 0) / 50;
            dailyScores[6] = totalProgress; 
            chart.data.datasets[0].backgroundColor = dailyScores.map(s => getScoreColor(s));
            chart.update();
        }

        renderGrid();
    </script>
</body>
</html>
