<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Music - Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #1DB954; --bg: #121212; --surface: #1e1e1e; --text: #e0e0e0; --link: #1DB954; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 10px; }
        .container { max-width: 1200px; margin: auto; }
        
        /* Controles */
        .controls-wrapper { background: var(--surface); padding: 15px; border-radius: 8px 8px 0 0; border-bottom: 1px solid #333; }
        .search-row { display: flex; gap: 10px; }
        #globalSearch { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #2a2a2a; color: white; font-size: 16px; }
        .btn-clear { background: #444; border: none; color: white; padding: 0 15px; border-radius: 5px; cursor: pointer; }

        /* Tabela Inteligente */
        .table-wrapper { background: var(--surface); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 320px; }
        
        /* Cabeçalho com Filtros e Sort */
        th { background: #282828; padding: 10px 5px; border-bottom: 2px solid var(--primary); vertical-align: top; }
        .header-cell { display: flex; flex-direction: column; gap: 5px; min-width: 80px; }
        .sort-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: bold; text-transform: uppercase; color: #888; }
        .sort-btns { display: flex; gap: 2px; }
        .sort-btns button { background: #333; border: none; color: white; cursor: pointer; font-size: 8px; padding: 2px 4px; border-radius: 2px; }
        .col-filter { padding: 4px; font-size: 10px; border-radius: 3px; border: 1px solid #444; background: #121212; color: white; width: 100%; box-sizing: border-box; }

        /* Lógica de Visibilidade Responsiva */
        @media (max-width: 600px) and (orientation: portrait) {
            .col-country, .col-city, .col-start, .col-days { display: none; }
            th { padding: 10px 2px; }
        }

        @media (max-width: 900px) and (orientation: landscape) {
            .col-city { display: none; }
        }

        /* Estilos de conteúdo */
        td { padding: 12px 5px; border-bottom: 1px solid #333; font-size: 14px; white-space: nowrap; }
        .rank-badge { color: var(--primary); font-weight: bold; }
        .long-time { color: #ff5555; font-weight: bold; }
        .clickable { cursor: pointer; }
        .clickable:hover { color: var(--primary); text-decoration: underline; }

        /* Paginação */
        .pagination { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; padding: 15px; background: #282828; border-radius: 0 0 8px 8px; }
        .btn-pag { background: var(--primary); border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        #selectPage { background: #121212; color: white; border: 1px solid #444; padding: 5px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div class="controls-wrapper">
        <div class="search-row">
            <input type="text" id="globalSearch" placeholder="🔍 Pesquisa global...">
            <button class="btn-clear" onclick="clearFilters()">Limpar</button>
        </div>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th class="col-rank" style="width: 40px;">#</th>
                    <th class="col-artist">
                        <div class="header-cell">
                            <div class="sort-row"> Artista <div class="sort-btns">
                                <button onclick="setSort('artist', true)">▲</button>
                                <button onclick="setSort('artist', false)">▼</button>
                            </div></div>
                            <input type="text" id="f-art" class="col-filter" placeholder="Filtrar..." oninput="updateColFilter('artist', this.value)">
                        </div>
                    </th>
                    <th class="col-country">
                        <div class="header-cell">
                            <div class="sort-row"> País <div class="sort-btns">
                                <button onclick="setSort('country', true)">▲</button>
                                <button onclick="setSort('country', false)">▼</button>
                            </div></div>
                            <input type="text" id="f-country" class="col-filter" placeholder="Filtrar..." oninput="updateColFilter('country', this.value)">
                        </div>
                    </th>
                    <th class="col-city">
                        <div class="header-cell">
                            <div class="sort-row"> Cidade <div class="sort-btns">
                                <button onclick="setSort('city', true)">▲</button>
                                <button onclick="setSort('city', false)">▼</button>
                            </div></div>
                        </div>
                    </th>
                    <th class="col-start">
                        <div class="header-cell">
                            <div class="sort-row"> Início <div class="sort-btns">
                                <button onclick="setSort('primeiro_ano', true)">▲</button>
                                <button onclick="setSort('primeiro_ano', false)">▼</button>
                            </div></div>
                        </div>
                    </th>
                    <th class="col-days">
                        <div class="header-cell">
                            <div class="sort-row"> Dias <div class="sort-btns">
                                <button onclick="setSort('dias_ultimo', true)">▲</button>
                                <button onclick="setSort('dias_ultimo', false)">▼</button>
                            </div></div>
                        </div>
                    </th>
                    <th class="col-scrobbles">
                        <div class="header-cell">
                            <div class="sort-row"> Scrobbles <div class="sort-btns">
                                <button onclick="setSort('scrobbles', true)">▲</button>
                                <button onclick="setSort('scrobbles', false)">▼</button>
                            </div></div>
                        </div>
                    </th>
                </tr>
            </thead>
            <tbody id="ranking-body"></tbody>
        </table>
    </div>

    <div class="pagination">
        <button class="btn-pag" id="prevBtn">«</button>
        <div style="display:flex; align-items:center; gap:5px;">
            <span>Pág:</span>
            <select id="selectPage" onchange="goToPage(this.value)"></select>
            <span id="totalPagesLabel"></span>
        </div>
        <button class="btn-pag" id="nextBtn">»</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://qdawxpcwkadhfwqhnpsd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_W6LnlxFB_jpBKDN2cn5oKQ_j_g1OZO2';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let fullData = [], filteredData = [], offset = 0;
    const limit = 50;
    let colFilters = { artist: '', country: '', city: '' };
    let sortCol = 'scrobbles', sortAsc = false;

    function getFlagEmoji(c) {
        const flags = {'Brasil': '🇧🇷', 'Portugal': '🇵🇹', 'USA': '🇺🇸', 'Germany': '🇩🇪', 'France': '🇫🇷', 'Japan': '🇯🇵', 'UK': '🇬🇧'};
        return flags[c] || (c ? '🏳️' : '');
    }

    async function fetchData() {
        const gs = document.getElementById('globalSearch').value;
        const { data, error } = await _supabase.rpc('get_artist_ranking_v3', { search_term: gs });
        if (error) return;
        fullData = data;
        applyFiltersAndSort();
    }

    function applyFiltersAndSort() {
        // 1. Filtrar
        filteredData = fullData.filter(item => 
            (item.artist || '').toLowerCase().includes(colFilters.artist.toLowerCase()) &&
            (item.country || '').toLowerCase().includes(colFilters.country.toLowerCase())
        );

        // 2. Ordenar
        filteredData.sort((a, b) => {
            let vA = a[sortCol] || 0, vB = b[sortCol] || 0;
            if (typeof vA === 'string') return sortAsc ? vA.localeCompare(vB) : vB.localeCompare(vA);
            return sortAsc ? vA - vB : vB - vA;
        });

        updatePaginationUI();
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('ranking-body');
        const paged = filteredData.slice(offset, offset + limit);
        
        tbody.innerHTML = paged.map((item, index) => `
            <tr>
                <td class="col-rank"><span class="rank-badge">${offset + index + 1}</span></td>
                <td class="col-artist"><strong><a href="https://www.last.fm/music/${encodeURIComponent(item.artist)}" target="_blank">${item.artist}</a></strong></td>
                <td class="col-country clickable" onclick="quickFilter('country', '${item.country}')">${getFlagEmoji(item.country)} ${item.country || '-'}</td>
                <td class="col-city clickable" onclick="quickFilter('city', '${item.city}')">${item.city || '-'}</td>
                <td class="col-start">${item.primeiro_ano}</td>
                <td class="col-days ${item.dias_ultimo > 365 ? 'long-time' : ''}">${item.dias_ultimo === 0 ? 'Hoje' : item.dias_ultimo}</td>
                <td class="col-scrobbles" style="text-align:right"><strong>${item.scrobbles.toLocaleString('pt-BR')}</strong></td>
            </tr>
        `).join('');
    }

    function updatePaginationUI() {
        const totalPages = Math.ceil(filteredData.length / limit) || 1;
        const select = document.getElementById('selectPage');
        const currentPage = (offset / limit) + 1;
        
        let options = '';
        for (let i = 1; i <= totalPages; i++) {
            options += `<option value="${i}" ${i === currentPage ? 'selected' : ''}>${i}</option>`;
        }
        select.innerHTML = options;
        document.getElementById('totalPagesLabel').innerText = `de ${totalPages}`;
        document.getElementById('prevBtn').disabled = offset === 0;
        document.getElementById('nextBtn').disabled = (offset + limit) >= filteredData.length;
    }

    function setSort(col, asc) { sortCol = col; sortAsc = asc; applyFiltersAndSort(); }
    function goToPage(p) { offset = (p - 1) * limit; renderTable(); }
    function updateColFilter(col, val) { colFilters[col] = val; offset = 0; applyFiltersAndSort(); }
    function quickFilter(col, val) { if(!val || val === '-') return; colFilters[col] = val; document.getElementById('f-'+col).value = val; offset = 0; applyFiltersAndSort(); }
    
    function clearFilters() { 
        colFilters = { artist: '', country: '', city: '' }; 
        document.getElementById('globalSearch').value = '';
        document.querySelectorAll('.col-filter').forEach(i => i.value = '');
        offset = 0; fetchData(); 
    }

    document.getElementById('globalSearch').oninput = () => { offset = 0; fetchData(); };
    document.getElementById('nextBtn').onclick = () => { offset += limit; updatePaginationUI(); renderTable(); };
    document.getElementById('prevBtn').onclick = () => { offset -= limit; updatePaginationUI(); renderTable(); };

    fetchData();
</script>
</body>
</html>
