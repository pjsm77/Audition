<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Processador de IDs Apple Music</title>
    <style>
        body { font-family: sans-serif; padding: 30px; background: #121212; color: white; text-align: center; }
        textarea { width: 90%; height: 200px; background: #222; color: #0f0; border: 1px solid #444; padding: 10px; border-radius: 8px; }
        button { background: #00d2ff; color: #000; border: none; padding: 15px 40px; cursor: pointer; border-radius: 30px; font-weight: bold; margin: 20px; }
        #progress-container { width: 90%; background: #333; height: 20px; border-radius: 10px; margin: 20px auto; overflow: hidden; display: none; }
        #progress-bar { width: 0%; height: 100%; background: #00d2ff; transition: width 0.1s; }
        #log { margin: 0 auto; width: 90%; text-align: left; font-family: monospace; font-size: 12px; height: 150px; overflow-y: scroll; background: #000; padding: 10px; border: 1px solid #333; }
    </style>
</head>
<body>
    <h2>?? Processador de Banco de Dados</h2>
    <p>Cole seu CSV abaixo no formato: <strong>Artista;Álbum;ID</strong></p>
    
    <textarea id="entrada" placeholder="Joe Satriani;Black Swans and Wormhole Wizards;392411037"></textarea>
    <br>
    <button onclick="processarPorID()">Gerar JSON Otimizado</button>

    <div id="progress-container"><div id="progress-bar"></div></div>
    <div id="log">Aguardando...</div>

    <script>
        async function processarPorID() {
            const texto = document.getElementById('entrada').value;
            const linhas = texto.split('\n').filter(l => l.includes(';'));
            const log = document.getElementById('log');
            const bar = document.getElementById('progress-bar');
            document.getElementById('progress-container').style.display = 'block';
            
            const resultados = [];
            let processados = 0;

            for (let linha of linhas) {
                const partes = linha.split(';');
                if (partes.length < 3) continue;
                
                const idApple = partes[2].trim();
                
                try {
                    // Busca direta pelo ID (Lookup) - Mais rápido e preciso que Search
                    const response = await fetch(`https://itunes.apple.com/lookup?id=${idApple}`);
                    const data = await response.json();

                    if (data.results && data.results.length > 0) {
                        const res = data.results[0];
                        
                        // Extraímos apenas o radical da imagem (removendo 100x100bb.jpg)
                        const urlRadical = res.artworkUrl100.replace('100x100bb.jpg', '');

                        resultados.push({
                            id: idApple,
                            a: res.artistName,
                            t: res.collectionName,
                            u: urlRadical, // Guardamos apenas o início da URL
                            p: res.country,
                            d: Math.floor(res.trackTimeMillis / 60000),
                            l: res.collectionViewUrl
                        });
                        log.innerHTML += `<span style="color: #0f0">? OK: ${res.collectionName}</span><br>`;
                    } else {
                        log.innerHTML += `<span style="color: #f00">? ID não encontrado: ${idApple}</span><br>`;
                    }
                } catch (err) {
                    log.innerHTML += `<span style="color: #ff0">?? Erro de rede no ID: ${idApple}</span><br>`;
                }

                processados++;
                bar.style.width = (processados / linhas.length * 100) + "%";
                log.scrollTop = log.scrollHeight;
                
                // Intervalo mínimo para não ser bloqueado (Apple é generosa no lookup)
                if (processados % 5 === 0) await new Promise(r => setTimeout(r, 100));
            }

            // Criar arquivo para download
            const blob = new Blob([JSON.stringify(resultados)], {type : 'application/json'});
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'meus_albuns.json';
            a.click();
            
            log.innerHTML += "<br><strong>?? FINALIZADO! Arquivo 'meus_albuns.json' gerado.</strong>";
        }
    </script>
</body>
</html>
