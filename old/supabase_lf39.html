<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Histórico Pro - Mobile Fit</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --primary: #1DB954; 
            --bg: #ffffff; 
            --row-even: #f8f8f8;
            --text: #222;
            --header-bg: #f1f1f1;
            --border: #e0e0e0;
        }

        body { font-family: 'Bebas Neue', cursive; background-color: var(--bg); color: var(--text); margin: 0; padding: 5px; letter-spacing: 0.2px; }

        .controls { padding: 8px 0; display: flex; gap: 8px; position: sticky; top: 0; background: white; z-index: 1000; }
        #globalSearch { flex: 1; padding: 8px 15px; border-radius: 20px; border: 1px solid #ccc; background: #f9f9f9; font-family: sans-serif; font-size: 14px; outline: none; }
        .btn-clear { background: #eee; border: none; padding: 0 15px; border-radius: 20px; cursor: pointer; font-family: 'Bebas Neue'; font-size: 14px; }

        .table-wrapper { width: 100%; max-height: 82vh; overflow: auto; border: 1px solid var(--border); position: relative; background: white; }
        table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12px; min-width: 1300px; }
        th { background: var(--header-bg); position: sticky; top: 0; z-index: 900; padding: 8px 4px; border-bottom: 2px solid #ddd; text-align: left; }
        
        /* Colunas Fixas */
        th:nth-child(1), td:nth-child(1) { position: sticky; left: 0; z-index: 400; width: 32px; background: white; border-right: 1px solid #ddd; }
        th:nth-child(2), td:nth-child(2) { position: sticky; left: 33px; z-index: 400; min-width: 100px; background: white; border-right: 1px solid #ddd; }
        th:nth-child(3), td:nth-child(3) { position: sticky; left: 144px; z-index: 400; width: 60px; background: #fff; border-right: 2px solid #ccc; cursor: pointer; }

        td { padding: 4px 5px; border-bottom: 1px solid var(--border); white-space: nowrap; text-align: left; }
        tbody tr:nth-child(even) td { background-color: var(--row-even); }

        /* Estilo Detalhes (Modal) */
        #detail-overlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: white; z-index: 3000; padding: 10px; box-sizing: border-box; overflow-y: auto;
        }
        .detail-header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; border-bottom: 2px solid var(--primary); padding-bottom: 10px; }
        .tab-container { display: flex; gap: 10px; margin-bottom: 10px; }
        .tab-btn { background: #eee; border: none; padding: 8px 15px; font-family: 'Bebas Neue'; cursor: pointer; flex: 1; }
        .tab-btn.active { background: var(--primary); color: white; }
        .stats-summary { font-family: sans-serif; font-size: 11px; color: #666; margin-bottom: 10px; }

        .detail-table { width: 100%; min-width: unset; font-size: 14px; }
        .detail-table th { position: sticky; top: 0; background: #eee; }

        .artist-box { display: flex; align-items: center; gap: 4px; }
        .flag-icon { width: 14px; height: 10px; border: 0.5px solid #bbb; }
        .puan-col { font-weight: bold; }
        .year-val { text-align: left; font-family: sans-serif; font-size: 10px; color: #888; width: 30px; }
        .year-val.active { color: #000; font-weight: bold; }
        
        .pagination { display: flex; justify-content: center; gap: 8px; padding: 15px; align-items: center; }
        .btn-pag { background: white; border: 1px solid #ccc; padding: 3px 10px; border-radius: 4px; font-family: 'Bebas Neue'; font-size: 16px; }
    </style>
</head>
<body>

<div class="container" id="main-view">
    <div class="controls">
        <input type="text" id="globalSearch" placeholder="BUSCAR ARTISTA...">
        <button class="btn-clear" onclick="clearFilters()">LIMPAR</button>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr id="table-header">
                    <th onclick="setSort('scrobbles')">#</th>
                    <th onclick="setSort('artist')">ARTISTA</th>
                    <th onclick="setSort('scrobbles')">TOTAL</th>
                    <th onclick="setSort('dias_ultimo')">DIAS</th>
                    <th onclick="setSort('country')">PAÍS</th>
                    <th onclick="setSort('city')">CIDADE</th>
                    <th onclick="setSort('primeiro_ano')">INÍCIO</th>
                </tr>
            </thead>
            <tbody id="ranking-body"></tbody>
        </table>
    </div>

    <div class="pagination">
        <button class="btn-pag" id="prevBtn">«</button>
        <select id="selectPage" onchange="goToPage(this.value)" style="font-family:'Bebas Neue';"></select>
        <button class="btn-pag" id="nextBtn">»</button>
    </div>
</div>

<div id="detail-overlay">
    <div class="detail-header">
        <button onclick="closeDetails()" style="background:none; border:none; font-size:24px; cursor:pointer;">✕</button>
        <div id="detail-artist-info" class="artist-box" style="font-size: 20px;"></div>
    </div>

    <div class="stats-summary" id="stats-summary">Carregando estatísticas...</div>

    <div class="tab-container">
        <button class="tab-btn active" onclick="switchTab('songs')">MÚSICAS</button>
        <button class="tab-btn" onclick="switchTab('albums')">ÁLBUNS</button>
    </div>

    <div class="table-wrapper" style="max-height: 70vh;">
        <table class="detail-table">
            <thead>
                <tr>
                    <th style="width:40px">#</th>
                    <th onclick="sortDetails('count')" style="width:80px; cursor:pointer;">TOTAL</th>
                    <th onclick="sortDetails('title')" style="cursor:pointer;">TÍTULO</th>
                </tr>
            </thead>
            <tbody id="detail-body"></tbody>
        </table>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://qdawxpcwkadhfwqhnpsd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_W6LnlxFB_jpBKDN2cn5oKQ_j_g1OZO2';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let fullRawData = [], filteredData = [], offset = 0;
    const limit = 50;
    let sortCol = 'scrobbles', sortAsc = false;
    let currentFilter = { type: null, value: null };

    // Estados dos Detalhes
    let detailData = { songs: [], albums: [] };
    let currentTab = 'songs';
    let detailSortAsc = false;

    const countryMap = { "brasil": "br", "estados unidos": "us", "eua": "us", "argentina": "ar", "alemanha": "de", "frança": "fr", "itália": "it", "espanha": "es", "japão": "jp", "canadá": "ca", "austrália": "au", "portugal": "pt", "méxico": "mx", "suécia": "se", "noruega": "no", "finlândia": "fi", "holanda": "nl", "países baixos": "nl", "polônia": "pl", "bulgária": "bg", "colômbia": "co", "chile": "cl", "uruguai": "uy", "bélgica": "be", "dinamarca": "dk", "islândia": "is", "peru": "pe", "estônia": "ee", "hungria": "hu", "irlanda": "ie", "áfrica do sul": "za", "rússia": "ru", "inglaterra": "gb-eng", "escócia": "gb-sct", "país de gales": "gb-wls" };
    const years = [];
    for (let i = 26; i >= 14; i--) years.push(i);

    // Inicialização Header
    const headerRow = document.getElementById('table-header');
    const inicioTh = headerRow.lastElementChild;
    years.forEach(y => {
        const th = document.createElement('th');
        th.className = 'year-val';
        th.innerText = `'${y}`;
        th.onclick = () => setSort(`y${y}`);
        headerRow.insertBefore(th, inicioTh);
    });

    async function fetchData() {
        const { data, error } = await _supabase.rpc('get_artist_ranking_full', { search_term: '' });
        if (!error) {
            fullRawData = data || [];
            applyLogic();
        }
    }

    function applyLogic() {
        const gs = document.getElementById('globalSearch').value.toLowerCase();
        filteredData = fullRawData.filter(item => {
            const nameMatch = item.artist.toLowerCase().includes(gs);
            const countryMatch = !currentFilter.type || (currentFilter.type === 'country' && item.country === currentFilter.value);
            return nameMatch && (!currentFilter.type || countryMatch);
        });

        filteredData.sort((a, b) => {
            let vA = a[sortCol] ?? -1; let vB = b[sortCol] ?? -1;
            if (sortCol === 'artist') return sortAsc ? vA.localeCompare(vB) : vB.localeCompare(vA);
            return sortAsc ? (vA - vB) : (vB - vA);
        });
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('ranking-body');
        const paged = filteredData.slice(offset, offset + limit);
        
        tbody.innerHTML = paged.map((item, index) => {
            const flagCode = countryMap[(item.country || "").toLowerCase().trim()] || "un";
            const yearCells = years.map(y => {
                const val = item[`y${y}`] || 0;
                return `<td class="year-val ${val > 0 ? 'active' : ''}">${val > 0 ? val.toLocaleString('pt-BR') : '-'}</td>`;
            }).join('');

            return `
            <tr>
                <td>${offset + index + 1}</td>
                <td>
                    <div class="artist-box">
                        <img class="flag-icon" src="https://flagcdn.com/w20/${flagCode}.png">
                        <a style="color:#003399; font-weight:bold; text-decoration:none;" href="https://www.last.fm/music/${encodeURIComponent(item.artist)}" target="_blank">${item.artist}</a>
                    </div>
                </td>
                <td class="puan-col" onclick="showDetails('${item.artist.replace(/'/g, "\\'")}', '${flagCode}', ${item.scrobbles})">${(item.scrobbles || 0).toLocaleString('pt-BR')}</td>
                <td>${item.dias_ultimo ?? '-'}</td>
                <td style="cursor:pointer" onclick="toggleQuickFilter('country', '${item.country}')">${item.country || '-'}</td>
                <td>${item.city || '-'}</td>
                ${yearCells}
                <td>${item.primeiro_ano || '-'}</td>
            </tr>`;
        }).join('');
        updatePaginationUI();
    }

    // --- LOGICA DE DETALHES (SUB-GRIDS) ---

    async function showDetails(artist, flag, total) {
        document.getElementById('detail-overlay').style.display = 'block';
        document.getElementById('detail-artist-info').innerHTML = `
            <img class="flag-icon" style="width:24px; height:16px" src="https://flagcdn.com/w40/${flag}.png">
            <span>${artist}</span>
            <span style="color:var(--primary); margin-left:10px">${total.toLocaleString('pt-BR')} SCROBBLES</span>
        `;
        
        document.getElementById('detail-body').innerHTML = '<tr><td colspan="3">Carregando...</td></tr>';

        // Busca Músicas e Álbuns simultaneamente
        const [resSongs, resAlbums] = await Promise.all([
            _supabase.from('scrobbles_test').select('song').eq('artist', artist),
            _supabase.from('scrobbles_test').select('album').eq('artist', artist)
        ]);

        // Processar Músicas
        const songCounts = {};
        resSongs.data.forEach(r => songCounts[r.song] = (songCounts[r.song] || 0) + 1);
        detailData.songs = Object.entries(songCounts).map(([title, count]) => ({ title, count }));

        // Processar Álbuns
        const albumCounts = {};
        resAlbums.data.forEach(r => {
            const a = r.album || '[Álbum Desconhecido]';
            albumCounts[a] = (albumCounts[a] || 0) + 1;
        });
        detailData.albums = Object.entries(albumCounts).map(([title, count]) => ({ title, count }));

        document.getElementById('stats-summary').innerText = `Total de Músicas Distintas: ${detailData.songs.length} | Total de Álbuns Distintos: ${detailData.albums.length}`;
        
        sortDetails('count'); // Ordenação padrão por scrobbles
    }

    function renderDetailGrid() {
        const data = detailData[currentTab];
        const tbody = document.getElementById('detail-body');
        
        tbody.innerHTML = data.map((item, i) => `
            <tr>
                <td style="color:#999">${i + 1}</td>
                <td class="puan-col">${item.count}</td>
                <td>${item.title}</td>
            </tr>
        `).join('');
    }

    function sortDetails(col) {
        detailSortAsc = !detailSortAsc;
        detailData[currentTab].sort((a, b) => {
            if (col === 'count') return detailSortAsc ? a.count - b.count : b.count - a.count;
            return detailSortAsc ? a.title.localeCompare(b.title) : b.title.localeCompare(a.title);
        });
        renderDetailGrid();
    }

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        sortDetails('count');
    }

    function closeDetails() { document.getElementById('detail-overlay').style.display = 'none'; }

    // --- FUNÇÕES AUXILIARES EXISTENTES ---
    function updatePaginationUI() {
        const totalPages = Math.ceil(filteredData.length / limit) || 1;
        const select = document.getElementById('selectPage');
        select.innerHTML = Array.from({length: totalPages}, (_, i) => `<option value="${i+1}" ${i+1 === Math.floor(offset/limit)+1 ? 'selected' : ''}>PÁG ${i+1}</option>`).join('');
    }

    function setSort(col) {
        if (sortCol === col) sortAsc = !sortAsc;
        else { sortCol = col; sortAsc = false; }
        offset = 0;
        applyLogic();
    }

    function goToPage(p) { offset = (p - 1) * limit; renderTable(); }
    function clearFilters() { document.getElementById('globalSearch').value = ''; currentFilter = { type: null }; fetchData(); }
    document.getElementById('globalSearch').oninput = () => { offset = 0; applyLogic(); };
    
    fetchData();
</script>
</body>
</html>
