<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Curadoria Inteligente</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --primary: #2dd4bf; --border: #334155; --accent: #818cf8; --warning: #fbbf24; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; display: flex; justify-content: center; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; width: 100%; max-width: 500px; border: 1px solid var(--border); box-sizing: border-box; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { font-size: 0.7rem; margin-bottom: 5px; color: #94a3b8; text-transform: uppercase; font-weight: bold; }
        input, select { background: #0f172a; border: 1px solid var(--border); padding: 12px; border-radius: 8px; color: white; font-size: 1rem; width: 100%; box-sizing: border-box; }
        
        /* Lista de Músicas Persistente */
        .track-viewer { background: #020617; border: 1px solid var(--border); border-radius: 8px; margin-top: 10px; max-height: 120px; overflow-y: auto; padding: 10px; font-size: 0.8rem; color: #94a3b8; }
        .track-item { padding: 4px 0; border-bottom: 1px solid #1e293b; }

        .btn-row { display: flex; gap: 8px; margin-bottom: 15px; }
        .btn-action { flex: 1; padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; color: #0f172a; }
        
        .status-badge { padding: 10px; border-radius: 8px; font-size: 0.8rem; margin-bottom: 15px; display: none; font-weight: bold; text-align: center; }
        .badge-found { background: var(--warning); color: #0f172a; }
        .badge-new { background: var(--primary); color: #0f172a; }

        .rating-container { display: flex; gap: 8px; }
        .rating-btn { flex: 1; padding: 12px; border: 1px solid var(--border); background: #1e293b; color: white; cursor: pointer; border-radius: 6px; }
        .rating-btn.active { background: var(--primary); color: #0f172a; font-weight: bold; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="text-align: center; color: var(--primary); margin: 0 0 15px 0;">Sincronização Musical</h2>

    <div class="btn-row">
        <button class="btn-action" style="background: var(--accent);" onclick="pasteFromClipboard()">📋 Colar</button>
        <button class="btn-action" style="background: #64748b;" onclick="location.reload()">🗑️ Limpar</button>
    </div>

    <div class="form-group">
        <label>Link do Álbum</label>
        <input type="text" id="deezer_url" placeholder="Cole o link aqui..." oninput="processUrl(this.value)">
    </div>

    <div id="status-badge" class="status-badge"></div>

    <div id="review-panel" class="hidden">
        <div style="display: flex; gap: 15px; align-items: center; background: #020617; padding: 10px; border-radius: 8px;">
            <img id="view_cover" style="width: 70px; height: 70px; border-radius: 4px;">
            <div style="flex: 1;">
                <div id="view_album" style="font-weight: bold; font-size: 0.9rem;"></div>
                <div id="view_artist" style="color: var(--primary); font-size: 0.8rem;"></div>
                <a id="search_link" target="_blank" style="font-size: 0.7rem; color: var(--accent); text-decoration: none;">🔍 Pesquisar Origem</a>
            </div>
        </div>

        <div class="track-viewer" id="view_tracks"></div>

        <div id="manual-validation" style="margin-top: 20px;">
            <div class="form-group">
                <label>País</label>
                <input list="countries_list" id="country_search" placeholder="Buscar país..." oninput="onCountrySelect(this.value)">
                <datalist id="countries_list"></datalist>
                <input type="hidden" id="country_id">
            </div>

            <div id="state_group" class="form-group hidden">
                <label>Estado</label>
                <select id="state_id"></select>
            </div>

            <div id="city_group" class="form-group hidden">
                <label>Cidade</label>
                <select id="city_id" onchange="checkNewCity(this.value)"></select>
                <input type="text" id="new_city_name" class="hidden" placeholder="Nome da cidade..." style="margin-top:8px;">
            </div>

            <div class="form-group">
                <label>Idioma Principal</label>
                <select id="lang_id" onchange="checkOtherLang(this.value)">
                    <option value="">Selecione...</option>
                    <option value="africano">Africano</option><option value="alemao">Alemão</option>
                    <option value="arabe">Árabe</option><option value="chines">Chinês</option>
                    <option value="coreano">Coreano</option><option value="espanhol">Espanhol</option>
                    <option value="frances">Francês</option><option value="ingles">Inglês</option>
                    <option value="italiano">Italiano</option><option value="japones">Japonês</option>
                    <option value="portugues">Português</option><option value="russo">Russo</option>
                    <option value="instrumental">Instrumental</option><option value="OTHER">Outro...</option>
                </select>
                <input type="text" id="other_lang_name" class="hidden" placeholder="Qual idioma?" style="margin-top:8px;">
            </div>

            <div class="form-group">
                <label>Avaliação</label>
                <div class="rating-container">
                    <button class="rating-btn" onclick="setRate(1)">1</button>
                    <button class="rating-btn" onclick="setRate(2)">2</button>
                    <button class="rating-btn" onclick="setRate(3)">3</button>
                </div>
                <input type="hidden" id="rate_val" value="1">
            </div>

            <button class="btn-action" style="background: var(--primary); width: 100%; margin-top: 10px;" onclick="generatePayload()">SALVAR CADASTRO</button>
        </div>
    </div>
</div>

<script>
    const URL_SB = 'https://qdawxpcwkadhfwqhnpsd.supabase.co';
    const KEY_SB = 'sb_publishable_W6LnlxFB_jpBKDN2cn5oKQ_j_g1OZO2';
    let tempAlbum = null;
    let globalCountries = [];

    async function pasteFromClipboard() {
        const text = await navigator.clipboard.readText();
        document.getElementById('deezer_url').value = text;
        processUrl(text);
    }

    function showBadge(text, isWarning) {
        const badge = document.getElementById('status-badge');
        badge.innerText = text;
        badge.className = `status-badge ${isWarning ? 'badge-found' : 'badge-new'}`;
        badge.style.display = 'block';
    }

    async function processUrl(url) {
        const idMatch = url.match(/album\/(\d+)/);
        if (!idMatch) return;
        const albumId = idMatch[1];

        // BUSCA SE O ÁLBUM JÁ EXISTE NO BANCO
        const res = await fetch(`${URL_SB}/rest/v1/tbl_albums?id_deezer=eq.${albumId}&select=*,tbl_artists(*),tbl_cities(*)`, { headers: { apikey: KEY_SB } });
        const data = await res.json();

        if (data.length > 0) {
            const alb = data[0];
            showBadge("⚠️ ÁLBUM JÁ CADASTRADO!", true);
            // Aqui buscaríamos os dados do Deezer para mostrar a capa/músicas, mas preenchemos o form com o que temos no banco
            fetchDeezer(albumId, alb); 
        } else {
            showBadge("✨ NOVO ÁLBUM DETECTADO", false);
            fetchDeezer(albumId, null);
        }
    }

    function fetchDeezer(id, dbData) {
        const old = document.getElementById('deezer-jsonp');
        if (old) old.remove();
        const s = document.createElement('script');
        s.id = 'deezer-jsonp';
        s.src = `https://api.deezer.com/album/${id}?output=jsonp&callback=handleDeezerResponse`;
        window.dbRef = dbData; // Passa dados do banco para o callback
        document.body.appendChild(s);
    }

    function handleDeezerResponse(data) {
        tempAlbum = data;
        document.getElementById('review-panel').classList.remove('hidden');
        document.getElementById('view_cover').src = data.cover_medium;
        document.getElementById('view_album').innerText = data.title;
        document.getElementById('view_artist').innerText = data.artist.name;
        document.getElementById('view_tracks').innerHTML = data.tracks.data.map(t => `<div class="track-item">• ${t.title}</div>`).join('');
        
        const query = encodeURIComponent(`Cidade e país de origem do artista ${data.artist.name}, que lançou o álbum ${data.title}`);
        document.getElementById('search_link').href = `https://www.google.com/search?q=${query}`;

        loadCountries().then(() => {
            if (window.dbRef) autoFill(window.dbRef);
        });
    }

    function autoFill(db) {
        // Preenche País
        const country = globalCountries.find(c => c.id_country == db.id_country);
        if (country) {
            document.getElementById('country_search').value = country.portuguese_name;
            onCountrySelect(country.portuguese_name, db);
        }
        // Preenche Idioma
        document.getElementById('lang_id').value = db.language || "";
        // Preenche Rating
        setRate(db.rating || 1);
    }

    async function loadCountries() {
        const res = await fetch(`${URL_SB}/rest/v1/tbl_countries?select=*&order=portuguese_name`, { headers: { apikey: KEY_SB } });
        globalCountries = await res.json();
        const list = document.getElementById('countries_list');
        list.innerHTML = globalCountries.map(c => `<option value="${c.portuguese_name}">`).join('');
    }

    async function onCountrySelect(val, dbData = null) {
        const country = globalCountries.find(c => c.portuguese_name === val);
        if (!country) return;
        document.getElementById('country_id').value = country.id_country;

        const needsState = ['25', '64'].includes(String(country.id_country));
        document.getElementById('state_group').classList.toggle('hidden', !needsState);
        
        if (needsState) {
            await loadStates(country.id_country);
            if (dbData) document.getElementById('state_id').value = dbData.id_state;
        }
        
        await loadCities(country.id_country, needsState ? (dbData?.id_state || document.getElementById('state_id').value) : null);
        if (dbData) document.getElementById('city_id').value = dbData.id_city || ".";
    }

    async function loadStates(cid) {
        const res = await fetch(`${URL_SB}/rest/v1/tbl_states?id_country=eq.${cid}&order=name`, { headers: { apikey: KEY_SB } });
        const states = await res.json();
        const sel = document.getElementById('state_id');
        sel.innerHTML = '<option value="">Estado...</option>' + states.map(s => `<option value="${s.id_state}">${s.name}</option>`).join('');
    }

    async function loadCities(cid, sid) {
        let url = `${URL_SB}/rest/v1/tbl_cities?id_country=eq.${cid}&order=name`;
        if(sid) url += `&id_state=eq.${sid}`;
        const res = await fetch(url, { headers: { apikey: KEY_SB } });
        const cities = await res.json();
        const sel = document.getElementById('city_id');
        document.getElementById('city_group').classList.remove('hidden');
        sel.innerHTML = '<option value=".">. (Ponto)</option>' + cities.map(c => `<option value="${c.id_city}">${c.name}</option>`).join('') + '<option value="NEW">+ Adicionar nova...</option>';
    }

    function setRate(v) {
        document.querySelectorAll('.rating-btn').forEach((b, i) => b.classList.toggle('active', i === v-1));
        document.getElementById('rate_val').value = v;
    }
    
    function checkNewCity(v) { document.getElementById('new_city_name').classList.toggle('hidden', v !== 'NEW'); }
    function checkOtherLang(v) { document.getElementById('other_lang_name').classList.toggle('hidden', v !== 'OTHER'); }

</script>
</body>
</html>
