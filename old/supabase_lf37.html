<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Histórico Dinâmico</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --primary: #1DB954; 
            --bg: #ffffff; 
            --row-even: #f8f8f8;
            --text: #222;
            --header-bg: #f1f1f1;
            --border: #e0e0e0;
        }

        body { font-family: 'Bebas Neue', cursive; background-color: var(--bg); color: var(--text); margin: 0; padding: 5px; letter-spacing: 0.2px; }

        .controls { padding: 8px 0; display: flex; gap: 8px; position: sticky; top: 0; background: white; z-index: 2000; }
        #globalSearch { flex: 1; padding: 8px 15px; border-radius: 20px; border: 1px solid #ccc; background: #f9f9f9; font-family: sans-serif; font-size: 14px; outline: none; }
        .btn-clear { background: #eee; border: none; padding: 0 15px; border-radius: 20px; cursor: pointer; font-family: 'Bebas Neue'; font-size: 14px; }

        .table-wrapper { width: 100%; max-height: 82vh; overflow: auto; border: 1px solid var(--border); position: relative; background: white; }
        
        table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; min-width: 1300px; }

        /* CABEÇALHO FIXO VERTICAL */
        th { background: var(--header-bg); position: sticky; top: 0; z-index: 1000; padding: 8px 6px; border-bottom: 2px solid #ddd; }
        
        /* COLUNAS FIXAS LATERAIS (#, ARTISTA, TOTAL) */
        /* # */
        th:nth-child(1), td:nth-child(1) { position: sticky; left: 0; z-index: 500; width: 35px; text-align: center; border-right: 1px solid #ddd; background: white; }
        
        /* Artista: Comportamento de expansão/redução original */
        th:nth-child(2), td:nth-child(2) { 
            position: sticky; 
            left: 48px; 
            z-index: 500; 
            min-width: 80px; 
            max-width: 180px;
            border-right: 1px solid #ddd; 
            background: white; 
        }

        /* Total: Fixo para visibilidade constante */
        th:nth-child(3), td:nth-child(3) { 
            position: sticky; 
            left: 170px; /* Ajuste para não sobrepor o artista */
            z-index: 500; 
            width: 70px; 
            border-right: 2px solid #ccc; 
            background: #fff; 
            color: var(--primary);
            cursor: pointer;
        }

        th:nth-child(1), th:nth-child(2), th:nth-child(3) { z-index: 1100; }

        td { padding: 4px 6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
        tbody tr:nth-child(even) td { background-color: var(--row-even); }
        tbody tr:nth-child(even) td:nth-child(1), 
        tbody tr:nth-child(even) td:nth-child(2),
        tbody tr:nth-child(even) td:nth-child(3) { background-color: var(--row-even); }

        .artist-box { display: flex; align-items: center; gap: 6px; overflow: hidden; }
        .artist-name { color: #003399; text-decoration: none; font-size: 14px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; }
        .flag-icon { width: 16px; height: 11px; object-fit: cover; border: 0.5px solid #bbb; flex-shrink: 0; }

        .puan-col { color: #000; font-weight: bold; text-align: right; }
        .clickable-filter { cursor: pointer; color: #666; font-family: sans-serif; font-size: 11px; }
        .active-filter { color: var(--primary); font-weight: bold; }

        .year-val { text-align: center; font-family: sans-serif; font-size: 10px; color: #888; border-left: 1px solid #f0f0f0; width: 32px; }
        .year-val.active { color: #000; font-weight: bold; }

        /* MODAL E TABS */
        #statsModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 3000; flex-direction: column; }
        .modal-header { padding: 15px; border-bottom: 1px solid #ddd; display: flex; align-items: center; justify-content: space-between; background: var(--header-bg); }
        .tabs { display: flex; background: #eee; padding: 5px; gap: 5px; }
        .tab-btn { flex: 1; padding: 10px; border: none; cursor: pointer; font-family: 'Bebas Neue'; font-size: 18px; background: #ddd; }
        .tab-btn.active { background: var(--primary); color: white; }
        .modal-body { flex: 1; overflow-y: auto; padding: 10px; }
        .stats-table { width: 100%; border-collapse: collapse; font-family: sans-serif; font-size: 13px; }
        .stats-table td { border-bottom: 1px solid #eee; padding: 8px; }

        .pagination { display: flex; justify-content: center; gap: 8px; padding: 15px; align-items: center; }
        .btn-pag { background: white; border: 1px solid #ccc; padding: 3px 12px; border-radius: 4px; font-family: 'Bebas Neue'; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <input type="text" id="globalSearch" placeholder="BUSCAR ARTISTA...">
        <button class="btn-clear" onclick="clearFilters()">LIMPAR TUDO</button>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr id="table-header">
                    <th onclick="setSort('scrobbles')">#</th>
                    <th onclick="setSort('artist')">ARTISTA</th>
                    <th onclick="setSort('scrobbles')" style="text-align: right;">TOTAL</th>
                    <th onclick="setSort('dias_ultimo')" style="text-align: center;">DIAS</th>
                    <th onclick="setSort('country')">PAÍS</th>
                    <th onclick="setSort('city')">CIDADE</th>
                    <th onclick="setSort('primeiro_ano')" style="text-align: center;">INÍCIO</th>
                </tr>
            </thead>
            <tbody id="ranking-body"></tbody>
        </table>
    </div>

    <div class="pagination">
        <button class="btn-pag" id="prevBtn">«</button>
        <select id="selectPage" onchange="goToPage(this.value)" style="font-family:'Bebas Neue';"></select>
        <button class="btn-pag" id="nextBtn">»</button>
    </div>
</div>

<div id="statsModal">
    <div class="modal-header">
        <span id="modalTitle" style="font-size: 24px;">ESTATÍSTICAS</span>
        <button class="btn-clear" onclick="closeModal()">VOLTAR AO RANKING</button>
    </div>
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('songs')">MÚSICAS</button>
        <button class="tab-btn" onclick="switchTab('albums')">ÁLBUNS</button>
    </div>
    <div class="modal-body" id="modalBody">
        <div id="loadingMsg" style="text-align:center; padding:20px; font-family:sans-serif;">CARREGANDO DETALHES...</div>
        <div id="statsContent"></div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://qdawxpcwkadhfwqhnpsd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_W6LnlxFB_jpBKDN2cn5oKQ_j_g1OZO2';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let fullRawData = [], filteredData = [], offset = 0;
    const limit = 50;
    let sortCol = 'scrobbles', sortAsc = false;
    let currentFilter = { type: null, value: null };
    let currentArtistStats = null;

    const countryMap = {
        "brasil": "br", "estados unidos": "us", "eua": "us", "argentina": "ar", "alemanha": "de", "frança": "fr", "itália": "it", "espanha": "es", "japão": "jp", "canadá": "ca", "austrália": "au", "portugal": "pt", "méxico": "mx", "suécia": "se", "noruega": "no", "finlândia": "fi", "holanda": "nl", "países baixos": "nl", "polônia": "pl", "bulgária": "bg", "colômbia": "co", "chile": "cl", "uruguai": "uy", "bélgica": "be", "dinamarca": "dk", "islândia": "is", "peru": "pe", "estônia": "ee", "hungria": "hu", "irlanda": "ie", "áfrica do sul": "za", "rússia": "ru", "inglaterra": "gb-eng", "escócia": "gb-sct", "país de gales": "gb-wls"
    };

    const years = [];
    for (let i = 26; i >= 14; i--) years.push(i);

    const headerRow = document.getElementById('table-header');
    const inicioTh = headerRow.lastElementChild;
    years.forEach(y => {
        const th = document.createElement('th');
        th.className = 'year-val';
        th.innerText = `'${y}`;
        th.onclick = () => setSort(`y${y}`);
        headerRow.insertBefore(th, inicioTh);
    });

    async function fetchData() {
        const { data, error } = await _supabase.rpc('get_artist_ranking_full', { search_term: '' });
        if (!error) { fullRawData = data || []; applyLogic(); }
    }

    function applyLogic() {
        const gs = document.getElementById('globalSearch').value.toLowerCase();
        filteredData = fullRawData.filter(item => {
            const nameMatch = item.artist.toLowerCase().includes(gs);
            const countryMatch = !currentFilter.type || (currentFilter.type === 'country' && item.country === currentFilter.value);
            return nameMatch && (!currentFilter.type || countryMatch);
        });
        filteredData.sort((a, b) => {
            let vA = a[sortCol] ?? (sortCol === 'dias_ultimo' ? 99999 : -1);
            let vB = b[sortCol] ?? (sortCol === 'dias_ultimo' ? 99999 : -1);
            if (sortCol === 'dias_ultimo') return sortAsc ? (vB - vA) : (vA - vB);
            return sortAsc ? (vA > vB ? 1 : -1) : (vB > vA ? 1 : -1);
        });
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('ranking-body');
        const paged = filteredData.slice(offset, offset + limit);
        tbody.innerHTML = paged.map((item, index) => {
            const flagCode = countryMap[(item.country || "").toLowerCase().trim()] || "un";
            const yearCells = years.map(y => {
                const val = item[`y${y}`] || 0;
                return `<td class="year-val ${val > 0 ? 'active' : ''}">${val > 0 ? val.toLocaleString('pt-BR') : '-'}</td>`;
            }).join('');

            return `<tr>
                <td onclick="openDeezer('${item.artist.replace(/'/g, "\\'")}', 'artist')">${offset + index + 1}</td>
                <td><div class="artist-box"><img class="flag-icon" src="https://flagcdn.com/w20/${flagCode}.png"><a class="artist-name" href="https://www.last.fm/music/${encodeURIComponent(item.artist)}" target="_blank">${item.artist}</a></div></td>
                <td class="puan-col" onclick="showStats('${item.artist.replace(/'/g, "\\'")}')">${(item.scrobbles || 0).toLocaleString('pt-BR')}</td>
                <td style="text-align:center; font-size:10px; color:${item.dias_ultimo > 365 ? 'red' : '#666'}">${item.dias_ultimo ?? '-'}</td>
                <td class="clickable-filter" onclick="toggleQuickFilter('country', '${item.country}')">${item.country || '-'}</td>
                <td class="clickable-filter">${item.city || '-'}</td>
                ${yearCells}
                <td style="text-align:center; font-size:10px;">${item.primeiro_ano || '-'}</td>
            </tr>`;
        }).join('');
        updatePaginationUI();
    }

    async function showStats(artist) {
        document.getElementById('statsModal').style.display = 'flex';
        document.getElementById('modalTitle').innerText = artist.toUpperCase();
        document.getElementById('loadingMsg').style.display = 'block';
        document.getElementById('statsContent').innerHTML = '';
        const { data, error } = await _supabase.from('scrobbles_test').select('song, album').eq('artist', artist);
        if (!error) {
            const songs = {}, albums = {};
            data.forEach(s => {
                songs[s.song] = (songs[s.song] || 0) + 1;
                if(s.album) albums[s.album] = (albums[s.album] || 0) + 1;
            });
            currentArtistStats = { songs: Object.entries(songs).sort((a,b) => b[1]-a[1]), albums: Object.entries(albums).sort((a,b) => b[1]-a[1]), artistName: artist };
            document.getElementById('loadingMsg').style.display = 'none';
            switchTab('songs');
        }
    }

    function switchTab(type) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        const btn = document.querySelector(`.tab-btn[onclick*="${type}"]`);
        if(btn) btn.classList.add('active');
        const data = currentArtistStats[type];
        document.getElementById('statsContent').innerHTML = `<table class="stats-table"><thead><tr><th>${type==='songs'?'MÚSICA':'ÁLBUM'}</th><th style="text-align:right">TOTAL</th></tr></thead><tbody>${data.map(i => `<tr onclick="openDeezer('${i[0].replace(/'/g, "\\'")}', '${type==='songs'?'track':'album'}', '${currentArtistStats.artistName.replace(/'/g, "\\'")}')"><td style="color:#003399; font-weight:bold;">${i[0]}</td><td style="text-align:right; font-weight:bold;">${i[1]}</td></tr>`).join('')}</tbody></table>`;
    }

    function openDeezer(term, type, artist = '') {
        const query = artist ? `${artist} ${term}` : term;
        const callbackName = 'dz_' + Math.floor(Math.random() * 100000);
        window[callbackName] = function(data) {
            if (data.data && data.data.length > 0) {
                window.location.href = `deezer://www.deezer.com/${type}/${data.data[0].id}`;
                setTimeout(() => { if (document.hasFocus()) window.open(data.data[0].link, '_blank'); }, 600);
            } else { window.open(`https://www.deezer.com/search/${encodeURIComponent(query)}`, '_blank'); }
            delete window[callbackName];
        };
        const script = document.createElement('script');
        script.src = `https://api.deezer.com/search/${type==='track'?'track':type==='album'?'album':'artist'}?q=${encodeURIComponent(query)}&output=jsonp&callback=${callbackName}`;
        document.body.appendChild(script);
    }

    function closeModal() { document.getElementById('statsModal').style.display = 'none'; }
    function setSort(col) { if (sortCol === col) sortAsc = !sortAsc; else { sortCol = col; sortAsc = (col === 'artist' || col === 'dias_ultimo'); } offset = 0; applyLogic(); }
    function toggleQuickFilter(type, value) { currentFilter = (currentFilter.value === value) ? {type:null, value:null} : {type, value}; applyLogic(); }
    function goToPage(p) { offset = (p - 1) * limit; renderTable(); document.querySelector('.table-wrapper').scrollTop = 0; }
    function clearFilters() { document.getElementById('globalSearch').value = ''; currentFilter = {type:null, value:null}; fetchData(); }
    function updatePaginationUI() {
        const totalPages = Math.ceil(filteredData.length / limit) || 1;
        document.getElementById('selectPage').innerHTML = Array.from({length: totalPages}, (_, i) => `<option value="${i+1}" ${i+1 === Math.floor(offset/limit)+1 ? 'selected' : ''}>PÁG ${i+1}</option>`).join('');
    }
    document.getElementById('globalSearch').oninput = () => { offset = 0; applyLogic(); };
    fetchData();
</script>
</body>
</html>
