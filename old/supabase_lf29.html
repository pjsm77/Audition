<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Histórico - Instant Load</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --primary: #1DB954; 
            --bg: #ffffff; 
            --row-even: #f8f8f8;
            --text: #222;
            --header-bg: #f1f1f1;
            --border: #e0e0e0;
        }

        body { 
            font-family: 'Bebas Neue', cursive; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 5px;
            letter-spacing: 0.3px;
        }

        .container { max-width: 100%; margin: auto; }

        .controls { 
            padding: 10px 0;
            display: flex;
            gap: 8px;
            position: sticky;
            top: 0;
            background: white;
            z-index: 100;
        }

        #globalSearch { 
            flex: 1; 
            padding: 8px 15px; 
            border-radius: 20px; 
            border: 1px solid #ccc; 
            background: #f9f9f9; 
            font-family: sans-serif; 
            font-size: 13px;
            outline: none;
        }

        .btn-clear { 
            background: #eee; border: none; padding: 0 15px; border-radius: 20px; 
            cursor: pointer; font-family: 'Bebas Neue'; font-size: 14px; 
        }

        .table-wrapper { width: 100%; overflow-x: auto; border: 1px solid var(--border); }
        
        table { width: 100%; border-collapse: collapse; font-size: 14px; }

        th { 
            padding: 6px 4px; 
            background: var(--header-bg);
            color: #555; 
            text-align: left; 
            font-weight: normal;
            cursor: pointer;
            border-bottom: 2px solid #ddd;
            white-space: nowrap;
        }

        td { 
            padding: 4px 6px; 
            border-bottom: 1px solid var(--border); 
            white-space: nowrap; 
        }

        tbody tr:nth-child(even) { background-color: var(--row-even); }
        tbody tr:hover { background-color: #f1f1f1; }

        /* Colunas Estreitas */
        .w-rank { width: 30px; text-align: center; background: #eee; font-weight: bold; cursor: pointer; color: #444; font-size: 13px; }
        .w-rank:hover { background: var(--primary); color: white; }
        
        .artist-name { color: #003399; text-decoration: none; font-size: 15px; }
        .puan-col { color: #000; font-weight: bold; text-align: right; width: 60px; }
        
        .year-col { text-align: center; font-family: sans-serif; font-size: 11px; color: #777; width: 35px; }
        .year-val { text-align: center; font-family: sans-serif; font-size: 11px; color: #999; }
        .year-val.active { color: #000; font-weight: bold; }

        .pagination { display: flex; justify-content: center; gap: 10px; padding: 15px; align-items: center; }
        .btn-pag { background: white; border: 1px solid #ccc; padding: 2px 12px; border-radius: 3px; font-family: 'Bebas Neue'; font-size: 15px; cursor: pointer; }
        .btn-pag:disabled { opacity: 0.3; }

        @media (max-width: 600px) { .hide-mobile { display: none; } }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <input type="text" id="globalSearch" placeholder="BUSCAR ARTISTA...">
        <button class="btn-clear" onclick="clearFilters()">LIMPAR</button>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr id="table-header">
                    <th onclick="setSort('scrobbles')" style="text-align: center;">#</th>
                    <th onclick="setSort('artist')">ARTISTA</th>
                    <th onclick="setSort('country')" class="hide-mobile">PAÍS</th>
                    <th onclick="setSort('city')" class="hide-mobile">CIDADE</th>
                    <th onclick="setSort('primeiro_ano')" class="hide-mobile">INÍCIO</th>
                    <th onclick="setSort('dias_ultimo')" class="hide-mobile">DIAS</th>
                    <th onclick="setSort('scrobbles')" style="text-align: right;">TOTAL</th>
                </tr>
            </thead>
            <tbody id="ranking-body"></tbody>
        </table>
    </div>

    <div class="pagination">
        <button class="btn-pag" id="prevBtn">«</button>
        <select id="selectPage" onchange="goToPage(this.value)"></select>
        <button class="btn-pag" id="nextBtn">»</button>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://qdawxpcwkadhfwqhnpsd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_W6LnlxFB_jpBKDN2cn5oKQ_j_g1OZO2';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let fullData = [], offset = 0;
    const limit = 50;
    let sortCol = 'scrobbles', sortAsc = false;

    const years = [];
    for (let i = 26; i >= 14; i--) years.push(i);

    // Inserir headers de anos
    const headerRow = document.getElementById('table-header');
    years.forEach(y => {
        const th = document.createElement('th');
        th.className = 'year-col hide-mobile';
        th.innerText = `'${y}`;
        th.onclick = () => setSort(`y${y}`);
        headerRow.appendChild(th);
    });

    async function fetchData() {
        const gs = document.getElementById('globalSearch').value;
        
        // Chamada direta para garantir velocidade. Se não houver busca, o RPC deve ser ultra rápido.
        const { data, error } = await _supabase.rpc('get_artist_ranking_full', { 
            search_term: gs || '' 
        });

        if (!error) {
            fullData = data || [];
            sortAndRender();
        }
    }

    function sortAndRender() {
        fullData.sort((a, b) => {
            let vA = a[sortCol] ?? -1;
            let vB = b[sortCol] ?? -1;
            if (typeof vA === 'string') { vA = vA.toLowerCase(); vB = vB.toLowerCase(); }
            return sortAsc ? (vA > vB ? 1 : -1) : (vA < vB ? 1 : -1);
        });
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('ranking-body');
        const paged = fullData.slice(offset, offset + limit);
        
        tbody.innerHTML = paged.map((item, index) => {
            const yearCells = years.map(y => {
                const val = item[`y${y}`] || 0;
                return `<td class="year-val hide-mobile ${val > 0 ? 'active' : ''}">${val > 0 ? val : '-'}</td>`;
            }).join('');

            return `
            <tr>
                <td class="w-rank" onclick="openDeezer('${(item.artist || '').replace(/'/g, "\\'")}')">${offset + index + 1}</td>
                <td><a class="artist-name" href="https://www.last.fm/music/${encodeURIComponent(item.artist)}" target="_blank">${item.artist}</a></td>
                <td class="hide-mobile" style="font-size:11px; font-family:sans-serif;">${item.country || '-'}</td>
                <td class="hide-mobile" style="font-size:11px; font-family:sans-serif;">${item.city || '-'}</td>
                <td class="hide-mobile" style="text-align:center;">${item.primeiro_ano || '-'}</td>
                <td class="hide-mobile" style="text-align:center; color:${item.dias_ultimo > 365 ? 'red' : 'inherit'}">${item.dias_ultimo ?? '-'}</td>
                <td class="puan-col">${(item.scrobbles || 0).toLocaleString('pt-BR')}</td>
                ${yearCells}
            </tr>`;
        }).join('');
        updatePaginationUI();
    }

    function openDeezer(artist) {
        const callbackName = 'dz_' + Math.floor(Math.random() * 100000);
        window[callbackName] = function(data) {
            if (data.data && data.data.length > 0) {
                const artistId = data.data[0].id;
                window.location.href = `deezer://www.deezer.com/artist/${artistId}`;
                setTimeout(() => { if (document.hasFocus()) window.open(data.data[0].link, '_blank'); }, 600);
            } else {
                window.open(`https://www.deezer.com/search/${encodeURIComponent(artist)}`, '_blank');
            }
            delete window[callbackName];
        };
        const script = document.createElement('script');
        script.src = `https://api.deezer.com/search/artist?q=${encodeURIComponent(artist)}&output=jsonp&callback=${callbackName}`;
        document.body.appendChild(script);
    }

    function updatePaginationUI() {
        const totalPages = Math.ceil(fullData.length / limit) || 1;
        const select = document.getElementById('selectPage');
        const currentPage = Math.floor(offset / limit) + 1;
        select.innerHTML = Array.from({length: totalPages}, (_, i) => `<option value="${i+1}" ${i+1 === currentPage ? 'selected' : ''}>${i+1}</option>`).join('');
        document.getElementById('prevBtn').disabled = offset <= 0;
        document.getElementById('nextBtn').disabled = offset + limit >= fullData.length;
    }

    function setSort(col) {
        if (sortCol === col) sortAsc = !sortAsc;
        else { sortCol = col; sortAsc = (col === 'artist' || col === 'country' || col === 'city'); }
        offset = 0;
        sortAndRender();
    }

    function goToPage(p) { offset = (p - 1) * limit; renderTable(); window.scrollTo(0,0); }
    function clearFilters() { document.getElementById('globalSearch').value = ''; offset = 0; fetchData(); }

    let searchTimer;
    document.getElementById('globalSearch').oninput = () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => { offset = 0; fetchData(); }, 400);
    };

    document.getElementById('nextBtn').onclick = () => { offset += limit; renderTable(); window.scrollTo(0,0); };
    document.getElementById('prevBtn').onclick = () => { offset -= limit; renderTable(); window.scrollTo(0,0); };

    fetchData();
</script>
</body>
</html>
