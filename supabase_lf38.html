<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Histórico Pro - Mobile Fit</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --primary: #1DB954; 
            --bg: #ffffff; 
            --row-even: #f8f8f8;
            --text: #222;
            --header-bg: #f1f1f1;
            --border: #e0e0e0;
        }

        body { font-family: 'Bebas Neue', cursive; background-color: var(--bg); color: var(--text); margin: 0; padding: 5px; letter-spacing: 0.2px; }

        .controls { padding: 8px 0; display: flex; gap: 8px; position: sticky; top: 0; background: white; z-index: 2000; }
        #globalSearch { flex: 1; padding: 8px 15px; border-radius: 20px; border: 1px solid #ccc; background: #f9f9f9; font-family: sans-serif; font-size: 14px; outline: none; }
        .btn-clear { background: #eee; border: none; padding: 0 15px; border-radius: 20px; cursor: pointer; font-family: 'Bebas Neue'; font-size: 14px; }

        .table-wrapper { 
            width: 100%; 
            max-height: 82vh; 
            overflow: auto; 
            border: 1px solid var(--border); 
            position: relative; 
            background: white; 
        }
        
        table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12px; min-width: 1300px; }

        th { background: var(--header-bg); position: sticky; top: 0; z-index: 1000; padding: 8px 4px; border-bottom: 2px solid #ddd; cursor: pointer; }
        
        th:nth-child(1), td:nth-child(1) { position: sticky; left: 0; z-index: 500; width: 32px; text-align: center; border-right: 1px solid #ddd; background: white; }
        th:nth-child(2), td:nth-child(2) { position: sticky; left: 33px; z-index: 500; min-width: 100px; max-width: 110px; border-right: 1px solid #ddd; background: white; }
        th:nth-child(3), td:nth-child(3) { position: sticky; left: 144px; z-index: 500; width: 60px; border-right: 2px solid #ccc; background: #fff; text-align: right; cursor: pointer; color: var(--primary); }

        th:nth-child(1), th:nth-child(2), th:nth-child(3) { z-index: 1100; }

        td { padding: 4px 5px; border-bottom: 1px solid var(--border); white-space: nowrap; }
        tbody tr:nth-child(even) td { background-color: var(--row-even); }
        tbody tr:nth-child(even) td:nth-child(1), 
        tbody tr:nth-child(even) td:nth-child(2),
        tbody tr:nth-child(even) td:nth-child(3) { background-color: var(--row-even); }

        .artist-box { display: flex; align-items: center; gap: 4px; overflow: hidden; }
        .artist-name { color: #003399; text-decoration: none; font-size: 13px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; }
        .flag-icon { width: 14px; height: 10px; object-fit: cover; border: 0.5px solid #bbb; flex-shrink: 0; }

        .puan-col { color: #000; font-weight: bold; }
        .clickable-filter { cursor: pointer; color: #666; font-family: sans-serif; font-size: 10px; }
        
        .year-val { text-align: center; font-family: sans-serif; font-size: 10px; color: #888; border-left: 1px solid #f0f0f0; width: 30px; }
        .year-val.active { color: #000; font-weight: bold; }

        .pagination { display: flex; justify-content: center; gap: 8px; padding: 15px; align-items: center; }
        .btn-pag { background: white; border: 1px solid #ccc; padding: 3px 10px; border-radius: 4px; font-family: 'Bebas Neue'; font-size: 16px; cursor: pointer; }

        /* MODAL ESTILIZAÇÃO */
        #statsModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 3000; flex-direction: column; animation: fadeIn 0.2s; }
        .modal-header { padding: 12px; border-bottom: 1px solid #ddd; display: flex; align-items: center; justify-content: space-between; background: var(--header-bg); }
        .modal-title-box { display: flex; align-items: center; gap: 8px; font-size: 20px; }
        .tabs { display: flex; background: #eee; padding: 4px; gap: 4px; }
        .tab-btn { flex: 1; padding: 12px; border: none; cursor: pointer; font-family: 'Bebas Neue'; font-size: 16px; background: #ddd; transition: 0.2s; }
        .tab-btn.active { background: var(--primary); color: white; }
        .modal-body { flex: 1; overflow-y: auto; padding: 0; }
        .stats-table { width: 100%; border-collapse: collapse; font-family: sans-serif; font-size: 12px; }
        .stats-table th { position: sticky; top: 0; background: #f9f9f9; z-index: 10; padding: 10px; border-bottom: 2px solid #ddd; text-align: left; }
        .stats-table td { padding: 8px 10px; border-bottom: 1px solid #eee; }
        .col-rank { width: 30px; text-align: center; color: #888; }
        .col-total { width: 60px; text-align: right; font-weight: bold; }
        .col-title { padding-left: 20px !important; color: #003399; font-weight: bold; cursor: pointer; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <input type="text" id="globalSearch" placeholder="BUSCAR ARTISTA...">
        <button class="btn-clear" onclick="clearFilters()">LIMPAR</button>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr id="table-header">
                    <th onclick="setSort('scrobbles')">#</th>
                    <th onclick="setSort('artist')">ARTISTA</th>
                    <th onclick="setSort('scrobbles')">TOTAL</th>
                    <th onclick="setSort('dias_ultimo')">DIAS</th>
                    <th onclick="setSort('country')">PAÍS</th>
                    <th onclick="setSort('city')">CIDADE</th>
                    <th onclick="setSort('primeiro_ano')">INÍCIO</th>
                </tr>
            </thead>
            <tbody id="ranking-body"></tbody>
        </table>
    </div>

    <div class="pagination">
        <button class="btn-pag" id="prevBtn">«</button>
        <select id="selectPage" onchange="goToPage(this.value)" style="font-family:'Bebas Neue';"></select>
        <button class="btn-pag" id="nextBtn">»</button>
    </div>
</div>

<div id="statsModal">
    <div class="modal-header">
        <div class="modal-title-box" id="modalTitle"></div>
        <button class="btn-clear" onclick="closeModal()">VOLTAR</button>
    </div>
    <div class="tabs">
        <button class="tab-btn active" id="tab-songs" onclick="switchTab('songs')">MÚSICAS (0)</button>
        <button class="tab-btn" id="tab-albums" onclick="switchTab('albums')">ÁLBUNS (0)</button>
    </div>
    <div id="modalBody" class="modal-body">
        <div id="loadingStats" style="padding: 40px; text-align: center; font-family: sans-serif;">CARREGANDO...</div>
        <table class="stats-table" id="statsTable" style="display: none;">
            <thead>
                <tr id="stats-header"></tr>
            </thead>
            <tbody id="stats-tbody"></tbody>
        </table>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://qdawxpcwkadhfwqhnpsd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_W6LnlxFB_jpBKDN2cn5oKQ_j_g1OZO2';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let fullRawData = [], filteredData = [], offset = 0;
    const limit = 50;
    let sortCol = 'scrobbles', sortAsc = false;
    let currentFilter = { type: null, value: null };

    // Memória do Modal
    let modalData = { songs: [], albums: [], artist: '', currentTab: 'songs', sortCol: 'total', sortAsc: false };

    const countryMap = {
        "brasil": "br", "estados unidos": "us", "eua": "us", "argentina": "ar", "alemanha": "de", 
        "frança": "fr", "itália": "it", "espanha": "es", "japão": "jp", "canadá": "ca", "austrália": "au", 
        "portugal": "pt", "méxico": "mx", "suécia": "se", "noruega": "no", "finlândia": "fi", 
        "holanda": "nl", "países baixos": "nl", "polônia": "pl", "bulgária": "bg", "colômbia": "co", 
        "chile": "cl", "uruguai": "uy", "bélgica": "be", "dinamarca": "dk", "islândia": "is", 
        "peru": "pe", "estônia": "ee", "hungria": "hu", "irlanda": "ie", "áfrica do sul": "za", 
        "rússia": "ru", "inglaterra": "gb-eng", "escócia": "gb-sct", "país de gales": "gb-wls"
    };

    const years = [];
    for (let i = 26; i >= 14; i--) years.push(i);

    const headerRow = document.getElementById('table-header');
    const inicioTh = headerRow.lastElementChild;
    years.forEach(y => {
        const th = document.createElement('th');
        th.className = 'year-val';
        th.innerText = `'${y}`;
        th.onclick = () => setSort(`y${y}`);
        headerRow.insertBefore(th, inicioTh);
    });

    async function fetchData() {
        const { data, error } = await _supabase.rpc('get_artist_ranking_full', { search_term: '' });
        if (!error) {
            fullRawData = data || [];
            applyLogic();
        }
    }

    function applyLogic() {
        const gs = document.getElementById('globalSearch').value.toLowerCase();
        filteredData = fullRawData.filter(item => {
            const nameMatch = item.artist.toLowerCase().includes(gs);
            const countryMatch = !currentFilter.type || (currentFilter.type === 'country' && item.country === currentFilter.value);
            const cityMatch = !currentFilter.type || (currentFilter.type === 'city' && item.city === currentFilter.value);
            return nameMatch && (!currentFilter.type || countryMatch || cityMatch);
        });

        filteredData.sort((a, b) => {
            let vA = a[sortCol] ?? (sortCol === 'dias_ultimo' ? 99999 : -1);
            let vB = b[sortCol] ?? (sortCol === 'dias_ultimo' ? 99999 : -1);
            if (typeof vA === 'string') { vA = vA.toLowerCase(); vB = vB.toLowerCase(); }
            if (sortCol === 'artist') return sortAsc ? (vA > vB ? 1 : -1) : (vA < vB ? 1 : -1);
            if (sortCol === 'dias_ultimo') return sortAsc ? (vB - vA) : (vA - vB);
            return sortAsc ? (vA - vB) : (vB - vA);
        });
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('ranking-body');
        const paged = filteredData.slice(offset, offset + limit);
        
        tbody.innerHTML = paged.map((item, index) => {
            const displayRank = offset + index + 1;
            const pNome = (item.country || "").toLowerCase().trim();
            const flagCode = countryMap[pNome] || "un";
            const yearCells = years.map(y => {
                const val = item[`y${y}`] || 0;
                return `<td class="year-val ${val > 0 ? 'active' : ''}">${val > 0 ? val.toLocaleString('pt-BR') : '-'}</td>`;
            }).join('');

            return `
            <tr>
                <td style="cursor:pointer; color:var(--primary);" onclick="openDeezer('${(item.artist || '').replace(/'/g, "\\'")}', 'artist')">${displayRank}</td>
                <td>
                    <div class="artist-box">
                        <img class="flag-icon" src="https://flagcdn.com/w20/${flagCode}.png" onerror="this.src='https://flagcdn.com/w20/un.png'">
                        <a class="artist-name" href="https://www.last.fm/music/${encodeURIComponent(item.artist)}" target="_blank">${item.artist}</a>
                    </div>
                </td>
                <td class="puan-col" onclick="showStats('${item.artist.replace(/'/g, "\\'")}', '${flagCode}', '${item.scrobbles}')">${(item.scrobbles || 0).toLocaleString('pt-BR')}</td>
                <td style="text-align:center; font-family:sans-serif; font-size:10px; color:${item.dias_ultimo > 365 ? 'red' : '#666'}">${item.dias_ultimo ?? '-'}</td>
                <td class="clickable-filter" onclick="toggleQuickFilter('country', '${item.country}')">${item.country || '-'}</td>
                <td class="clickable-filter" onclick="toggleQuickFilter('city', '${item.city}')">${item.city || '-'}</td>
                ${yearCells}
                <td style="text-align:center; font-family:sans-serif; font-size:10px;">${item.primeiro_ano || '-'}</td>
            </tr>`;
        }).join('');
        updatePaginationUI();
    }

    // --- LÓGICA DO MODAL ---

    async function showStats(artist, flag, total) {
        modalData.artist = artist;
        const modal = document.getElementById('statsModal');
        const title = document.getElementById('modalTitle');
        modal.style.display = 'flex';
        title.innerHTML = `<img src="https://flagcdn.com/w20/${flag}.png" style="width:20px"> ${artist} <span style="color:var(--primary); margin-left:10px">${parseInt(total).toLocaleString('pt-BR')}</span>`;
        
        document.getElementById('loadingStats').style.display = 'block';
        document.getElementById('statsTable').style.display = 'none';

        const { data, error } = await _supabase.from('scrobbles_test').select('song, album').eq('artist', artist);
        
        if (!error) {
            const sMap = {}, aMap = {};
            data.forEach(x => {
                if(x.song) sMap[x.song] = (sMap[x.song] || 0) + 1;
                if(x.album) aMap[x.album] = (aMap[x.album] || 0) + 1;
            });
            modalData.songs = Object.entries(sMap).map(([title, total]) => ({ title, total }));
            modalData.albums = Object.entries(aMap).map(([title, total]) => ({ title, total }));
            
            document.getElementById('tab-songs').innerText = `MÚSICAS (${modalData.songs.length})`;
            document.getElementById('tab-albums').innerText = `ÁLBUNS (${modalData.albums.length})`;
            
            document.getElementById('loadingStats').style.display = 'none';
            document.getElementById('statsTable').style.display = 'table';
            switchTab('songs');
        }
    }

    function switchTab(type) {
        modalData.currentTab = type;
        modalData.sortCol = 'total';
        modalData.sortAsc = false;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`tab-${type}`).classList.add('active');
        renderModalTable();
    }

    function renderModalTable() {
        const list = modalData[modalData.currentTab];
        const tbody = document.getElementById('stats-tbody');
        const header = document.getElementById('stats-header');
        const label = modalData.currentTab === 'songs' ? 'MÚSICA' : 'ÁLBUM';

        list.sort((a, b) => {
            let vA = a[modalData.sortCol], vB = b[modalData.sortCol];
            if (typeof vA === 'string') { vA = vA.toLowerCase(); vB = vB.toLowerCase(); }
            return modalData.sortAsc ? (vA > vB ? 1 : -1) : (vA < vB ? 1 : -1);
        });

        header.innerHTML = `
            <th class="col-rank">#</th>
            <th class="col-total" onclick="sortModal('total')">TOTAL</th>
            <th class="col-title" onclick="sortModal('title')">${label}</th>
        `;

        tbody.innerHTML = list.map((item, i) => `
            <tr>
                <td class="col-rank">${i + 1}</td>
                <td class="col-total">${item.total.toLocaleString('pt-BR')}</td>
                <td class="col-title" onclick="openDeezer('${item.title.replace(/'/g, "\\'")}', '${modalData.currentTab === 'songs' ? 'track' : 'album'}', '${modalData.artist.replace(/'/g, "\\'")}')">${item.title}</td>
            </tr>
        `).join('');
    }

    function sortModal(col) {
        if(modalData.sortCol === col) modalData.sortAsc = !modalData.sortAsc;
        else { modalData.sortCol = col; modalData.sortAsc = (col === 'title'); }
        renderModalTable();
    }

    function closeModal() { document.getElementById('statsModal').style.display = 'none'; }

    // --- FUNÇÕES ORIGINAIS PRESERVADAS ---

    function openDeezer(term, type, artist = '') {
        const query = artist ? `${artist} ${term}` : term;
        const callbackName = 'dz_' + Math.floor(Math.random() * 100000);
        window[callbackName] = function(data) {
            if (data.data && data.data.length > 0) {
                const id = data.data[0].id;
                window.location.href = `deezer://www.deezer.com/${type}/${id}`;
                setTimeout(() => { if (document.hasFocus()) window.open(data.data[0].link, '_blank'); }, 600);
            } else { window.open(`https://www.deezer.com/search/${encodeURIComponent(query)}`, '_blank'); }
            delete window[callbackName];
        };
        const script = document.createElement('script');
        const searchType = type === 'track' ? 'track' : (type === 'album' ? 'album' : 'artist');
        script.src = `https://api.deezer.com/search/${searchType}?q=${encodeURIComponent(query)}&output=jsonp&callback=${callbackName}`;
        document.body.appendChild(script);
    }

    function toggleQuickFilter(type, value) {
        if (!value || value === '-') return;
        currentFilter = (currentFilter.type === type && currentFilter.value === value) ? { type: null, value: null } : { type, value };
        offset = 0;
        applyLogic();
    }

    function updatePaginationUI() {
        const totalPages = Math.ceil(filteredData.length / limit) || 1;
        const select = document.getElementById('selectPage');
        select.innerHTML = Array.from({length: totalPages}, (_, i) => `<option value="${i+1}" ${i+1 === Math.floor(offset/limit)+1 ? 'selected' : ''}>PÁG ${i+1}</option>`).join('');
        document.getElementById('prevBtn').disabled = offset <= 0;
        document.getElementById('nextBtn').disabled = offset + limit >= filteredData.length;
    }

    function setSort(col) {
        if (sortCol === col) sortAsc = !sortAsc;
        else { sortCol = col; sortAsc = (col === 'artist' || col === 'dias_ultimo'); }
        offset = 0;
        applyLogic();
    }

    function goToPage(p) { offset = (p - 1) * limit; renderTable(); document.querySelector('.table-wrapper').scrollTop = 0; }
    function clearFilters() { document.getElementById('globalSearch').value = ''; currentFilter = { type: null, value: null }; offset = 0; fetchData(); }
    document.getElementById('globalSearch').oninput = () => { offset = 0; applyLogic(); };
    document.getElementById('nextBtn').onclick = () => { if (offset + limit < filteredData.length) { offset += limit; renderTable(); document.querySelector('.table-wrapper').scrollTop = 0; } };
    document.getElementById('prevBtn').onclick = () => { if (offset > 0) { offset -= limit; renderTable(); document.querySelector('.table-wrapper').scrollTop = 0; } };

    fetchData();
</script>
</body>
</html>
