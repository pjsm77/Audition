<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Life Tracker V6 - Advanced Metrics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #ffffff;
            /* Escala de Cores Versão 3 */
            --c1: #ff6b6b; --c2: #ff8787; --c3: #ffa8a8; --c4: #ffc9c9; --c5: #ffe3e3;
            --c6: #d3f9d8; --c7: #b2f2bb; --c8: #8ce99a; --c9: #69db7c; --c10: #40c057;
        }

        body { font-family: 'Segoe UI', system-ui; background: var(--bg); color: var(--text); margin: 0; padding: 10px; }

        .date-display { font-size: 1.1rem; font-weight: bold; color: #4a90e2; text-align: center; margin: 10px 0; text-transform: capitalize; }
        .chart-card { background: var(--card-bg); padding: 15px; border-radius: 15px; height: 220px; margin-bottom: 15px; }

        /* Toolbar de Filtros */
        .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 15px; }
        .toolbar select, .toolbar input { 
            background: #2d2d2d; border: 1px solid #444; color: white; padding: 8px; border-radius: 8px; flex: 1; font-size: 0.8rem;
        }

        /* Grid de 12 Programas */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(95px, 1fr)); gap: 10px; }

        .prog-btn {
            aspect-ratio: 1/1; border-radius: 14px; border: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; transition: all 0.2s; cursor: pointer; color: white;
            padding: 5px;
        }

        /* Opacidade por Status */
        .st-none { opacity: 0.2; filter: grayscale(0.5); }
        .st-active { opacity: 1; filter: none; }

        /* Posicionamento dos dados no botão */
        .top-left { position: absolute; top: 5px; left: 7px; font-size: 0.7rem; font-weight: bold; } /* Qtd Hoje */
        .top-right { position: absolute; top: 5px; right: 7px; font-size: 0.7rem; } /* Estrela/Check */
        .top-center { position: absolute; top: 18%; font-size: 0.6rem; font-weight: bold; opacity: 0.8; } /* Score 7d */
        .bottom-left { position: absolute; bottom: 5px; left: 7px; font-size: 0.65rem; font-weight: bold; background: rgba(0,0,0,0.2); padding: 1px 4px; border-radius: 4px; } /* Nível */
        .bottom-right { position: absolute; bottom: 5px; right: 7px; font-size: 0.65rem; color: #ffca28; } /* Streak */

        .sigla { font-size: 1.1rem; font-weight: 900; margin-top: 5px; }
        .metas { font-size: 0.6rem; opacity: 0.8; margin-top: 2px; }

        /* Modal */
        .modal { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: #252525; border-radius: 20px 20px 0 0; padding: 30px; box-sizing: border-box; z-index: 1000; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999; }
        .modal-input { width: 100%; background: #333; border: 2px solid #444; color: white; padding: 12px; border-radius: 10px; font-size: 1.4rem; text-align: center; }
    </style>
</head>
<body>

    <div id="dateDisplay" class="date-display"></div>
    
    <div class="chart-card">
        <canvas id="perfChart"></canvas>
    </div>

    <div class="toolbar">
        <select id="sortFilter" onchange="renderGrid()">
            <option value="sigla">Sigla</option>
            <option value="nome">Nome</option>
            <option value="categoria">Categoria</option>
            <option value="score">Score 7d</option>
            <option value="status">Realizado</option>
            <option value="streaks">Streaks</option>
        </select>
        <select id="periodFilter" onchange="initDashboard()">
            <option value="7">7 Dias</option>
            <option value="15">15 Dias</option>
            <option value="30">30 Dias</option>
        </select>
        <input type="text" id="searchFilter" placeholder="Buscar..." onkeyup="renderGrid()">
    </div>

    <div class="grid" id="mainGrid"></div>

    <div class="overlay" id="overlay" onclick="closeModal()"></div>
    <div class="modal" id="modal">
        <h2 id="mTitle" style="text-align:center; margin-top:0;"></h2>
        <input type="number" id="valInput" class="modal-input" placeholder="0">
        <p style="text-align:center; color:#888; font-size:0.8rem;">Pressione Enter para salvar</p>
    </div>

<script>
    const COLORS = ["#ff6b6b","#ff8787","#ffa8a8","#ffc9c9","#ffe3e3","#d3f9d8","#b2f2bb","#8ce99a","#69db7c","#40c057"];
    const CATS = { SAUDE: "#40c057", ESTUDOS: "#228be6", PROF: "#fab005", MENTAL: "#be4bdb", SOCIAL: "#fd7e14", FINAN: "#12b886" };

    let db = JSON.parse(localStorage.getItem('life_v6_db')) || { logs: [] };
    let activeDate = new Date().toISOString().split('T')[0];
    let chartInstance = null;

    // 12 Programas com Metadados Aleatórios
    const programs = [
        { s: "LIS", n: "Listening", c: "ESTUDOS", mk: 5, md: 10, lvl: 3, strk: 5 },
        { s: "GYM", n: "Gym", c: "SAUDE", mk: 1, md: 1, lvl: 5, strk: 7 },
        { s: "H2O", n: "Water", c: "SAUDE", mk: 4, md: 8, lvl: 2, strk: 2 },
        { s: "COD", n: "Coding", c: "PROF", mk: 30, md: 60, lvl: 4, strk: null },
        { s: "REA", n: "Reading", c: "MENTAL", mk: 10, md: 20, lvl: 1, strk: 4 },
        { s: "MED", n: "Meditation", c: "MENTAL", mk: 5, md: 15, lvl: 3, strk: 6 },
        { s: "RUN", n: "Running", c: "SAUDE", mk: 3, md: 5, lvl: 2, strk: 1 },
        { s: "SAV", n: "Finance", c: "FINAN", mk: 1, md: 1, lvl: 4, strk: null },
        { s: "ENG", n: "English", c: "ESTUDOS", mk: 20, md: 40, lvl: 5, strk: 3 },
        { s: "SOC", n: "Social", c: "SOCIAL", mk: 1, md: 2, lvl: 2, strk: null },
        { s: "SLP", n: "Sleep", c: "SAUDE", mk: 7, md: 8, lvl: 3, strk: 7 },
        { s: "WRT", n: "Writing", c: "MENTAL", mk: 200, md: 500, lvl: 1, strk: 2 }
    ];

    // Seed: Gerar histórico aleatório nos últimos 7 dias
    if(db.logs.length === 0) {
        for(let i=0; i<7; i++) {
            let d = new Date(); d.setDate(d.getDate() - i);
            let ds = d.toISOString().split('T')[0];
            programs.forEach(p => {
                // Garante barras entre 30% e 100% (aleatório ponderado)
                let randVal = Math.random() > 0.3 ? p.md * (0.3 + Math.random() * 0.7) : 0;
                if(randVal > 0) db.logs.push({ s: p.s, d: ds, v: Math.round(randVal) });
            });
        }
        localStorage.setItem('life_v6_db', JSON.stringify(db));
    }

    function initDashboard() {
        const options = { weekday: 'long', day: 'numeric', month: 'long' };
        document.getElementById('dateDisplay').innerText = new Date(activeDate + "T12:00:00").toLocaleDateString('pt-BR', options);
        renderGrid();
        renderChart();
    }

    function getScore7d(sigla) {
        let totalPct = 0;
        for(let i=0; i<7; i++) {
            let d = new Date(); d.setDate(d.getDate() - i);
            let ds = d.toISOString().split('T')[0];
            let p = programs.find(x => x.s === sigla);
            let dayTotal = db.logs.filter(l => l.s === sigla && l.d === ds).reduce((a, b) => a + b.v, 0);
            totalPct += Math.min(1, dayTotal / p.md);
        }
        return Math.round((totalPct / 7) * 100);
    }

    function renderGrid() {
        const grid = document.getElementById('mainGrid');
        const search = document.getElementById('searchFilter').value.toUpperCase();
        const sort = document.getElementById('sortFilter').value;

        let list = programs.filter(p => p.s.includes(search));

        // Filtros de Ordem
        list.sort((a,b) => {
            if(sort === 'sigla') return a.s.localeCompare(b.s);
            if(sort === 'nome') return a.n.localeCompare(b.n);
            if(sort === 'categoria') return a.c.localeCompare(b.c);
            if(sort === 'score') return getScore7d(b.s) - getScore7d(a.s);
            if(sort === 'streaks') return (b.strk || 0) - (a.strk || 0);
            if(sort === 'status') return getDayTotal(b.s, activeDate) - getDayTotal(a.s, activeDate);
        });

        grid.innerHTML = '';
        list.forEach(p => {
            const todayVal = getDayTotal(p.s, activeDate);
            const score7d = getScore7d(p.s);
            let status = todayVal >= p.mk ? "st-active" : "st-none";
            let badge = todayVal >= p.md ? '<i class="fa-solid fa-star"></i>' : (todayVal >= p.mk ? '<i class="fa-solid fa-check"></i>' : '');

            grid.innerHTML += `
                <div class="prog-btn ${status}" style="background-color: ${CATS[p.c]}" onclick="openModal('${p.s}')">
                    <span class="top-left">${todayVal > 0 ? todayVal : ''}</span>
                    <span class="top-right">${badge}</span>
                    <span class="top-center">${score7d}%</span>
                    <span class="sigla">${p.s}</span>
                    <span class="metas">${p.mk}/${p.md}</span>
                    <span class="bottom-left">L${p.lvl}</span>
                    <span class="bottom-right">${p.strk ? p.strk + '🔥' : ''}</span>
                </div>`;
        });
    }

    function renderChart() {
        const ctx = document.getElementById('perfChart').getContext('2d');
        const period = parseInt(document.getElementById('periodFilter').value);
        const labels = [], scores = [], colors = [];

        for(let i = period - 1; i >= 0; i--) {
            let d = new Date(); d.setDate(d.getDate() - i);
            let ds = d.toISOString().split('T')[0];
            labels.push(ds.split('-')[2]);

            let dayPct = 0;
            programs.forEach(p => {
                let val = db.logs.filter(l => l.d === ds && l.s === p.s).reduce((a,b) => a+b.v, 0);
                dayPct += Math.min(1, val / p.md);
            });
            let final = Math.round((dayPct / 12) * 100);
            scores.push(final);
            colors.push(COLORS[Math.min(9, Math.floor(final/10))]);
        }

        if(chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
            type: 'bar',
            data: { labels, datasets: [{ data: scores, backgroundColor: colors, borderRadius: 6 }] },
            options: {
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { y: { display: false, max: 100 }, x: { grid: { display: false }, ticks: { color: '#888', font: { size: 10 } } } },
                onClick: (e, el) => {
                    if(el.length > 0) {
                        const idx = el[0].index;
                        let d = new Date(); d.setDate(d.getDate() - (period - 1 - idx));
                        activeDate = d.toISOString().split('T')[0];
                        initDashboard();
                    }
                }
            }
        });
    }

    function openModal(sigla) {
        const p = programs.find(x => x.s === sigla);
        document.getElementById('mTitle').innerText = p.n;
        const input = document.getElementById('valInput');
        input.value = '';
        input.onkeypress = (e) => { if(e.key === 'Enter') {
            db.logs.push({ s: sigla, d: activeDate, v: parseFloat(input.value) || 0, t: Date.now() });
            localStorage.setItem('life_v6_db', JSON.stringify(db));
            closeModal(); initDashboard();
        }};
        document.getElementById('modal').style.display = 'block';
        document.getElementById('overlay').style.display = 'block';
        input.focus();
    }

    function closeModal() { document.querySelectorAll('.modal, .overlay').forEach(el => el.style.display = 'none'); }
    function getDayTotal(s, d) { return db.logs.filter(l => l.s === s && l.d === d).reduce((a, b) => a + b.v, 0); }

    initDashboard();
</script>
</body>
</html>
