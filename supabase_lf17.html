<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking Histórico Completo</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --primary: #1DB954; --bg: #121212; --surface: #1e1e1e; --text: #e0e0e0; }
        body { font-family: 'Segoe UI', -apple-system, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 10px; }
        
        /* Layout */
        .container { max-width: 100%; margin: auto; }
        .controls { 
            background: var(--surface); 
            padding: 12px; 
            border-radius: 12px; 
            margin-bottom: 12px; 
            display: flex; 
            gap: 10px; 
            border: 1px solid #333;
            position: sticky;
            top: 10px;
            z-index: 100;
        }
        
        #globalSearch { 
            flex: 1; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #444; 
            background: #2a2a2a; 
            color: white; 
            font-size: 14px;
        }
        
        .btn-clear { background: #444; border: none; color: white; padding: 0 15px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .btn-clear:hover { background: #555; }

        /* Tabela */
        .table-wrapper { 
            background: var(--surface); 
            overflow-x: auto; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 800px; }
        
        th { 
            background: #252525; 
            padding: 12px 8px; 
            border-bottom: 2px solid var(--primary); 
            text-align: left; 
            position: sticky; 
            top: 0; 
            z-index: 10;
        }
        
        td { padding: 10px 8px; border-bottom: 1px solid #2a2a2a; white-space: nowrap; }
        tr:hover { background: rgba(255,255,255,0.03); }
        
        .sort-btn { background: none; border: none; color: #666; cursor: pointer; padding: 0 4px; font-size: 12px; transition: 0.2s; }
        .sort-btn:hover { color: var(--primary); }
        
        /* Colunas de Anos */
        .year-col { color: #888; text-align: center; background: rgba(0,0,0,0.1); width: 45px; }
        .year-val { text-align: center; color: #555; font-size: 11px; font-variant-numeric: tabular-nums; }
        .year-val.active { color: var(--primary); font-weight: bold; background: rgba(29,185,84,0.05); }

        /* Estilos de conteúdo */
        .rank-badge { color: var(--primary); font-weight: bold; font-family: monospace; }
        a { color: var(--text); text-decoration: none; transition: 0.2s; }
        a:hover { color: var(--primary); text-decoration: underline; }
        .long-time { color: #ff4444; opacity: 0.8; }

        /* Paginação */
        .pagination { 
            display: flex; 
            justify-content: center; 
            gap: 12px; 
            padding: 20px; 
            align-items: center; 
            background: #181818; 
            border-radius: 0 0 12px 12px;
        }
        
        .btn-pag { background: #333; border: none; color: white; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-pag:hover:not(:disabled) { background: var(--primary); }
        .btn-pag:disabled { opacity: 0.3; cursor: not-allowed; }
        
        #selectPage { background: #121212; color: white; border: 1px solid #444; padding: 8px; border-radius: 6px; cursor: pointer; }

        /* Mobile */
        @media (max-width: 800px) {
            .col-country, .col-city, .col-start, .col-days { display: none; }
            .year-col { min-width: 40px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <input type="text" id="globalSearch" placeholder="🔍 Buscar artista por nome...">
        <button class="btn-clear" onclick="clearFilters()">Limpar</button>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr id="table-header">
                    <th style="width: 40px;">#</th>
                    <th>Artista <button class="sort-btn" onclick="setSort('artist')">↕</button></th>
                    <th class="col-country">País</th>
                    <th class="col-city">Cidade</th>
                    <th class="col-start">Início <button class="sort-btn" onclick="setSort('primeiro_ano')">↕</button></th>
                    <th class="col-days">Dias <button class="sort-btn" onclick="setSort('dias_ultimo')">↕</button></th>
                    <th>Total <button class="sort-btn" onclick="setSort('scrobbles')">↕</button></th>
                    </tr>
            </thead>
            <tbody id="ranking-body"></tbody>
        </table>
    </div>

    <div class="pagination">
        <button class="btn-pag" id="prevBtn">« Anterior</button>
        <div style="display: flex; align-items: center; gap: 8px;">
            <span>Página</span>
            <select id="selectPage" onchange="goToPage(this.value)"></select>
            <span id="totalPagesLabel"></span>
        </div>
        <button class="btn-pag" id="nextBtn">Próxima »</button>
    </div>
</div>

<script>
    // Configuração Supabase - Certifique-se de usar a chave que começa com 'eyJ...'
    const SUPABASE_URL = 'https://qdawxpcwkadhfwqhnpsd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_W6LnlxFB_jpBKDN2cn5oKQ_j_g1OZO2';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let fullData = [], filteredData = [], offset = 0;
    const limit = 50;
    let sortCol = 'scrobbles', sortAsc = false;

    // Gerar colunas de anos (2026 até 2014)
    const currentYear = 26; // Final 2026
    const startYear = 14;   // Início 2014
    const years = [];
    for (let i = currentYear; i >= startYear; i--) {
        years.push(i);
    }

    const headerRow = document.getElementById('table-header');
    years.forEach(y => {
        const th = document.createElement('th');
        th.className = 'year-col';
        th.innerHTML = `'${y}<br><button class="sort-btn" onclick="setSort('y${y}')">↕</button>`;
        headerRow.appendChild(th);
    });

    async function fetchData() {
        const gs = document.getElementById('globalSearch').value;
        
        try {
            // Chamando a RPC. Importante: o parâmetro 'search_term' deve existir no SQL
            const { data, error } = await _supabase.rpc('get_artist_ranking_full', { 
                search_term: gs || '' 
            });

            if (error) throw error;
            
            fullData = data || [];
            applySort();
        } catch (err) {
            console.error("Erro na busca:", err.message);
        }
    }

    function applySort() {
        filteredData = [...fullData].sort((a, b) => {
            let vA = a[sortCol] === null || a[sortCol] === undefined ? -1 : a[sortCol];
            let vB = b[sortCol] === null || b[sortCol] === undefined ? -1 : b[sortCol];
            
            if (typeof vA === 'string') {
                vA = vA.toLowerCase();
                vB = vB.toLowerCase();
            }

            if (sortAsc) return vA > vB ? 1 : -1;
            return vA < vB ? 1 : -1;
        });
        updateUI();
    }

    function renderTable() {
        const tbody = document.getElementById('ranking-body');
        const paged = filteredData.slice(offset, offset + limit);
        
        tbody.innerHTML = paged.map((item, index) => {
            const yearCells = years.map(y => {
                const val = item[`y${y}`] || 0;
                return `<td class="year-val ${val > 0 ? 'active' : ''}">${val > 0 ? val.toLocaleString() : '-'}</td>`;
            }).join('');

            return `
            <tr>
                <td><span class="rank-badge">${offset + index + 1}</span></td>
                <td><strong><a href="https://www.last.fm/music/${encodeURIComponent(item.artist)}" target="_blank">${item.artist}</a></strong></td>
                <td class="col-country">${item.country || '-'}</td>
                <td class="col-city">${item.city || '-'}</td>
                <td class="col-start">${item.primeiro_ano || '-'}</td>
                <td class="col-days ${item.dias_ultimo > 365 ? 'long-time' : ''}">${item.dias_ultimo ?? '-'}</td>
                <td style="background: rgba(29,185,84,0.1); font-weight: bold; color: var(--primary);">
                    ${(item.scrobbles || 0).toLocaleString('pt-BR')}
                </td>
                ${yearCells}
            </tr>`;
        }).join('');
    }

    function updateUI() {
        const totalPages = Math.ceil(filteredData.length / limit) || 1;
        const select = document.getElementById('selectPage');
        const currentPage = Math.floor(offset / limit) + 1;
        
        select.innerHTML = Array.from({length: totalPages}, (_, i) => 
            `<option value="${i+1}" ${i+1 === currentPage ? 'selected' : ''}>${i+1}</option>`
        ).join('');
        
        document.getElementById('totalPagesLabel').innerText = `de ${totalPages}`;
        document.getElementById('prevBtn').disabled = offset <= 0;
        document.getElementById('nextBtn').disabled = offset + limit >= filteredData.length;
        
        renderTable();
    }

    function setSort(col) {
        if (sortCol === col) sortAsc = !sortAsc;
        else { sortCol = col; sortAsc = false; }
        applySort();
    }

    function goToPage(p) { 
        offset = (p - 1) * limit; 
        renderTable(); 
    }

    function clearFilters() { 
        document.getElementById('globalSearch').value = ''; 
        offset = 0; 
        fetchData(); 
    }

    // Debounce na busca para evitar múltiplas chamadas ao banco enquanto digita
    let searchTimer;
    document.getElementById('globalSearch').oninput = () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
            offset = 0;
            fetchData();
        }, 400);
    };

    document.getElementById('nextBtn').onclick = () => { offset += limit; updateUI(); };
    document.getElementById('prevBtn').onclick = () => { offset -= limit; updateUI(); };

    // Início
    fetchData();
</script>
</body>
</html>
