<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Album Explorer</title>
    <style>
        :root { --rock-red: #e63946; --dark-bg: #0b0d11; --card-bg: #1a1c23; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--dark-bg); color: #fff; margin: 0; padding: 40px; }
        .header { margin-bottom: 40px; }
        h1 { font-size: 2.5rem; color: var(--rock-red); text-transform: uppercase; letter-spacing: 2px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 30px; max-width: 1200px; margin: 0 auto; }
        
        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); border-bottom: 4px solid transparent; position: relative; }
        .card:hover { transform: translateY(-10px); border-color: var(--rock-red); box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
        
        .cover-wrapper { position: relative; cursor: pointer; }
        .cover { width: 100%; aspect-ratio: 1; border-radius: 8px; object-fit: cover; }
        .zoom-hint { position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.7); padding: 5px; border-radius: 50%; font-size: 12px; }

        .flag { width: 24px; vertical-align: middle; margin-left: 8px; border-radius: 2px; }
        h3 { font-size: 1rem; margin: 15px 0 5px; height: 1.2em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #fff; }
        .artist-name { color: #aaa; font-weight: bold; margin-bottom: 10px; display: block; }
        .meta-info { font-size: 0.85rem; color: #777; line-height: 1.6; }
        
        .btn-link { display: inline-block; margin-top: 15px; padding: 8px 15px; background: #333; color: #fff; text-decoration: none; border-radius: 6px; font-size: 0.8rem; transition: 0.3s; }
        .btn-link:hover { background: var(--rock-red); }
        
        button#refresh { background: var(--rock-red); color: white; border: none; padding: 15px 40px; border-radius: 30px; cursor: pointer; font-size: 1.1rem; font-weight: bold; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(230, 57, 70, 0.4); }

        #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center; cursor: pointer; }
        #modal img { max-width: 90%; max-height: 90vh; border-radius: 10px; border: 2px solid var(--rock-red); }
    </style>
</head>
<body>

    <div class="header">
        <h1>?? Rock Archive</h1>
        <p>Explorando os clássicos e novidades do Rock 'n' Roll</p>
        <button id="refresh" onclick="fetchRockAlbums()">Girar a Vitrola</button>
    </div>

    <div class="grid" id="container">Carregando amplificadores...</div>

    <div id="modal" onclick="this.style.display='none'">
        <img id="modal-img" src="">
    </div>

    <script>
        async function fetchRockAlbums() {
            const container = document.getElementById('container');
            container.innerHTML = "Sintonizando rádio...";
            
            try {
                // Buscamos álbuns de Rock (termo amplo para pegar variedades)
                // Usamos 'attribute=genreTerm' para filtrar melhor por Rock
                const response = await fetch(`https://itunes.apple.com/search?term=rock&entity=album&attribute=genreTerm&limit=100`);
                const data = await response.json();
                
                // Sorteia 10 álbuns da lista de 100
                const shuffled = data.results.sort(() => 0.5 - Math.random()).slice(0, 10);
                
                container.innerHTML = "";
                shuffled.forEach(album => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    
                    const highResCover = album.artworkUrl100.replace('100x100bb', '800x800bb');
                    const year = new Date(album.releaseDate).getFullYear();
                    
                    // Conversão de milissegundos para Minutos:Segundos
                    // Nota: trackTimeMillis em álbuns do iTunes costuma ser a soma das faixas
                    const totalMinutes = Math.floor(album.trackTimeMillis / 60000);
                    const durationText = totalMinutes > 0 ? `${totalMinutes} min` : "Duração N/A";

                    // Mapeamento de bandeiras simples (ISO Country Code)
                    const countryCode = album.country.toLowerCase() === 'usa' ? 'us' : album.country.toLowerCase();
                    const flagUrl = `https://flagcdn.com/w40/${countryCode === 'uk' ? 'gb' : countryCode}.png`;

                    card.innerHTML = `
                        <div class="cover-wrapper" onclick="openModal('${highResCover}')">
                            <img src="${album.artworkUrl100}" class="cover" alt="Capa">
                            <span class="zoom-hint">??</span>
                        </div>
                        <h3>${album.collectionName}</h3>
                        <span class="artist-name">
                            ${album.artistName}
                            <img src="${flagUrl}" class="flag" onerror="this.style.display='none'" title="Origem: ${album.country}">
                        </span>
                        <div class="meta-info">
                            <span>?? ${year}</span> • <span>?? ${durationText}</span><br>
                            <span>?? ${album.primaryGenreName}</span> • <span>?? ${album.trackCount} faixas</span>
                        </div>
                        <a href="${album.collectionViewUrl}" target="_blank" class="btn-link">Ver Álbum Completo</a>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                container.innerHTML = "Houve um problema na conexão com o servidor de música.";
                console.error(err);
            }
        }

        function openModal(url) {
            document.getElementById('modal-img').src = url;
            document.getElementById('modal').style.display = 'flex';
        }

        // Início automático
        fetchRockAlbums();
    </script>
</body>
</html>
